# FILL REGRESSION 05 -- trimmed pool must not hit "not enough filler" / overflow.
# CHANGED 2026-06-21: was a FULL base region_lock run (no sealing) -> overflowed
# "No more spots to place N items" every seed. Full ~3900-check base region_lock is
# not a fill-validated mode (even working.yaml seals via num_regions). Re-pinned to
# the proven num_regions capital pattern so trimmed pool curation is what's tested.
# Guards: er-trimmed-forbid-useful-shortage, er-trimmed-curation-impl.
#
# ===== REBUILT 2026-07-27 -- the option set this file was written against is GONE =====
# Every option below is verified live against GFOptions (37 options) by
# tools/fill_regression.py --check-yamls, which REFUSES to run a suite naming an option the
# world does not have. The originals set names that no longer exist anywhere in greenfield --
# region_access, location_pool, missable_location_behavior, excluded_location_behavior,
# torrent_start and world_logic in EVERY file -- so they were silently doing nothing and this
# config had stopped pinning its bug. A reproducer that cannot reproduce launders a regression
# into a pass, which is worse than having no reproducer.
#
# 🛑 READ THIS BEFORE TRUSTING THE FILENAME. Some of the original AXES no longer exist as
# options at all, so this file pins a NARROWER property than its name claims:
#   world_logic / region_access   region locks + warp are simply the model now, not a choice
#   location_pool                 the pool is the whole world; trimmed/all is gone
#   extra_region_locks            no option; area_locks is not yaml-configurable
#   graces_per_region             grace_rando was removed in v0.2
#   soft_progression              progression_surface_mode is FROZEN at strict
#   missable/excluded_*_behavior  protect_missable_locations is FROZEN on
#   torrent_start, early_leveling, pool_builder, auto_upgrade, progressive_stone_bells
#                                 all in defaults.FROZEN_OPTIONS -- they are the behaviour now
# TRANSLATED, not dropped:
#   important_locations -> progression_surface   (same class vocabulary, live successor)
#   smithing_bell_bearing_option -> merchant_bell_logic
#   ending_condition VALUES changed too: capital/elden_beast are dead; the live keys are
#   great_runes / region_locks. Every file here uses region_locks.
# The floors in baseline.json were re-measured on this rebuild -- the old ones described a
# different option set and could not carry over.
name: fillreg05
description: trimmed pool filler-shortage guard (num_regions-sealed)
game: Elden Ring
Elden Ring:
  num_regions: 4
  progression_surface: ["Remembrance", "Church", "Seedtree"]
  progressive_flasks: true
  ending_condition: region_locks
  accessibility: minimal
  progression_balancing: 50
