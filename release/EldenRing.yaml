# ============================================================================
#  ELDEN RING -- Archipelago player config (v0.3)
#
#  Drop this in your Archipelago  Players/  folder and generate.
#
#  THE GAME ID IS `Elden Ring` -- WITH A SPACE.
#  It was `EldenRing` in v0.1. A v0.1 yaml is rejected with:
#      "No world found to handle game EldenRing. Did you mean 'Elden Ring'?"
#  Do NOT retrofit an old yaml. Start from this one. Archipelago SILENTLY
#  IGNORES unknown options, so an old yaml can generate a seed that is not
#  the one you configured, with no error at all.
#
#  Every key below is a REAL option. If you add a key that is not in this
#  file, it will be ignored without warning -- that is Archipelago behaviour,
#  not a bug in this world.
# ============================================================================
#
#  HOW PROGRESSION WORKS (one paragraph, and the options below make sense):
#
#  The world is split into regions, each sealed behind a "<Region> Lock" item
#  in the multiworld pool. Receiving a Lock lights ALL of that region's
#  graces, and you warp in. That is the ONLY way in: vanilla key items and
#  routes gate NOTHING here -- no Rold Medallion for the Mountaintops, no
#  Mohg fight for the DLC. Enter a region whose Lock you do not hold and the
#  client warps you back out. You start at Roundtable Hold with one region
#  already open; the default goal is to hold every Lock in play.
#
#  Two vanilla-flavored exceptions, both ON TOP of the region's own Lock:
#  Raya Lucaria Academy also needs the Academy Glintstone Key (shuffled into
#  the pool; the Academy's graces light when the key arrives), and Leyndell
#  also needs Great Runes (see leyndell_runes_required below).
# ============================================================================

name: Player1
game: Elden Ring
description: Elden Ring -- Archipelago v0.3

Elden Ring:

  # ---- The shape of the run -------------------------------------------------

  # How many regions are DRAWN. 0 = all of them (the full Shattering:
  # 17 base-game regions, or all 28 with the DLC enabled). A sealed region has no
  # checks, no Lock, and no way in. Each KEPT region opens when its Region
  # Lock item arrives -- its graces light and you warp in. This is the
  # marquee mode: it turns the open world into an Archipelago progression
  # graph. Try 4 for a tight evening run.
  #
  # N IS A DRAW SIZE. As of v0.3.7 exactly ONE thing can still add to it: a
  # kept region also keeps the region you must pass THROUGH to reach it
  # (Leyndell keeps Altus). Nothing else. Until v0.3.7 the goal force-kept
  # Farum Azula and Leyndell so the Erdtree could be burned, which is why
  # num_regions: 1 used to hand you four regions; the burn is an item now
  # (see `goal`), so it forces nothing. The generation log prints the
  # breakdown for your seed either way.
  num_regions: 6

  # How the kept regions are chosen when num_regions > 0. It picks WHICH
  # regions you keep -- not where you START, which is always a separate draw
  # weighted by region size over whatever was kept.
  #   rolled        -- a random N (the default). Wilder; every base region
  #                    turns up in roughly a third of seeds.
  #   vanilla_order -- the first N of the game's own progression path
  #                    (Limgrave first). Fully predictable, and the later
  #                    regions never appear at a small N.
  # `vanilla_order` was called `spine` before 0.3.12; that name still works.
  # Either way the seed is winnable: on any seed with the base game in play
  # the run ends at the Elden Beast, which you reach from the Roundtable
  # once the Ashen Capital Lock finds you -- no particular region required.

  # Prefer the vanilla shape to the Shattering? Turn this on.
  #   Regions are gated by REAL vanilla keys and boss remembrances (still
  #   SHUFFLED, so they can be anywhere) in vanilla's own dependency shape --
  #   no synthetic Region Locks, and the whole eligible map is in play.
  #   num_regions is ignored when this is on.
  # This is the answer to "can I turn the Shattering off": you keep the
  # randomizer and lose the region-lock structure.
  natural_progression: false

  # Which bosses hand you their area's loot when you kill them. A ladder:
  #   none         -- no sweeps; every check is picked up where it lies
  #   minidungeons -- catacombs, caves, tunnels, minor dungeons   (~515 checks)
  #   all          -- + legacy dungeons and castles               (~1984)
  #   bosses       -- + field bosses (default; the whole set)     (~3197)
  # `all` is the "sweep dungeons, leave the field alone" setting.
  # 2026-07-29: the three non-none values used to be IDENTICAL -- the class
  # filter was never implemented. They differ now; the default is renamed to
  # `bosses` because that is what all three already granted, so seeds are
  # unchanged.
  dungeon_sweep: bosses

  # WHICH BOSS ENDS THE RUN.
  #   auto             -- derived (default). On ANY seed with the base game in
  #                       play: Godfrey/Hoarah Loux + the Elden Beast. Under
  #                       dlc_only, the major bosses of the deepest kept region.
  #   elden_beast      -- pin that pair explicitly. Forces no regions kept.
  #   promised_consort -- Promised Consort Radahn, the DLC's final boss, and
  #                       FORCE Enir Ilim kept.
  # Why you'd set it: on a full base+DLC seed `auto` ends at the Elden Beast and
  # the whole DLC is optional, so PCR can never become the goal by luck.
  # A choice your other options make impossible FAILS GENERATION rather than
  # quietly falling back (promised_consort needs the DLC in play; elden_beast
  # needs the base game).
  #
  # HOW YOU GET THERE (v0.3.7). Burning the Erdtree used to require killing
  # Maliketh in Crumbling Farum Azula, so the ending only existed on seeds that
  # kept both that region and Leyndell. It is now an ITEM: the ASHEN CAPITAL
  # LOCK is shuffled into the pool like any other progression item, and when it
  # reaches you the Erdtree burns and the Ashen Capital's graces light. Warp in
  # from anywhere. The Ashen Capital is never rolled, never counted by
  # num_regions and never where you start -- it is the gauntlet, not a region
  # you play.
  goal: auto

  # THE TWO LEYNDELLS. Elden Ring ships the capital as two mutually exclusive
  # maps chosen by one save-persisted flag: Leyndell, Royal Capital (Morgott and
  # ~152 checks) before the Erdtree burns, and the Ashen Capital plus the Elden
  # Throne after. Vanilla only ever burns, never un-burns -- so killing Maliketh
  # replaces the Royal Capital permanently, and in region-lock play the Farum
  # Azula Lock lets you do that long before you have finished Leyndell.
  # This option keeps that flag matched to where you actually ARE: warp to a
  # Royal grace or walk in from Altus and the Royal Capital is back; warp to an
  # Ashen grace and the finale is where you left it. It also lets Royal Capital
  # checks carry progression, which is only safe BECAUSE it can restore them.
  # Turn it off to get vanilla's one-way burn back (seeds stay winnable either
  # way -- with it off, Royal Capital checks are barred from progression again).
  #
  # ONE WART, unavoidable: the burn is the game's own event and it switches off
  # Leyndell's grace warp points, so straight after burning you cannot fast-
  # travel into the capital even with the Leyndell Lock. Walk in from Altus
  # through the main gate -- the rune wall is unchanged -- and touch a grace to
  # get the warp back. See KNOWN-ISSUES.md.
  capital_reconciler: true

  # MERCHANT SHOPS OPEN AT THE ROUNDTABLE WHEN YOU TALK TO THEIR OWNER.
  # Open a merchant's shop and their Bell Bearing is handed to the Twin Maiden
  # Husks for you, so that stock is on the Roundtable shelf from then on. You
  # are NOT given the bell -- it stays in the multiworld as a real item for
  # someone to find -- only the shop it would have unlocked. Covers the roving
  # merchants and the named NPC vendors; the peddlers whose bells add stock to
  # the Maidens' own shelf are not covered, and neither are the Ash-of-War,
  # tailoring or upgrade counters.
  # Off by default. A seed with this on REQUIRES a client that supports it and
  # will say so at connect rather than quietly ignore the setting.
  merchant_bells_on_talk: false

  # SCADUTREE BLESSING AS A GAME-WIDE POWER CURVE.
  #   off         -- vanilla (default). Blessing comes only from the Scadutree
  #                  Fragments you hold, and only inside the DLC.
  #   player_only -- the blessing works EVERYWHERE, Limgrave included. Enemies
  #                  are untouched, so this is a straight power boost.
  #   scaled      -- player_only PLUS the per-DLC-region blessing floor.
  # Until 2026-07-31 this option did nothing outside the DLC no matter what you
  # set: the game refuses to apply the blessing's effect outside the Land of
  # Shadow, and the option only wrote the stored value. The client now applies
  # the blessing itself, so the setting finally means what it says.
  # Capped at blessing level 12 (~3.4x combat budget) rather than the full 20 --
  # the last 8 levels cost half the fragment budget for +11% attack.
  # v0.3 also puts the FRAGMENTS to reach that cap in the pool. Before, the cap
  # bounded an injection that was never built, so on a base-game seed the supply
  # arrived purely by luck of the DLC draw -- measured at the default 6 regions,
  # 1 seed in 40 could reach it. Turning this on now gets you the fragments too.
  # Left OFF by default: it is a real power boost, and the DLC combination has
  # not been playtested yet. On a base-game seed it is safe to try.
  global_scadutree_blessing: off

  # What the goal requires.
  #   region_locks  -- hold every Region Lock that is in play (default).
  #   great_runes   -- ALSO collect goal_great_runes Great Runes. You must HOLD the
  #                    runes; killing the boss that vanilla-drops one is NOT enough
  #                    (they are shuffled -- the rune is not at its boss).
  ending_condition: region_locks

  # Only used when ending_condition is great_runes. Clamped down to the
  # Great Runes actually reachable this seed, so it can never make a seed
  # unbeatable.
  goal_great_runes: 2

  # Great Runes needed to get into Leyndell, ON TOP of the Leyndell Lock --
  # echoing the vanilla "two Great Runes to enter the capital". The capital's
  # graces light once this many Great Runes have arrived. 0 disables the
  # gate. Clamped down to the runes actually in the pool, so it can never
  # make a seed unbeatable.
  leyndell_runes_required: 2

  # ---- DLC ------------------------------------------------------------------

  # Shadow of the Erdtree. When on, the 14 DLC regions join the pool and
  # behave EXACTLY like base regions: receive the Lock, graces light, warp
  # in. You never fight Mohg or touch the cocoon to get there. Off here
  # because base game only is the recommended default; the DLC path has had
  # far less play.
  enable_dlc: false

  # ONLY the DLC regions are in play. Implies enable_dlc. The whole base
  # game is sealed, and the goal becomes holding every kept DLC Lock.
  dlc_only: false

  # ---- PLAYING WITH THE DLC -------------------------------------------------
  #
  #  Uncomment this block AS A SET and delete the two `false` lines above. It is
  #  written as one block because the DLC changes more than one number: with it
  #  on there are 28 regions rather than 17, so a `num_regions` tuned for the
  #  base game samples a much thinner slice of a much bigger map.
  #
  #  enable_dlc: true
  #  dlc_only: false          # true = DLC only, base game sealed
  #  num_regions: 10          # 6 of 28 is a very thin seed; 10 keeps the run
  #                           # recognisable. 0 = the whole thing.
  #  goal: auto               # `promised_consort` ends the run in the DLC and
  #                           # force-keeps Enir Ilim -- the only choice that
  #                           # still forces anything. With `auto` on a
  #                           # base+DLC seed the ending is the Elden Beast and
  #                           # the entire DLC is optional -- which is usually
  #                           # not what someone enabling the DLC wants.
  #
  #  Two things happen on their own and need no keys. Hefty vessels are added to
  #  your starting kit so DLC throwing pots are usable, and the Land of Shadow
  #  map layer is unlocked so the map paints (it silently did not, before v0.3).
  #
  #  🛑 `global_scadutree_blessing` above is the one combination with no playtest
  #  behind it: the blessing is native to the DLC, so turning it on there stacks
  #  with what the DLC already gives you. Base-game-only is the tested path.

  # ---- Item pool ------------------------------------------------------------

  # Recipe for the junk-consumable filler tail: {category: weight}.
  # Leave it alone unless you know what you want. Raising `juice` gives you more
  # genuinely useful drops; raising `stones` keeps upgrade materials flowing.
  # The stones / somber_stones / runes weights are an upgrade-economy
  # RESERVATION: they are paid in full before anything else, and a seed whose
  # tail is too small for them to matter says so by name in the generation log
  # (it does not refuse to build -- you get a lean run and a warning). Every seed also guarantees a batch of low-tier smithing
  # stones (regular and somber, enough for an early +3) placed within reach
  # of your starting area. Zero these weights out and that economy is gone --
  # the generator will warn you.
  # This IS the shipped default, written out so you can see and edit it. It is
  # kept in step with the code by test_gf_shipping_yaml_recipe -- if the default
  # is retuned and this block is not, CI fails. (It froze at `stones: 27` once,
  # after that was measured BELOW the +3 affordability floor on 3 of 9 seeds;
  # the gate exists so that cannot happen twice.) Delete the block entirely to
  # follow the default automatically.
  curated_filler:
    juice: 42
    stones: 29
    somber_stones: 6
    runes: 10
    throwables: 6
    pots: 4
    greases: 3
    foods: 2
    boluses: 1

  # How many Sites of Grace a region unlock lights.
  #   all       (default) every warp point in the region -- Liurnia is 59 at once
  #   landmarks one per sub-area (the warp menu's own grouping) -- Liurnia gets 4,
  #             about 50 across the map. Uneven on purpose: it follows the menu,
  #             not region size, so a few regions have one sub-area
  #   entrance  only the way in; you walk to and touch the rest, the vanilla way
  # Cannot strand you and moves no item: unlocks are still the only progression
  # and every check stays put. Purely pacing.
  region_grace_unlock: all

  # How good a piece of gear has to be to count as `juice`.
  #   max (default) -- legendary, rare and B-tier: about 1013 items
  #   high          -- legendary and rare: about 536
  #   normal        -- legendary only: about 149
  # A HIGHER floor is a SMALLER list, and the `juice` weight above does not
  # change -- so raising it asks for the same number of items out of a shorter
  # list and the surplus becomes junk. Measured on one seed: max 1518 gear,
  # high 872, normal 230. It buys quality by paying quantity.
  pool_builder_intensity: max

  # These STEER WHICH GEAR you get. They can never ADD gear -- how much is the
  # `juice` weight in curated_filler above, and at the shipped recipe roughly
  # two fifths of your filler is already real gear. Leaving these at 0 does NOT
  # mean "no gear".
  #
  # They are relative proportions, not percentages of anything: {weapons: 3,
  # spells: 1} and {weapons: 75, spells: 25} are the same request. There is no
  # total to keep under 100.
  #
  # They can only COST you gear, never add any. Each category is drawn from a
  # curated list with a limited number of items good enough to qualify, and
  # spells have the fewest. Ask a category for more than it has and the
  # shortfall becomes junk (the generation log names it). Measured on one seed:
  #   all 0 (default)      1518 gear in the pool   <- the most you can get
  #   weapons 3, spells 1  1138  (-25%)
  #   weapons 100          1085  (-29%)
  # So set these only when you want a particular FLAVOUR of run and are willing
  # to pay for it.
  pool_builder_pct_weapons: 0
  pool_builder_pct_armor: 0
  pool_builder_pct_talismans: 0
  pool_builder_pct_spells: 0
  pool_builder_pct_ashes_of_war: 0

  # Every Golden Seed and Sacred Tear check pays out a single "Progressive
  # Flask Upgrade" item instead, one-for-one. Each copy you receive grants a
  # seed or a tear on an interleaved schedule -- you still spend it at a grace
  # at the game's own escalating price, but upgrades (Sacred Tears included)
  # arrive on a steady cadence instead of 13 silent flat pickups. Off: seeds
  # and tears stay discrete pickups at their shuffled locations.
  progressive_flasks: true

  # Smithing stones by SHOP TIER instead of by luck. On: the Smithing-Stone
  # and Somberstone Miner's Bell Bearings become progressive items -- each
  # copy you receive unlocks the next tier of the Twin Maidens' stone shop,
  # so your upgrade ceiling rises as you find them rather than the first
  # somber stone you trip over deciding it. One copy of each is forced early,
  # so you are never stuck at +0. Never gates logic. Off: vanilla bell
  # bearings, and a lucky early Somber [8] can carry you to +7 in the first
  # area (reported by a player, 2026-08-10).
  progressive_stone_bells: false

  # Items that make your run briefly worse. Empty (default) = none at all.
  # A trap is FILLER: it never holds progression, and each one replaces a
  # junk item, so your seed does not grow. In a multiworld somebody else may
  # be the one who finds them.
  #   rune_thief -- half your runes, gone.
  #   no_flask   -- your flask heals nothing for 20s. You can still drink it;
  #                 it just does nothing, and the charge is spent.
  #   runebear   -- a Runebear appears exactly where you are standing. Kill
  #                 it and you keep the runes.
  #   basilisk   -- THREE basilisks appear where you are standing. One is a
  #                 joke; three is the Death Blight mist, which kills
  #                 outright. Killing you sends a DeathLink.
  traps: []

  # THE ESCAPE HATCH: any other enemy in the game, by character model id.
  # `traps` above carries the ones we named; this takes any of the 390
  # spawnable models, e.g. [4630] for a Runebear or [4980] for a Death Rite
  # Bird. One appears where you are standing.
  #
  # An id that cannot be spawned is a yaml ERROR rather than an item that
  # silently never fires -- 26 models are excluded because they have no AI
  # row or no body. Naming the same enemy here and in `traps` is harmless;
  # it is one item either way.
  spawn_traps: []

  # How many trap items to shuffle in, shared evenly between the traps you
  # enabled above. Inert while both `traps` and `spawn_traps` are empty.
  trap_count: 8

  # Share of YOUR filler that other players' worlds may draw from, in a
  # multiworld. 100 = fully shared. 0 = keep your filler to yourself.
  filler_foreign_pct: 100

  # On: every real vanilla item this seed produces stays in YOUR world.
  local_item_only: false

  # ---- Where progression may hide -------------------------------------------

  # WHICH LOCATIONS MAY HOLD PROGRESSION. Shrinking this makes the run tighter
  # and more predictable; widening it scatters key items further afield.
  progression_surface:
    - MajorBoss
    - Remembrance
    - GreatRune
    - KeyItem
    - Church
    - Seedtree
    - Fragment
    - Revered
    - ShopSlot

  # In a MULTIWORLD, what PERCENT of other players' progression is confined to your
  # progression_surface, the way your own is. 100 confines all of it, so a foreign
  # key item lands on one of your major-boss / key-item / etc. checks and never on a
  # random filler pickup. 0 confines none and it scatters across any reachable check
  # of yours (standard AP). `true` and `false` still work and still mean 100 and 0.
  #
  # 🛑 IT ALSO DECIDES WHETHER YOUR GEAR IS WORTH RECEIVING. The rule is about YOUR
  # locations, but it pushes your NEIGHBOUR's progression back into the neighbour's
  # own slots, which fills them before Archipelago places the `useful` tier -- so at
  # 100 a non-Elden-Ring partner gets nothing from you but filler. Measured on a
  # two-slot seed beside Hollow Knight: 0.0% of what the partner received from us was
  # useful at 100, 5.2% at 90, 23.2% at 75, 38.3% at 50. Lower it if you want your
  # weapons, armour and talismans to show up in your friends' games; the price is
  # that their keys stop being curated onto your interesting checks. See the
  # per-value table in the option's own help text.
  #
  # No effect in a solo seed. Never blocks generation.
  confine_foreign_progression: 100

  # RESERVED. The option exists but is INERT in v0.2 -- shop checks are assumed
  # reachable regardless of what you set here. Left in place so seeds stay
  # forward-compatible; see KNOWN-ISSUES.md. Leave it alone.
  merchant_bell_logic: off

  # ---- Runtime rerolls ------------------------------------------------------

  # Reroll what farmable enemies drop. Their ONE-TIME drops (the actual AP
  # checks) are untouched -- this only changes the repeatable farm drops.
  reroll_enemy_drops: true

  # Reroll every unlimited-stock merchant slot to a random high-impact
  # consumable, priced at what the item is worth. Merchants stop being a wall
  # of Arrows. (Unlimited slots can never be checks -- there is no way to
  # observe a purchase on them -- so nothing is lost by rerolling.)
  reroll_infinite_shop_stock: true

  # A shop check keeps the price of the ware it USED to sell. That is right for
  # gear -- a randomised item at this merchant's price -- and wrong when the
  # reward is a RUNE, because a rune is just money: a 3500-rune slot selling a
  # Golden Rune [1] worth 2000 is a slot nobody will ever press, and the check
  # behind it goes uncollected. On, the price is rolled into [0, 2x the rune's
  # own worth] per seed, per slot: sometimes free, sometimes a bad trade.
  # Off (default) keeps the original price.
  rune_shop_pricing: false

  # Wares the HUB merchant always stocks, unlimited, instead of leaving those
  # shelves to the reroll above. Up to FOUR -- that is how many unlimited
  # shelves the hub has, and asking for more is rejected with a message rather
  # than quietly dropping the extras. Each is sold at its own derived price, so
  # a shelf never becomes a free dispenser. Empty = unchanged.
  #   infinite_hub_wares: ["Rune Arc", "Larval Tear"]
  # Worth a thought before filling it in: unlimited Larval Tears is unlimited
  # respec, and unlimited Rune Arcs is a permanent great-rune buff.
  infinite_hub_wares: []

  # Categories of YOUR OWN item that merchants may never stock -- both the shop
  # checks themselves (bell-bearing shops included) and the unlimited shelves
  # above. The items still exist and are still shuffled; they just land out in
  # the world instead of behind a purchase menu, so finding them is a matter of
  # going somewhere rather than of having enough runes.
  #   keep_out_of_shops: [weapons, armor]
  # Categories: weapons, armor, talismans, ashes (ashes of WAR), spells,
  # spirit_ashes, consumables, crafting, cookbooks, upgrade_materials,
  # upgrade_bells, merchant_bells, runes, crystal_tears, key_items, other,
  # progressive -- plus the umbrellas `goods`, `key_items` (the whole inventory
  # tab: key items, cookbooks and both kinds of bell bearing), `bell_bearings`
  # and `everything`. Other players' items at your shops are never affected.
  #
  # On a SMALL seed there may not be room: the hub alone is 184 shop rows out of
  # 224 locations, and a category holding more items than there are non-shop
  # slots to move them to is skipped -- the generation log names which one and
  # by how much. Full-world seeds have room to spare.
  keep_out_of_shops: []

  # ---- Difficulty -----------------------------------------------------------

  # Enemies get stronger the FURTHER INTO YOUR RUN a region is -- not by where it
  # sits on the map. Unlock the Weeping Peninsula last and it will be tuned like
  # endgame territory. This is always on; the two knobs below only shape it.
  #
  # Both are 0-100, and on both, HIGHER IS HARDER. Leave them at 0 for the
  # standard curve. Enemy rune rewards never change, at any setting.

  # How hard the EASIEST enemies are. Raising this lifts the whole floor, so
  # nowhere stays a walkover -- handy because an "early" region you unlock late
  # would otherwise be free.
  #     0   normal                                        (default)
  #    25   nothing below about 2x enemy HP
  #    50   nothing below about 4x
  #   100   everything at maximum, everywhere, immediately
  minimum_enemy_difficulty: 0

  # Whether enemy difficulty follows your PROGRESSION instead of the map.
  # Off = VANILLA: every enemy keeps exactly the strength the base game gave it,
  # the client stops touching enemies entirely, and the three sliders here stop
  # meaning anything. Choose it if you want the item randomizer without the
  # difficulty curve. Not the same as "easier" -- it is the game's own curve,
  # which in a randomized world can mean a late-game area at level 20.
  enemy_scaling: true

  # How hard the TOUGHEST enemies get.
  #  auto   scale the cap to the LENGTH of your run        (default)
  #   100   no cap -- your deepest region reaches the game's own maximum,
  #         roughly 7.4x enemy HP, what vanilla saves for its endgame
  #    75   nothing above about 5.5x enemy HP
  #    50   nothing above about 4x
  #    25   nothing above about 2x
  # `auto` is here because the curve is relative and your gear is not. Scaling
  # ramps over the ORDER your regions unlock, so the deepest one is "the end of
  # the run" whether that is 30 regions or 5 -- but Somber +10 still needs a
  # Somber [9]. On a short seed you meet endgame enemies on a mid-game weapon,
  # and FEWER regions makes the ramp steeper, not gentler. auto lowers the top
  # of the curve with the length of the run: about 4.1x at 5 regions, the full
  # 7.4x at 30. Give a number instead to choose the cap yourself.
  # Must be >= minimum_enemy_difficulty (auto is raised to it rather than
  # failing the seed, since you did not choose the cap).
  # NOTE: a cap below 100 needs an up-to-date client. An older one refuses the
  # seed and says so, rather than quietly ignoring the cap.
  maximum_enemy_difficulty: auto

  # How QUICKLY you reach the hardest enemies. This does not change how hard the
  # hardest enemies are -- it changes how much of the run is spent below them.
  #     0   spread evenly across the run                  (default)
  #    50   maximum from about halfway
  #    75   maximum about a quarter of the way in
  #   100   maximum almost immediately
  difficulty_ramp_speed: 0

  # What your equipment WEIGHS, and therefore which roll you get.
  #   off     (default) equipment weighs what it weighs -- your kit is a budget
  #   light   equipment weighs nothing: always light roll, whatever you wear.
  #           Heavy armour and greatshields cost you nothing at all
  #   medium  never worse than a medium roll -- the ceiling is raised far enough
  #           that no real kit fat-rolls, but the light-roll threshold still
  #           moves with what you put on, so armour is still a decision
  # The game recomputes max equip load every frame from Endurance, so the client
  # multiplies the WEIGHT side instead and logs the equip load it actually got.
  # NOTE: `medium` needs an up-to-date client. An older one refuses the seed and
  # says so, rather than connecting and quietly giving you `light` -- which is
  # the STRONGER setting you did not ask for. `off` and `light` work on any
  # client, as they always have.
  no_equip_load: off

  # ---- Standard Archipelago options -----------------------------------------

  # region_lock seeds want `minimal`, not `full`.
  accessibility: minimal
  progression_balancing: 50

  # Shared deaths in a multiworld. Works in both directions.
  death_link: false


