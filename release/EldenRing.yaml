# ============================================================================
#  ELDEN RING -- Archipelago player config (v0.3)
#
#  Drop this in your Archipelago  Players/  folder and generate.
#
#  THE GAME ID IS `Elden Ring` -- WITH A SPACE.
#  It was `EldenRing` in v0.1. A v0.1 yaml is rejected with:
#      "No world found to handle game EldenRing. Did you mean 'Elden Ring'?"
#  Do NOT retrofit an old yaml. Start from this one. Archipelago SILENTLY
#  IGNORES unknown options, so an old yaml can generate a seed that is not
#  the one you configured, with no error at all.
#
#  Every key below is a REAL option. If you add a key that is not in this
#  file, it will be ignored without warning -- that is Archipelago behaviour,
#  not a bug in this world.
# ============================================================================
#
#  HOW PROGRESSION WORKS (one paragraph, and the options below make sense):
#
#  The world is split into regions, each sealed behind a "<Region> Lock" item
#  in the multiworld pool. Receiving a Lock lights ALL of that region's
#  graces, and you warp in. That is the ONLY way in: vanilla key items and
#  routes gate NOTHING here -- no Rold Medallion for the Mountaintops, no
#  Mohg fight for the DLC. Enter a region whose Lock you do not hold and the
#  client warps you back out. You start at Roundtable Hold with one region
#  already open; the default goal is to hold every Lock in play.
#
#  TWO regions are different, and this is the most-reported non-bug in the
#  mod. Raya Lucaria Academy (the seal) and Leyndell (the main gate) sit
#  behind a wall the GAME enforces, so receiving their Lock LIGHTS NOTHING --
#  the Lock arrives and nothing visibly happens. You open them the vanilla
#  way and touch the graces yourself: the Academy with its Glintstone Key
#  (shuffled into the pool), the capital by walking in from Altus holding
#  leyndell_runes_required Great Runes. The Shunning-Grounds sewer is part of
#  Leyndell (v0.4.10 merged them): once the capital opens, the well is yours,
#  and its graces ride the Leyndell Lock's bundle.
#
#  leyndell_runes_required: 0 is the only setting that changes this, and only
#  for the capital.
# ============================================================================

name: Player1
game: Elden Ring
description: Elden Ring -- Archipelago v0.3

Elden Ring:

  # ---- The shape of the run -------------------------------------------------

  # How many regions are DRAWN. 0 = all of them (the full Shattering:
  # 17 base-game regions, or all 28 with the DLC enabled). A sealed region has no
  # checks, no Lock, and no way in. Each KEPT region opens when its Region
  # Lock item arrives -- its graces light and you warp in. This is the
  # marquee mode: it turns the open world into an Archipelago progression
  # graph. Try 4 for a tight evening run.
  #
  # N IS A DRAW SIZE. As of v0.3.7 exactly ONE thing can still add to it: a
  # kept region also keeps the region you must pass THROUGH to reach it
  # (Leyndell keeps Altus). Nothing else. Until v0.3.7 the goal force-kept
  # Farum Azula and Leyndell so the Erdtree could be burned, which is why
  # num_regions: 1 used to hand you four regions; the burn is an item now
  # (see `goal`), so it forces nothing. The generation log prints the
  # breakdown for your seed either way.
  num_regions: 6

  # WHICH region the run OPENS IN, by name. Empty (default) = any kept region,
  # drawn the way it always was. Name one and you start there; name several and
  # the opening region is drawn from just those.
  #
  # 🛑 Every region you name is FORCE-KEPT, so this can make a seed bigger than
  # `num_regions` asked for -- that number is a draw size and force-keeps are
  # additive (the generation log names the contribution). Naming three regions
  # and asking for one is a three-region seed, not a one-region seed with a
  # choice. For "just play Caelid", name one and set num_regions: 1.
  #
  # Names: Limgrave, Liurnia, Caelid, Altus, Stormveil, Raya Lucaria Academy,
  # Mt. Gelmir, Mountaintops of the Giants, Weeping, Deeproot Depths, Siofra
  # River, Ainsel River, Mohgwyn, Farum Azula, Haligtree -- and with the DLC on:
  # Gravesite, Belurat, Ensis, Scadu Altus, Shadow Keep, Rauh Base, Ancient
  # Ruins, Cerulean, Abyssal, Jagged Peak. Naming a region this seed cannot open
  # in -- sealed by your DLC toggles, needed by your goal, or reached through a
  # parent region -- fails generation and says which and why. So does naming
  # FEWER regions than start_regions asks for: the run can only open in the
  # regions you list, so a one-name pool cannot seat two starting regions, and
  # raising num_regions will not help (this option narrows the pool before the
  # starting regions are drawn).
  start_region_pool: []

  # How the kept regions are CHOSEN when num_regions > 0. This picks WHICH
  # regions you keep; it does not pick where you start (that is always a
  # separate size-weighted draw over whatever ends up kept, unless
  # start_region_pool names it).
  #   rolled        -- N drawn at random (default). Every base region turns up
  #                    in roughly a third of seeds.
  #   vanilla_order -- the first N along the game's own path: Limgrave,
  #                    Weeping, Stormveil, Liurnia, and so on. Fully
  #                    deterministic -- the same num_regions always keeps the
  #                    same regions, and the later ones can never appear at
  #                    small N. Pick it for a predictable early-game run.
  num_regions_order: rolled

  # How many regions are OPEN at run start. 1 (default) is the classic single
  # opening region; higher values precollect that many Region Locks, so you
  # begin with more of the map reachable and fewer locks left to find.
  #
  # It must stay BELOW the number of regions the seed actually kept -- holding
  # every kept Lock at connect would complete the goal before you play -- and
  # generation fails loudly, naming both numbers, if it does not. Remember
  # num_regions is a DRAW SIZE: a seed can keep more than you asked for.
  # The goal region is never one of the extras.
  #
  # Ignored under natural_progression, which mints no Lock items at all.
  start_regions: 1

  # How the kept regions are chosen when num_regions > 0. It picks WHICH
  # regions you keep -- not where you START, which is a separate draw weighted
  # by region size over whatever was kept, unless start_region_pool names it.
  #   rolled        -- a random N (the default). Wilder; every base region
  #                    turns up in roughly a third of seeds.
  #   vanilla_order -- the first N of the game's own progression path
  #                    (Limgrave first). Fully predictable, and the later
  #                    regions never appear at a small N.
  # `vanilla_order` was called `spine` before 0.3.12; that name still works.
  # Either way the seed is winnable: on any seed with the base game in play
  # the run ends at the Elden Beast, which you reach from the Roundtable
  # once the Ashen Capital Lock finds you -- no particular region required.

  # Prefer the vanilla shape to the Shattering? Turn this on.
  #   Regions are gated by REAL vanilla keys and boss remembrances (still
  #   SHUFFLED, so they can be anywhere) in vanilla's own dependency shape --
  #   no synthetic Region Locks, and the whole eligible map is in play.
  #   num_regions is ignored when this is on.
  # This is the answer to "can I turn the Shattering off": you keep the
  # randomizer and lose the region-lock structure.
  natural_progression: false

  # Which bosses hand you their area's loot when you kill them. A ladder:
  #   none         -- no sweeps; every check is picked up where it lies
  #   minidungeons -- catacombs, caves, tunnels, minor dungeons   (~515 checks)
  #   all          -- + legacy dungeons and castles               (~1984)
  #   bosses       -- + field bosses (default; the whole set)     (~3197)
  # `all` is the "sweep dungeons, leave the field alone" setting.
  # 2026-07-29: the three non-none values used to be IDENTICAL -- the class
  # filter was never implemented. They differ now; the default is renamed to
  # `bosses` because that is what all three already granted, so seeds are
  # unchanged.
  dungeon_sweep: bosses

  # "Does killing a boss give me EVERY item in the area?" (siffrin + bobler,
  # #1033). Off by default, and off is the current behaviour: a sweep pays out
  # the area's ordinary loot but leaves the classes you put on
  # progression_surface where they lie, because that is where this seed hid its
  # key items -- at the default surface, Golden Seeds, Sacred Tears, Scadutree
  # Fragments and Revered Spirit Ashes.
  # Turn it on and nothing is held back: the boss hands over its whole area,
  # progression included. It cannot strand you -- a sweep only grants checks in
  # a region you kept, behind a boss you could already reach.
  # Still never swept, whatever this says: another boss's reward, remembrance
  # or Great Rune, quest/gate key items, and merchant stock.

  full_area_sweeps: false

  # Show the names of bosses whose sweep payouts are still hidden behind a region lock.
  # Off by default so the tracker does not spoil bosses before you enter their regions.
  # Even when enabled, the locked region and pending payout count stay hidden.
  reveal_sweep_boss_names: false

  # WHICH BOSS ENDS THE RUN.
  #   auto             -- derived (default). On ANY seed with the base game in
  #                       play: Godfrey/Hoarah Loux + the Elden Beast. Under
  #                       dlc_only, the major bosses of the deepest kept region.
  #   elden_beast      -- pin that pair explicitly. Forces no regions kept.
  #   promised_consort -- Promised Consort Radahn, the DLC's final boss, and
  #                       FORCE Enir Ilim kept.
  #   malenia          -- Malenia alone. FORCE Haligtree kept, then grant only
  #                       Haligtree Canopy: walk the full Loretta -> Elphael ->
  #                       Malenia route instead of warping to a later grace.
  # Why you'd set it: on a full base+DLC seed `auto` ends at the Elden Beast and
  # the whole DLC is optional, so PCR can never become the goal by luck.
  # A choice your other options make impossible FAILS GENERATION rather than
  # quietly falling back (promised_consort needs the DLC in play; elden_beast
  # and malenia need the base game).
  #
  # HOW YOU GET THERE (v0.3.7). Burning the Erdtree used to require killing
  # Maliketh in Crumbling Farum Azula, so the ending only existed on seeds that
  # kept both that region and Leyndell. It is now an ITEM: the ASHEN CAPITAL
  # LOCK is shuffled into the pool like any other progression item, and when it
  # reaches you the Erdtree burns and the Ashen Capital's graces light. Warp in
  # from anywhere. The Ashen Capital is never rolled, never counted by
  # num_regions and never where you start -- it is the gauntlet, not a region
  # you play.
  goal: auto

  # THE TWO LEYNDELLS. Elden Ring ships the capital as two mutually exclusive
  # maps chosen by one save-persisted flag: Leyndell, Royal Capital (Morgott and
  # ~152 checks) before the Erdtree burns, and the Ashen Capital plus the Elden
  # Throne after. Vanilla only ever burns, never un-burns -- so killing Maliketh
  # replaces the Royal Capital permanently, and in region-lock play the Farum
  # Azula Lock lets you do that long before you have finished Leyndell.
  # This option keeps that flag matched to where you actually ARE: warp to a
  # Royal grace or walk in from Altus and the Royal Capital is back; warp to an
  # Ashen grace and the finale is where you left it. It also lets Royal Capital
  # checks carry progression, which is only safe BECAUSE it can restore them.
  # Turn it off to get vanilla's one-way burn back (seeds stay winnable either
  # way -- with it off, Royal Capital checks are barred from progression again).
  #
  # ONE WART, unavoidable: the burn is the game's own event and it switches off
  # Leyndell's grace warp points, so straight after burning you cannot fast-
  # travel into the capital even with the Leyndell Lock. Walk in from Altus
  # through the main gate -- the rune wall is unchanged -- and touch a grace to
  # get the warp back. See KNOWN-ISSUES.md.
  capital_reconciler: true

  # MERCHANT SHOPS OPEN AT THE ROUNDTABLE WHEN YOU TALK TO THEIR OWNER.
  # Open a merchant's shop and their Bell Bearing is handed to the Twin Maiden
  # Husks for you, so that stock is on the Roundtable shelf from then on. You
  # are NOT given the bell -- it stays in the multiworld as a real item for
  # someone to find -- only the shop it would have unlocked. Covers the roving
  # merchants and the named NPC vendors; the peddlers whose bells add stock to
  # the Maidens' own shelf are not covered, and neither are the Ash-of-War,
  # tailoring or upgrade counters.
  # Off by default. A seed with this on REQUIRES a client that supports it and
  # will say so at connect rather than quietly ignore the setting.
  merchant_bells_on_talk: false

  # SCADUTREE BLESSING AS A GAME-WIDE POWER CURVE.
  #   off         -- vanilla (default). Blessing comes only from the Scadutree
  #                  Fragments you hold, and only inside the DLC.
  #   player_only -- the blessing works EVERYWHERE, Limgrave included. Enemies
  #                  are untouched, so this is a straight power boost.
  #   scaled      -- player_only PLUS the per-DLC-region blessing floor.
  # Until 2026-07-31 this option did nothing outside the DLC no matter what you
  # set: the game refuses to apply the blessing's effect outside the Land of
  # Shadow, and the option only wrote the stored value. The client now applies
  # the blessing itself, so the setting finally means what it says.
  # Capped at blessing level 12 (~3.4x combat budget) rather than the full 20 --
  # the last 8 levels cost half the fragment budget for +11% attack.
  # v0.3 also puts the FRAGMENTS to reach that cap in the pool. Before, the cap
  # bounded an injection that was never built, so on a base-game seed the supply
  # arrived purely by luck of the DLC draw -- measured at the default 6 regions,
  # 1 seed in 40 could reach it. Turning this on now gets you the fragments too.
  # Left OFF by default: it is a real power boost, and the DLC combination has
  # not been playtested yet. On a base-game seed it is safe to try.
  global_scadutree_blessing: off

  # Whether the goal also requires Great Runes (independent of the region policy below).
  #   region_locks  -- compatibility spelling for no Great Rune requirement (default).
  #   great_runes   -- collect goal_great_runes Great Runes. You must HOLD the
  #                    runes; killing the boss that vanilla-drops one is NOT enough
  #                    (they are shuffled -- the rune is not at its boss).
  #                    Any distinct Great Runes count. By default this means any
  #                    four of all seven; no particular named rune is mandatory.
  ending_condition: region_locks

  # Only used when ending_condition is great_runes. Clamped down to the
  # Great Runes actually reachable this seed, so it can never make a seed
  # unbeatable. This is a count over all seven eligible Great Runes.
  goal_great_runes: 4

  # What opens the final goal region (Ashen Capital, or the DLC goal terminus).
  #   none              -- no region-side requirement; useful for Great Runes-only goals.
  #   items_held        -- the existing behavior: hold every Region Lock in play.
  #   regions_completed -- clear every progression-surface check in each required
  #                        non-goal region. For shop checks, merely viewing the
  #                        merchant's inventory counts; no purchase is required.
  #                        Progress is restored when reconnecting.
  # This is independent of ending_condition, giving six possible combinations.
  goal_region_unlock_policy: items_held

  # Great Runes needed to get into Leyndell, ON TOP of the Leyndell Lock --
  # echoing the vanilla "two Great Runes to enter the capital".
  #
  # This does NOT light the capital's graces. Leyndell sits behind a wall the
  # game itself enforces, so its grace bundle is withheld while this gate is
  # armed: the Lock arrives and nothing visibly happens. You walk in from Altus
  # through the game's own main gate holding this many Great Runes, and touch
  # the graces yourself. 0 disables the gate, and is the one setting that hands
  # you the capital's grace bundle on the Leyndell Lock instead.
  #
  # FLOORED at the vanilla 2, not clamped down: the game's gate is a fixed
  # two-rune wall that does not clamp with us, so a lower number would seal the
  # capital behind a door logic thinks is open. When the seed cannot supply
  # that many, the pool is topped up rather than the gate disarmed.
  leyndell_runes_required: 2

  # ---- DLC ------------------------------------------------------------------

  # Shadow of the Erdtree. When on, the 14 DLC regions join the pool and
  # behave EXACTLY like base regions: receive the Lock, graces light, warp
  # in. You never fight Mohg or touch the cocoon to get there. Off here
  # because base game only is the recommended default; the DLC path has had
  # far less play.
  enable_dlc: false

  # Include equipment from the paid Tarnished Pack in the randomized item
  # pool. Off by default so a player who does not own it can never receive an
  # unusable item. When on, its eight verified player weapons/shields and all
  # 18 armor pieces are honorary S-tier pool-builder gear. This first slice
  # does not add the pack's new locations or Spectral Steed attire unlocks.
  enable_tarnished_pack: false

  # ONLY the DLC regions are in play. Implies enable_dlc. The whole base
  # game is sealed, and the goal becomes holding every kept DLC Lock.
  dlc_only: false

  # WHERE the Scadutree blessing applies.
  #   dlc_only -- vanilla. It is a Land of Shadow mechanic and does
  #               nothing in Limgrave, exactly as FromSoft shipped it.
  #   anywhere -- default. The blessing becomes a GAME-WIDE power curve driven by the
  #               fragments the multiworld sends you. Enemies are untouched,
  #               so this is explicitly a power fantasy.
  # (Vanilla rungs last 50ms and are re-applied by a loop that only runs in
  # the DLC; the client clones the rung onto a row with no expiry to make
  # `anywhere` possible at all.)
  scadutree_blessing_scope: anywhere

  # Guarantee each DLC region's expected Scadutree Blessing WHILE YOU STAND IN
  # IT. DLC enemies are tuned around a per-area blessing level, but here the
  # fragments that raise blessing are scattered multiworld checks -- so the
  # fill can hand you Shadow Keep at blessing 0 through no decision of yours.
  # This lifts you to that area's floor; fragments you collect still buy
  # visible power above it.
  #
  # 🛑 SCOPED TO WHERE YOU STAND, not to what you unlocked. The client re-reads
  # your play_region every tick and the floor leaves with you. Nothing is
  # granted. Inert outside the DLC.
  dlc_blessing_catchup: false

  # ---- PLAYING WITH THE DLC -------------------------------------------------
  #
  #  Uncomment this block AS A SET and delete the two `false` lines above. It is
  #  written as one block because the DLC changes more than one number: with it
  #  on there are 28 regions rather than 17, so a `num_regions` tuned for the
  #  base game samples a much thinner slice of a much bigger map.
  #
  #  enable_dlc: true
  #  dlc_only: false          # true = DLC only, base game sealed
  #  num_regions: 10          # 6 of 28 is a very thin seed; 10 keeps the run
  #                           # recognisable. 0 = the whole thing.
  #  goal: auto               # `promised_consort` ends the run in the DLC and
  #                           # force-keeps Enir Ilim -- the only choice that
  #                           # still forces anything. With `auto` on a
  #                           # base+DLC seed the ending is the Elden Beast and
  #                           # the entire DLC is optional -- which is usually
  #                           # not what someone enabling the DLC wants.
  #
  #  Two things happen on their own and need no keys. Hefty vessels are added to
  #  your starting kit so DLC throwing pots are usable, and the Land of Shadow
  #  map layer is unlocked so the map paints (it silently did not, before v0.3).
  #
  #  🛑 `global_scadutree_blessing` above is the one combination with no playtest
  #  behind it: the blessing is native to the DLC, so turning it on there stacks
  #  with what the DLC already gives you. Base-game-only is the tested path.

  # ---- Item pool ------------------------------------------------------------

  # Want the vanilla item spread instead of a curated one? This is the switch,
  # and it is the ONLY thing you need to set -- it does both halves.
  #   false (default) the pool is curated: the recipe below spends the filler
  #                   tail, and a guaranteed set of physick tears and smithing
  #                   bell bearings is added to the pool
  #   true            every check pays what it pays in vanilla Elden Ring, and
  #                   nothing is added
  # Emptying `curated_filler` below does only the FIRST half. The tears and bell
  # bearings come from a separate feature, so a seed built that way still hands
  # you up to 18 tears vanilla never placed -- which is exactly the confusion
  # this option exists to end. Setting this OVERRIDES the recipe below (the
  # generation log says so); you do not have to clear it as well.
  # 🛑 It costs you the whole economy: no gear injection, no smithing-stone or
  # rune supply, and no guarantee a physick tear or bell bearing exists at all
  # in a seed that seals their home regions. If you only wanted LESS gear,
  # lower `juice` below instead.
  vanilla_pool: false

  # WHERE THE ITEMS ARE. `off` (default) is the randomizer: every check's
  # vanilla item is shuffled across the multiworld.
  #
  # `all` puts every item back exactly where the base game keeps it -- the
  # Dectus halves in their forts, the Academy Glintstone Key on its corpse,
  # every Golden Seed on its sapling. Checks still fire, the tracker still
  # works, Death Link still works. Nothing is sent to or received from other
  # worlds: the seed is self-contained by design. This is the setting for a
  # group who want to play the base game together and share deaths.
  #
  # Progression is gated the way the base game gates it, so the region locks
  # are not used and num_regions is ignored -- the whole map is in play from
  # the start, and the Leyndell wall and Rold Medallion work as they always
  # did. THE START IS VANILLA TOO: no lantern, no extra flasks, no Torrent, no
  # Spirit Calling Bell, no revealed maps, no levelling until you meet Melina.
  #
  # 🛑 Vanilla PLACEMENT and a vanilla START, not vanilla BALANCE -- weapons
  # still upgrade automatically and still ignore stat requirements. It also
  # inherits the base game's own missables: burning the Erdtree still strands
  # Leyndell's checks.
  vanilla_placement: off

  # What may be placed at the 285 checks that can be lost behind a spent
  # currency, a killable NPC, or questline state.
  #   progression_and_useful -- filler only (default): losing the check cannot
  #                             take required progression or useful gear
  #   progression            -- the old behaviour: protects winnability, but a
  #                             useful weapon, spell, summon, or tear may be lost
  #   off                    -- no protection; for guaranteed-access play
  # Legacy booleans remain valid: true selects the new default, false selects off.
  # The spelling `progression+useful` is also accepted.
  protect_missable_locations: progression_and_useful

  # Each complete armor set arrives as ONE item that grants every piece at
  # once -- one pool slot per set instead of four to six. On by default.
  # Turn it off for the classic pool where every helm, chest, gauntlet and
  # greave is its own item and sets trickle in a piece at a time.
  armor_bundles: true

  # Recipe for the junk-consumable filler tail: {category: weight}.
  # Leave it alone unless you know what you want. Raising `juice` gives you more
  # genuinely useful drops; raising `stones` keeps upgrade materials flowing.
  # The stones / somber_stones / runes weights are an upgrade-economy
  # RESERVATION: they are paid in full before anything else, and a seed whose
  # tail is too small for them to matter says so by name in the generation log
  # (it does not refuse to build -- you get a lean run and a warning). Every seed also guarantees a batch of low-tier smithing
  # stones (regular and somber, enough for an early +3) placed within reach
  # of your starting area. Zero these weights out and that economy is gone --
  # the generator will warn you.
  # This IS the shipped default, written out so you can see and edit it. It is
  # kept in step with the code by test_gf_shipping_yaml_recipe -- if the default
  # is retuned and this block is not, CI fails. (It froze at `stones: 27` once,
  # after that was measured BELOW the +3 affordability floor on 3 of 9 seeds;
  # the gate exists so that cannot happen twice.) Delete the block entirely to
  # follow the default automatically.
  curated_filler:
    juice: 63
    stones: 6
    somber_stones: 6
    runes: 10
    throwables: 6
    pots: 4
    greases: 3
    foods: 2
    boluses: 1
    perfumes: 2

  # How many Sites of Grace a region unlock lights.
  #   all       (default) every warp point in the region -- Liurnia is 59 at once
  #   landmarks one per sub-area (the warp menu's own grouping) -- Liurnia gets 4,
  #             about 50 across the map. Uneven on purpose: it follows the menu,
  #             not region size, so a few regions have one sub-area
  #   entrance  only the way in; you walk to and touch the rest, the vanilla way
  # Moves no item: unlocks are still the only progression and every check stays
  # put, so nothing here changes what is in your seed or where it sits.
  # NOT the same as safe. The idea is that a grace you were not handed is still
  # reachable on foot -- but the bundles have not been walked region by region,
  # so which ones can leave you stuck is not known. `all` is the setting that
  # has actually been played; treat the other two as experimental, and report
  # anything that strands you.
  region_grace_unlock: all

  # Warp points arrive by EXPLORING rather than all at once. Unlocking a region
  # lights ONE of its graces; touch this many more and the rest light. 0
  # (default) keeps the behaviour above -- a Lock lights every grace it has.
  # Regions with too few graces to reach the number are left alone entirely.
  # Requires a client that supports it; a seed using it refuses an older one
  # rather than connecting and silently ignoring it.
  #
  # 🛑 EXPERIMENTAL, and not for the reason a version number would tell you.
  # Holding warps back means walking more of the world on foot, and the grace
  # bundles have NOT been walked region by region -- so which regions can leave
  # you somewhere you cannot get out of is genuinely not known. It moves no
  # item and no check, so your seed still contains everything it did; what is
  # untested is whether you can always reach it. 0 is the setting that has been
  # played. Please report anything that strands you.
  grace_attunement: 0

  # Which grace a region hands you when it unlocks, when grace_attunement is on.
  #   front_door    -- the region's own entrance (default). You always arrive
  #                    somewhere sensible.
  #   random_grace  -- any one of the region's graces, which can drop you
  #                    deeper in and cuts more traversal. Every candidate is a
  #                    real warp point, so it cannot strand you in a sealed
  #                    arena.
  grace_attunement_anchor: front_door

  # How good a piece of gear has to be to count as `juice`.
  #   max (default) -- legendary, rare and B-tier: about 1013 items
  #   high          -- legendary and rare: about 536
  #   normal        -- legendary only: about 149
  # A HIGHER floor is a SMALLER list, and the `juice` weight above does not
  # change -- so raising it asks for the same number of items out of a shorter
  # list and the surplus becomes junk. Measured on one seed: max 1518 gear,
  # high 872, normal 230. It buys quality by paying quantity.
  pool_builder_intensity: max

  # These STEER WHICH GEAR you get. They can never ADD gear -- how much is the
  # `juice` weight in curated_filler above, and at the shipped recipe roughly
  # two fifths of your filler is already real gear. Leaving these at 0 does NOT
  # mean "no gear".
  #
  # They are relative proportions, not percentages of anything: {weapons: 3,
  # spells: 1} and {weapons: 75, spells: 25} are the same request. There is no
  # total to keep under 100.
  #
  # They can only COST you gear, never add any. Each category is drawn from a
  # curated list with a limited number of items good enough to qualify, and
  # spells have the fewest. Ask a category for more than it has and the
  # shortfall becomes junk (the generation log names it). Measured on one seed:
  #   all 0 (default)      1518 gear in the pool   <- the most you can get
  #   weapons 3, spells 1  1138  (-25%)
  #   weapons 100          1085  (-29%)
  # So set these only when you want a particular FLAVOUR of run and are willing
  # to pay for it.
  pool_builder_pct_weapons: 0
  pool_builder_pct_armor: 0
  pool_builder_pct_talismans: 0
  pool_builder_pct_spells: 0
  pool_builder_pct_ashes_of_war: 0

  # Every Golden Seed and Sacred Tear check pays out a single "Progressive
  # Flask Upgrade" item instead, one-for-one. Each copy you receive grants a
  # seed or a tear on an interleaved schedule -- you still spend it at a grace
  # at the game's own escalating price, but upgrades (Sacred Tears included)
  # arrive on a steady cadence instead of 13 silent flat pickups. Off: seeds
  # and tears stay discrete pickups at their shuffled locations.
  progressive_flasks: true
  # Legacy v0.5 spelling, retained so old YAMLs still validate. In v0.6 Golden Seeds, Sacred Tears,
  # and Progressive Flask Upgrades automatically prefer unused progression-surface checks, then
  # spill into ordinary fill. They remain useful, not required for logic or victory.
  flask_upgrades_on_progression_surface: false

  # Weapon and spirit-ash upgrades by SHOP TIER instead of by luck. On: the
  # Smithing-Stone, Somberstone, Glovewort, and Ghost-Glovewort Bell Bearings
  # become four progressive items. Each copy unlocks the next tier of its Twin
  # Maidens shop, and one copy of each is forced early. Ancient Dragon and Great
  # Glovewort capstones stay discrete. Never gates logic. Off: vanilla bearings.
  progressive_stone_bells: false

  # Items that make your run briefly worse. Empty (default) = none at all.
  # A trap is FILLER: it never holds progression, and each one replaces a
  # junk item, so your seed does not grow. In a multiworld somebody else may
  # be the one who finds them.
  #   rune_thief -- half your runes, gone.
  #   no_flask   -- your flask heals nothing for 20s. You can still drink it;
  #                 it just does nothing, and the charge is spent.
  #   runebear   -- a Runebear appears exactly where you are standing. Kill
  #                 it and you keep the runes.
  #   basilisk   -- THREE basilisks appear where you are standing. One is a
  #                 joke; three is the Death Blight mist, which kills
  #                 outright. Killing you sends a DeathLink.
  # THESE WORDS AND NOTHING ELSE. For any other enemy -- by name or by model
  # id -- use `spawn_traps` just below. A model id written here is a yaml
  # error that says so.
  traps: []

  # THE ESCAPE HATCH: any other enemy in the game, BY NAME or by character
  # model id. `traps` above carries the ones we named; this takes any of the
  # 390 spawnable models. One appears where you are standing.
  #
  # Both spellings mean the same thing, so write whichever you have:
  #   spawn_traps: [Basilisk, Runebear]   # a name -- case does not matter
  #   spawn_traps: ["4150", "4630"]       # the same two, by model id
  #
  # 35 models have a name: Aging Untouchable, Alexander Warrior Jar, Asimi
  # Silver Tear, Basilisk, Blaidd the Half-Wolf, Boc the Seamster, Demi-Human
  # Boc, Finger Reader Crone, Finger Reader Enia, Gatekeeper Gostoc, Gurranq
  # Beast Clergyman, Hornsent Grandam, Jar-Bairn, Latenna the Albinauric,
  # Malenia (Phase 1), Melina, Merchant Kale, Miriel Pastor of Vows, Pidia
  # Carian Servant, Primeval Sorcerer Azur, Primeval Sorcerer Lusat, Ranni the
  # Witch, Rennala Queen of the Full Moon, Runebear, Smithing Master Hewg,
  # Smithing Master Iji, Sorceress Sellen, St. Trina, Tanith's Knight, The
  # Noble Goldmask, The Two Fingers, Zorayas the Scout.
  #
  # The other 355 have no name because the GAME never writes one on screen --
  # outside NpcName they simply are not named in the data, and this project
  # will not invent one. Write those as their id, e.g. [4980] for a Death Rite
  # Bird.
  #
  # A name or id that cannot be spawned is a yaml ERROR that names its nearest
  # matches, rather than an item that silently never fires -- 26 models are
  # excluded because they have no AI row or no body. Naming the same enemy
  # here and in `traps` is harmless; it is one item either way.
  spawn_traps: []

  # How many trap items to shuffle in, shared evenly between the traps you
  # enabled above. Inert while both `traps` and `spawn_traps` are empty.
  trap_count: 8

  # Share of YOUR filler COPIES that other players' worlds may draw from, in a
  # multiworld. 100 = fully shared. 0 = keep your filler to yourself.
  #
  # Every category keeps something eligible: the share is spent WITHIN each
  # category and never takes a category's last item, so lowering this thins
  # what you export rather than silently barring a whole category. `keep_local`
  # below is the knob for barring one, and it stays the only one. (0 is exempt
  # -- you asked for all of it home.)
  #
  # WHY THIS SHIPS AT 70 AND NOT 100. The goal is a 1:1 useful:filler mix in
  # what your partners receive, and 70 is where that lands with the keep_local
  # default below. Measured cross-game, one ER slot, pooled over seeds:
  #   Hollow Knight, 5 seeds:    100 -> 0.79:1     70 -> 1.00:1
  #   Bumper Stickers, 3 seeds:  100 -> 0.77:1     70 -> 0.97:1
  # Both partner sizes land on it. Raise it toward 100 to send more of your
  # junk out; lower it to send less. Exported USEFUL barely moves either way --
  # what changes is how much filler rides along with it.
  filler_foreign_pct: 70

  # On: every real vanilla item this seed produces stays in YOUR world.

  # Categories of item to hold in YOUR OWN world, one per line. This is the
  # knob for "keep my consumables and crafting mats, send the gear out"
  # without reaching for local_item_only (which keeps everything) or
  # filler_foreign_pct (which thins every category evenly rather than naming
  # one).
  #
  # Valid: armor, ashes, bell_bearings, consumables, cookbooks, crafting,
  # crystal_tears, everything, goods, key_items, merchant_bells, other,
  # progressive, runes
  #
  # It only ever ADDS to what is already held local; it never releases
  # anything. Example:
  #   keep_local: [consumables, crafting, runes]
  # 🛑 Bell bearings are `key_items`, not crafting -- that example still sends
  # them out.
  #
  # WHY THIS SHIPS NON-EMPTY. The list below is the `goods` umbrella minus
  # runes, spells and spirit ashes: hold back the consumables, crafting
  # materials, smithing stones, cookbooks, bell bearings and key items, and let
  # every rune, weapon, armour piece, talisman, ash, spell and spirit ash
  # travel. Measured beside a Hollow Knight slot, two thirds of everything we
  # sent was mechanically inert there -- smithing stones 23.7% and runes 24.0%
  # of a 312-item export, to a player who cannot spend either. Those were not
  # bonus items: the export budget is slot-limited, so they were occupying room
  # that weapons and armour would otherwise have taken.
  #
  # 🛑 SHORTENING THIS LIST BY ONE LINE DOES ALMOST NOTHING. Releasing `runes`
  # alone moved exported filler by ZERO (202 -> 202) -- whichever large pool is
  # open expands to fill every slot, so filler has to be closed close to as a
  # class before the mix moves at all. If you want MORE of your junk to travel,
  # empty this list; if you want to fine-tune, use the rune cap below, which is
  # the one graded dial.
  #
  # 🛑 `key_items` IS DELIBERATELY ABSENT. Holding it looks right -- they are ER
  # items a partner cannot use -- but key_items covers Great Runes, the Dectus
  # medallions and every Remembrance, so keeping them home took
  # natural_progression's cross-world placements from 12 to ZERO in the
  # multiworld smoke. Those are the items worth trading. Do not add it back
  # without re-running tools/gf_multiworld_smoke.py.
  #
  # Written on ONE line on purpose: tools/gf_export_profile.py's --extra sweeps
  # this knob by rewriting a single yaml line, and a block list would leave its
  # entries orphaned behind the rewrite.
  keep_local: [consumables, cookbooks, crafting, crystal_tears, merchant_bells, other, upgrade_bells, upgrade_materials]

  # Hold back rune items worth this many runes or fewer; larger ones may still
  # travel. DEFAULTS TO 12,500, which holds 18 of the 31 rune items. Set it to
  # 0 to turn it off and send every rune you find.
  #
  # The payout is a number the game publishes, so it is not guessed from the
  # item name:
  #   Golden Rune [1]    200     Golden Rune [10]   5,000
  #   Golden Rune [4]  1,200     Golden Rune [11]   6,250
  #   Golden Rune [8]  3,000     Golden Rune [13]  10,000
  #   Golden Rune [9]  3,800     Numen's Rune      12,500  <- the default cap
  #                              Hero's Rune [1]   15,000
  #                              Lord's Rune       50,000
  #                              Marika's Rune     80,000  <- the largest
  # Independent of keep_local: naming `runes` there keeps every rune home
  # whatever this says.
  #
  # WHY 12,500 (Numen's Rune). Runes are the only large filler category the
  # default keep_local leaves open, which makes this the fine adjustment on what
  # your partners receive -- and unlike a percentage it can be AIMED, because
  # the threshold is a number the game publishes rather than a share of a pool
  # nobody can picture.
  # else identical: cap 0 -> 0.57:1, 6,250 -> 0.68:1, 12,500 -> 0.72:1, and
  # 80,000 (every rune home) only 0.73:1. Against the old defaults the pair
  # moves 0.55:1 -> 0.72:1: exported USEFUL is flat (228 -> 231) while filler
  # falls 412 -> 320, so your partners lose 92 Golden Runes, not 92 items they
  # wanted. 12,500 is Numen's Rune -- Golden Rune [13] is 10,000. Hero's,
  # Leda's, Lord's and Marika's Runes still travel. Raise it to send less junk
  # and keep more runes; set it to 0 to send every rune you find.
  keep_local_rune_cap: 12500

  # How hard your Region Locks are pulled toward YOUR OWN world. 0 (default) is
  # no pull at all -- every Lock is an ordinary multiworld item and can end up
  # in someone else's game, so you may be waiting on another player to find
  # your way into Liurnia. That is Archipelago working as intended, and it is
  # the default on purpose. 100 pins every Lock at home.
  #
  # It is a share, not a mood: at 40, about 40% of your Locks are reserved for
  # your own progression surface and the other 60% go into the pool.
  #
  # 🛑 A LOCK IN THE POOL IS STILL CURATED -- it is held to the same surface
  # everyone else's progression is, it just lands on SOMEBODY'S boss rather
  # than necessarily yours. The knob that trades curation itself is
  # confine_foreign_progression, deliberately separate.
  #
  # Measured at 0 over 740 generations: in a two-slot Elden Ring multiworld
  # about 45% of Locks leave their own world and ~90% of placed Locks sit on a
  # surface check; four slots pushes travel to 60-70%. No effect in a solo
  # seed, nor in the modes that mint no Locks.
  progression_bias: 0

  # HOW YOUR PROGRESSION IS SHARED WITH THE OTHER GAMES AT THE TABLE.
  # `auto`, the default, BALANCES it per game: every partner game receives its
  # own near 1-per-number-of-games share of your travelling progression, and
  # your world reserves the same share of each partner game's progression in
  # return. Eleven items at a three-game table means roughly four to each
  # partner and three at home -- not one batch split however fill lands (the
  # motivating seed split 11 items 2/2/7). Two slots of one game count as one
  # game, sampled fairly across their players; items a player keeps local are
  # never taken; shares a partner or your own world cannot host are capped at
  # what fits, with requested-vs-reserved counts in the generation log.
  #
  # `aggregate` is the older shape: ONE combined foreign batch sized at 1/N,
  # divided between partners by ordinary fill, no incoming reservation. A
  # number from 1 to 100 is that aggregate share set by hand. `never` (or 0)
  # keeps every travelling progression item inside Elden Ring worlds.
  #
  # This exists because the answer used to be ZERO, always, and not on purpose.
  # Locks were offered to Elden Ring surfaces only; our surfaces have about 170
  # checks for at most ~36 Locks, so nothing was ever left over. Measured:
  # 0 Locks reached a Hollow Knight slot across four configurations, including
  # a two-Elden-Ring-plus-Hollow-Knight seed where 15 of 28 Locks travelled and
  # every one went to the OTHER Elden Ring world.
  #
  # 🛑 THIS PLACES ITEMS IN ANOTHER GAME'S LOCATIONS. Only empty, non-excluded,
  # unlocked ones, never forced, and anything refused falls back to Elden Ring
  # surfaces rather than failing your seed. But an apworld is within its rights
  # to object to being filled during pre_fill -- TUNIC says so outright. If a
  # partner game generates badly beside Elden Ring, set this to `never` first.
  #
  # No effect in a solo seed, in a seed with only Elden Ring players, or in the
  # modes that mint no Locks.
  cross_game_progression: auto

  # ---- Where progression may hide -------------------------------------------

  # WHICH LOCATIONS MAY HOLD PROGRESSION. Shrinking this makes the run tighter
  # and more predictable; widening it scatters key items further afield.
  #
  # Every entry below names a KIND of check. `SweepSlot` is the one that does not:
  # it adds ONE member of every dungeon sweep your seed runs, so clearing an area
  # can pay out progression. It needs Dungeon Sweep on (it is, by default), and it
  # is ON by default because the rest of this list is SMALL -- about 30 checks on a
  # four-region seed -- and at the shipped `confine_foreign_progression: 100` it is
  # the only place another player's key items may land. Without it a slot receives
  # roughly a tenth of the foreign progression it otherwise would. Remove it if you
  # would rather a sweep never hand you a key.
  # Remembrance and GreatRune are NOT here, and their absence changes nothing: both
  # are strict subsets of MajorBoss, so while that line is present they admit no
  # location of their own (measured 199 == 199 checks either way, #733). They are
  # still selectable -- add either line back and it is accepted -- they are just no
  # longer on by default, because being on implied they did something.
  progression_surface:
    - MajorBoss
    - KeyItem
    - Church
    - Seedtree
    - Fragment
    - Revered
    - ShopSlot
    - SweepSlot

  # In a MULTIWORLD, what PERCENT of other players' progression is confined to your
  # progression_surface, the way your own is. 100 confines all of it, so a foreign
  # key item lands on one of your major-boss / key-item / etc. checks and never on a
  # random filler pickup. 0 confines none and it scatters across any reachable check
  # of yours (standard AP). `true` and `false` still work and still mean 100 and 0.
  #
  # 🛑 IT ALSO DECIDES WHETHER YOUR GEAR IS WORTH RECEIVING. The rule is about YOUR
  # locations, but it pushes your NEIGHBOUR's progression back into the neighbour's
  # own slots, which fills them before Archipelago places the `useful` tier -- so at
  # 100 a non-Elden-Ring partner gets nothing from you but filler. Measured on a
  # two-slot seed beside Hollow Knight: 0.0% of what the partner received from us was
  # useful at 100, 5.2% at 90, 23.2% at 75, 38.3% at 50. Lower it if you want your
  # weapons, armour and talismans to show up in your friends' games; the price is
  # that their keys stop being curated onto your interesting checks. See the
  # per-value table in the option's own help text.
  #
  # No effect in a solo seed. Never blocks generation.
  confine_foreign_progression: 100

  # RESERVED. The option exists but is INERT in v0.2 -- shop checks are assumed
  # reachable regardless of what you set here. Left in place so seeds stay
  # forward-compatible; see KNOWN-ISSUES.md. Leave it alone.
  merchant_bell_logic: off

  # ---- Runtime rerolls ------------------------------------------------------

  # Reroll what farmable enemies drop. Their ONE-TIME drops (the actual AP
  # checks) are untouched -- this only changes the repeatable farm drops.
  reroll_enemy_drops: true

  # Reroll the repeatable smithing-stone and glovewort deposits inside mines.
  # All 133 deposits remain respawning, non-check pickups; only their material
  # reward changes. Deposits that originally shared a material tier also share
  # one replacement for the seed. Capstone stones and gloveworts are excluded.
  reroll_mine_materials: true

  # Reroll every unlimited-stock merchant slot to a random high-impact
  # consumable, priced at what the item is worth. Merchants stop being a wall
  # of Arrows. (Unlimited slots can never be checks -- there is no way to
  # observe a purchase on them -- so nothing is lost by rerolling.)
  reroll_infinite_shop_stock: true

  # Wares the HUB merchant always stocks, unlimited, instead of leaving those
  # shelves to the reroll above. Up to FOUR -- that is how many unlimited
  # shelves the hub has, and asking for more is rejected with a message rather
  # than quietly dropping the extras. Each is sold at its own derived price, so
  # a shelf never becomes a free dispenser. Empty = unchanged.
  #   infinite_hub_wares: ["Rune Arc", "Larval Tear"]
  # Worth a thought before filling it in: unlimited Larval Tears is unlimited
  # respec, and unlimited Rune Arcs is a permanent great-rune buff.
  infinite_hub_wares: []

  # Categories of YOUR OWN item that merchants may never stock -- both the shop
  # checks themselves (bell-bearing shops included) and the unlimited shelves
  # above. The items still exist and are still shuffled; they just land out in
  # the world instead of behind a purchase menu, so finding them is a matter of
  # going somewhere rather than of having enough runes.
  #   keep_out_of_shops: [weapons, armor]
  # Categories: weapons, armor, talismans, ashes (ashes of WAR), spells,
  # spirit_ashes, consumables, crafting, cookbooks, upgrade_materials,
  # upgrade_bells, merchant_bells, runes, crystal_tears, key_items, other,
  # progressive -- plus the umbrellas `goods`, `key_items` (the whole inventory
  # tab: key items, cookbooks and both kinds of bell bearing), `bell_bearings`
  # and `everything`. Other players' items at your shops are never affected.
  #
  # On a SMALL seed there may not be room: the hub alone is 184 shop rows out of
  # 224 locations, and a category holding more items than there are non-shop
  # slots to move them to is skipped -- the generation log names which one and
  # by how much. Full-world seeds have room to spare.

  # Whether merchant purchase slots are AP checks. off removes them entirely --
  # ~562 shop rows stop being locations, so no item (yours or a foreign player's) is
  # gated behind a purchase, and the seed shrinks. Merchants still sell vanilla wares.
  shop_checks: true

  keep_out_of_shops: []

  # Keep your own money runes (Golden / Hero's / Lord's / Numen's and the DLC
  # runes) out of your merchants' stock: no shop check pays out one of your own
  # runes, and the rerolled infinite shelves never stock one. This is an escape
  # hatch for rune shop rows failing to render in the purchase menu -- the runes
  # still exist, they are just never behind a merchant. Other players' items at
  # your shops are unaffected.
  no_runes_in_shops: false

  # ---- Difficulty -----------------------------------------------------------

  # Enemies get stronger the FURTHER INTO YOUR RUN a region is -- not by where it
  # sits on the map. Unlock the Weeping Peninsula last and it will be tuned like
  # endgame territory. This is always on; the two knobs below only shape it.
  #
  # Both are 0-100, and on both, HIGHER IS HARDER. Leave them at 0 for the
  # standard curve. Enemy rune rewards never change, at any setting.

  # How hard the EASIEST enemies are. Raising this lifts the whole floor, so
  # nowhere stays a walkover -- handy because an "early" region you unlock late
  # would otherwise be free.
  #     0   normal                                        (default)
  #    25   nothing below about 2x enemy HP
  #    50   nothing below about 4x
  #   100   everything at maximum, everywhere, immediately
  minimum_enemy_difficulty: 0

  # Whether enemy difficulty follows your PROGRESSION instead of the map.
  # Off = VANILLA: every enemy keeps exactly the strength the base game gave it,
  # the client stops touching enemies entirely, and the three sliders here stop
  # meaning anything. Choose it if you want the item randomizer without the
  # difficulty curve. Not the same as "easier" -- it is the game's own curve,
  # which in a randomized world can mean a late-game area at level 20.
  enemy_scaling: true

  # How hard the TOUGHEST enemies get.
  #  auto   scale the cap to the LENGTH of your run        (default)
  #   100   no cap -- your deepest region reaches the game's own maximum,
  #         roughly 7.4x enemy HP, what vanilla saves for its endgame
  #    75   nothing above about 5.5x enemy HP
  #    50   nothing above about 4x
  #    25   nothing above about 2x
  # `auto` is here because the curve is relative and your gear is not. Scaling
  # ramps over the ORDER your regions unlock, so the deepest one is "the end of
  # the run" whether that is 30 regions or 5 -- but Somber +10 still needs a
  # Somber [9]. On a short seed you meet endgame enemies on a mid-game weapon,
  # and FEWER regions makes the ramp steeper, not gentler. auto lowers the top
  # of the curve with the length of the run: about 4.1x at 5 regions, the full
  # 7.4x at 30. Give a number instead to choose the cap yourself.
  # Must be >= minimum_enemy_difficulty (auto is raised to it rather than
  # failing the seed, since you did not choose the cap).
  # NOTE: a cap below 100 needs an up-to-date client. An older one refuses the
  # seed and says so, rather than quietly ignoring the cap.
  maximum_enemy_difficulty: auto

  # How QUICKLY you reach the hardest enemies. This does not change how hard the
  # hardest enemies are -- it changes how much of the run is spent below them.
  #     0   spread evenly across the run                  (default)
  #    50   maximum from about halfway
  #    75   maximum about a quarter of the way in
  #   100   maximum almost immediately
  difficulty_ramp_speed: 0

  # SEAMLESS CO-OP difficulty. Extra enemy tiers per co-op partner in your world.
  # Solo play ignores it. Seamless raises enemy HP but leaves enemy DAMAGE at the
  # host default, so a partner halves the threat without enemies hitting harder;
  # each tier moves enemies up the same scaling ladder (more HP AND attack), which
  # restores it. Needs enemy_scaling on. Every player is on their own slot, so each
  # client counts the party and applies the same bump -- no host.
  #     0   off -- co-op scales as it does today          (default)
  #     1   +1 tier per partner
  #     2   +2 tiers per partner (harder with a full party)
  #   3..9  steeper, clamped to the top of the ladder
  # NOTE: a tier adds HP too, so if you leave Seamless's own enemy-HP scaling on,
  # this stacks a little extra HP -- pair a non-zero value with Seamless's HP knob
  # turned down, or accept spongier-and-harder.
  coop_difficulty: 0

  # Scale runes dropped directly by enemies and bosses to the same sphere tier
  # as their combat stats. This keeps reward per effort steadier when an early
  # enemy appears late or a late boss appears early. Golden Rune ITEMS are never
  # changed. Off by default; requires enemy_scaling to have an effect.
  scale_rune_rewards: false

  # What your equipment WEIGHS, and therefore which roll you get.
  #   off     (default) equipment weighs what it weighs -- your kit is a budget
  #   light   equipment weighs nothing: always light roll, whatever you wear.
  #           Heavy armour and greatshields cost you nothing at all
  #   medium  never worse than a medium roll -- the ceiling is raised far enough
  #           that no real kit fat-rolls, but the light-roll threshold still
  #           moves with what you put on, so armour is still a decision
  # The game recomputes max equip load every frame from Endurance, so the client
  # multiplies the WEIGHT side instead and logs the equip load it actually got.
  # NOTE: `medium` needs an up-to-date client. An older one refuses the seed and
  # says so, rather than connecting and quietly giving you `light` -- which is
  # the STRONGER setting you did not ask for. `off` and `light` work on any
  # client, as they always have.
  no_equip_load: off

  # Remove the stat requirements on weapons, shields and catalysts (and the
  # requirements on spells), so anything the multiworld hands you is usable
  # whatever your build is.
  # ON by default, and it always has been -- this was fixed behaviour until
  # v0.4.1 rather than a setting, so leaving it alone keeps the game you have
  # been playing. Set it false if you want your stats to decide what you can
  # hold; the seed generates identically either way, so nothing becomes
  # unwinnable -- it just becomes a fight you have to build for.
  # The client only ever LOWERS a requirement, so it is reconnect-safe.
  no_weapon_requirements: true

  # Wear whatever the multiworld sends you. A weapon or armour piece goes on the
  # moment it lands in your bag, replacing whatever was in that slot.
  # 🛑 Including mid-boss-fight, and including a weapon your build cannot use --
  # you do not choose your kit, the item order does. Off by default. A seed with
  # this on requires a client that supports it and says so rather than
  # connecting and quietly ignoring it.
  auto_equip: false

  # Automatically raise any weapon that enters your bag -- an AP grant, a world
  # pickup, or an item you put down with Leave and took back -- to the highest
  # reinforce level you already hold on its smithing track (normal caps at +25,
  # somber at +10). Raise-only and per-track. The put-it-down-pick-it-up gesture
  # is the intended catch-up for a weapon received before you found your stones.
  # ON by default -- the receipt half has been every seed's behaviour since v0.2;
  # it became a setting (and gained the pickup half) in v0.4.10. Turn it off to
  # keep weapons at their found level and spend the stones yourself.
  auto_upgrade: true

  # Start with all five whetblades (Iron, Red-Hot, Sanctified, Glintstone,
  # Black), so every Ash-of-War affinity is selectable at any grace from the
  # opening instead of hunting the vanilla pickups. Grants the ITEMS only --
  # the grace menu keys on possession -- and the whetblade CHECKS stay in the
  # pool regardless.
  start_with_whetblades: false

  # Open the catacombs' boss doors from the start, so you walk in and fight instead of
  # hunting the lever first. Off by default.
  #
  # It also lights both ancestor altars in Siofra River, so the Ancestor Spirit and the
  # Regal Ancestor Spirit are reachable without riding around lighting urns.
  #
  # Covers the 18 minor dungeons whose boss door is a real LEVER puzzle. It deliberately
  # leaves the four that are not: Sainted and Giant-Conquering Hero's Graves open when you
  # kill the Gladiator and the Shadow Troll, and skipping a FIGHT is not what this is for;
  # Gelmir and Auriza Hero's Graves have no lever to skip.
  #
  # Nothing is granted and no check is skipped -- the door is only a prerequisite to
  # reaching the boss, and the boss and its dungeon sweep still have to be earned.
  # Applied at connect, so a dungeon you are already standing in needs a reload.
  open_boss_doors: false

  # EXPERIMENTAL / test build (#945). Abilities the game disables for the whole seed, at the
  # character's LOGICAL action layer -- so the lock survives key/pad rebinds, covers keyboard and
  # mouse, and never touches menus. Any of: jump, crouch, roll, r1, r2, l1, l2, heal. r1/r2/l1/l2 are
  # the attack inputs; locking one also stops casting through it. `heal` locks the flask (it heals
  # nothing while locked). Empty = nothing locked (the default).
  #
  # Nothing below happens until you name an ability here: with this list empty the whole ability-lock
  # axis is inert, whatever Ability Lock Mode says. crouch is an unverified mapping.
  locked_abilities: []

  # EXPERIMENTAL (#980). How the locked abilities behave:
  #   progressive -- (the default) they start off and each becomes an "Unlock: X" item shuffled into
  #                  the multiworld; find it to get that ability back. Needs a client that
  #                  understands ability unlocks (declared via requiresClientFeatures).
  #   static      -- the opt-out: off for the whole seed, no item and no check.
  # No effect if the set above is empty.
  ability_lock_mode: progressive

  # EXPERIMENTAL (#980). In PROGRESSIVE mode, must you HOLD your unlock items to finish?
  #   on  (default) -- each "Unlock: X" is progression and is added to the goal's held-item
  #                    requirement. Because progression is distributed across the whole multiworld,
  #                    your abilities can land in a PARTNER's world -- and then you cannot complete
  #                    until they send them back. That mutual dependency is the point of a multiworld.
  #   off           -- the unlocks stay useful and never gate completion (a seed always finishes even
  #                    with an ability still out). The item-hunt without your ending held hostage.
  # No effect outside progressive mode, or when Locked Abilities is empty.
  ability_unlocks_required: true

  # ---- Standard Archipelago options -----------------------------------------

  # region_lock seeds want `minimal`, not `full`.
  accessibility: minimal
  progression_balancing: 50

  # Shared deaths in a multiworld. Works in both directions.
  death_link: false

  # Only every Nth DeathLink received from another player kills you. Incoming and outgoing
  # amnesty use separate counters. Both counters restart when the client reconnects.
  # 1 preserves the normal DeathLink behavior.
  death_link_amnesty_inbound: 1

  # Only every Nth local death is sent to the multiworld. The range is 1-100.
  # 1 preserves the normal DeathLink behavior.
  death_link_amnesty_outbound: 1

  # Share locally received trap items with other TrapLink players. Incoming traps whose names this
  # client does not recognize are ignored; linked traps never echo back onto the network.
  trap_link: false

  # SEAMLESS CO-OP: share region unlocks with the other Elden Ring players here.
  # You all play in ONE physical world (the co-op host's) but each have your own
  # Archipelago slot -- so if one of you has unlocked Liurnia and the rest have
  # not, the rest get kicked out of it and cannot follow. With this on, the moment
  # ANY Elden Ring player who also turned it on unlocks a region, that region's
  # door opens for all of you: the map gate lifts and its graces light up.
  #
  # IT ONLY OPENS THE DOOR. Nobody is handed anyone else's region key item -- that
  # stays where the multiworld put it, and finding your own is still what counts
  # for your items and your goal. Generation is identical either way, so turning
  # this on makes nobody's seed easier to finish.
  #
  # Turn it on for every Elden Ring player in the group. Players who leave it off
  # are unaffected, and other games in the multiworld never see it.
  region_sync: false


