<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ER Archipelago — Check Browser</title>
<style>
:root{
  --bg:#14120e; --bg2:#1c1a15; --bg3:#252118; --line:#3a3428;
  --fg:#e8e2d2; --dim:#9a927e; --gold:#c9a961; --gold2:#e0c98a;
  --blue:#7fa8c9; --red:#c97f7f; --green:#8fb87a; --purple:#a98fc9;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.45 "Segoe UI",system-ui,sans-serif;
  display:flex;flex-direction:column;overflow:hidden}
a{color:var(--gold2)}
header{padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg2);
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;flex:0 0 auto}
h1{font:600 15px/1 "Segoe UI",sans-serif;margin:0;letter-spacing:.06em;color:var(--gold)}
h1 small{display:block;font:400 10px/1.4 monospace;color:var(--dim);letter-spacing:0;margin-top:3px}
#q{flex:1 1 320px;min-width:220px;background:var(--bg3);border:1px solid var(--line);
  color:var(--fg);padding:7px 10px;border-radius:4px;font:13px/1 inherit;outline:none}
#q:focus{border-color:var(--gold)}
#count{color:var(--dim);font:12px/1 monospace;white-space:nowrap}
main{flex:1 1 auto;display:flex;min-height:0}
#facets{width:216px;flex:0 0 auto;overflow-y:auto;border-right:1px solid var(--line);
  background:var(--bg2);padding:10px 0 40px}
.fgroup{margin-bottom:4px}
.fhead{padding:6px 12px;font:600 10px/1 inherit;letter-spacing:.1em;text-transform:uppercase;
  color:var(--gold);cursor:pointer;user-select:none;display:flex;justify-content:space-between}
.fhead:hover{color:var(--gold2)}
.fbody{padding:2px 0 8px}
.fbody.hidden{display:none}
.f{display:flex;align-items:center;gap:7px;padding:3px 12px;cursor:pointer;font-size:12px}
.f:hover{background:var(--bg3)}
.f.on{background:#2e2818;color:var(--gold2)}
.f input{margin:0;accent-color:var(--gold)}
.f .c{margin-left:auto;color:var(--dim);font:10px/1 monospace}
#listwrap{flex:1 1 auto;overflow-y:auto;min-width:0}
table{width:100%;border-collapse:collapse}
thead th{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--line);
  text-align:left;padding:7px 10px;font:600 10px/1 inherit;letter-spacing:.09em;
  text-transform:uppercase;color:var(--dim);cursor:pointer;white-space:nowrap;z-index:2}
thead th:hover{color:var(--gold)}
tbody tr{border-bottom:1px solid #241f18;cursor:pointer}
tbody tr:hover{background:var(--bg2)}
tbody tr.sel{background:#2e2818}
td{padding:5px 10px;vertical-align:top}
td.nm{max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.mono{font:11px/1.5 monospace;color:var(--dim);white-space:nowrap}
td.rg{color:var(--blue);white-space:nowrap;font-size:12px}
.tag{display:inline-block;padding:1px 5px;margin:0 3px 2px 0;border-radius:3px;
  font:10px/1.5 monospace;background:var(--bg3);color:var(--dim);border:1px solid var(--line)}
.tag.MajorBoss,.tag.Boss{color:var(--red);border-color:#5a3a3a}
.tag.GreatRune,.tag.Remembrance,.tag.KeyItem{color:var(--gold);border-color:#5a4a28}
.tag.Legendary{color:var(--purple);border-color:#4a3a5a}
.tag.Seedtree,.tag.Fragment,.tag.Revered{color:var(--green);border-color:#3a5a3a}
.tag.miss{color:var(--red);border-color:#5a3a3a}
#detail{width:390px;flex:0 0 auto;border-left:1px solid var(--line);background:var(--bg2);
  overflow-y:auto;padding:14px 16px 60px}
#detail.empty{color:var(--dim);display:flex;align-items:center;justify-content:center;text-align:center}
#detail h2{font:600 14px/1.3 inherit;margin:0 0 4px;color:var(--gold2)}
#detail .sub{font:11px/1.5 monospace;color:var(--dim);margin-bottom:12px;word-break:break-all}
.sec{margin:14px 0 0}
.sec h3{font:600 10px/1 inherit;letter-spacing:.1em;text-transform:uppercase;
  color:var(--gold);margin:0 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.kv{display:grid;grid-template-columns:88px 1fr;gap:3px 10px;font-size:12px}
.kv dt{color:var(--dim)}
.kv dd{margin:0;word-break:break-word}
.rows{font:11px/1.6 monospace}
.rows div{padding:3px 0;border-bottom:1px solid #241f18}
footer{flex:0 0 auto;padding:5px 14px;border-top:1px solid var(--line);background:var(--bg2);
  font:10px/1.4 monospace;color:var(--dim);display:flex;gap:16px;flex-wrap:wrap}
.btn{background:var(--bg3);border:1px solid var(--line);color:var(--dim);
  padding:5px 9px;border-radius:4px;cursor:pointer;font:11px/1 inherit;text-decoration:none;display:inline-block}
.btn:hover{color:var(--gold);border-color:var(--gold)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#3a3428;border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#5a5138}
@media(max-width:1100px){#detail{width:300px}#facets{width:180px}}
</style>
</head>
<body>
<!-- The site tab strip. One definition, four pages: /er/tabs.js. It is EMPTY without
     that script on purpose -- this page also ships as a file:// copy in the release zip,
     where /er/tabs.js cannot load and links to /downloads would be dead anyway.
     🛑 EDIT THIS IN THE TEMPLATE, NOT IN er-archipelago-check-browser.html: that file is
     GENERATED by tools/build_check_browser.py and test_gf_check_browser asserts the committed
     copy equals a fresh build, so a hand edit there reds the freshness gate. -->
<div id="er-tabs" data-tab="checks"></div>
<script src="/er/tabs.js" defer></script>
<header>
  <h1>ELDEN RING ARCHIPELAGO<small id="stamp">check browser</small></h1>
  <input id="q" placeholder="search name, flag, ap id, grace, map, item&hellip;  (/ to focus)" autocomplete="off">
  <span id="count"></span>
  <button class="btn" id="clear">clear filters</button>
  <button class="btn" id="resid">negative space</button>
  <button class="btn" id="mapbtn">map</button>
  <button class="btn" id="diffbtn">diff a build</button>
  <button class="btn" id="perma">copy permalink</button>
  <button class="btn" id="csv">export csv</button>
  <a class="btn" id="playerReviews" href="review.html">Help review locations</a>
</header>
<main>
  <nav id="facets"></nav>
  <div id="mapview" style="display:none;flex:1 1 auto;position:relative;overflow:auto;text-align:center">
    <div id="mapnote" style="position:sticky;top:0;z-index:3;background:rgba(20,18,14,.93);border-bottom:1px solid var(--line);padding:6px 12px;font:11px/1.5 monospace;color:var(--dim);text-align:left"></div>
    <div id="mapslot"></div>
  </div>
  <div id="listwrap">
    <table>
      <thead><tr>
        <th data-s="r">Region</th>
        <th data-s="n">Check</th>
        <th data-s="t">Tags</th>
        <th data-s="f">Flag</th>
        <th data-s="id">AP id</th>
        <th data-s="g">Nearest grace</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <aside id="detail" class="empty"><div>select a check</div></aside>
</main>
<footer id="foot"></footer>

<script>
const DATA = /*__DATA__*/null;
const CHECKS = DATA.checks, META = DATA.meta, RESIDUALS = DATA.residuals;
function playerReviewUrl(id){
 const local=location.pathname.endsWith('er-archipelago-check-browser.html');
 return (local?'er-archipelago-evidence-browser.html':'review.html')+'#mode=player'+(id?'&check='+id:'');
}
document.getElementById('playerReviews').href=playerReviewUrl();


/* ---------- facet definitions ---------- */
const FACETS = [
  {key:'r',   label:'Region',   get:c=>[c.r]},
  {key:'t',   label:'Tag',      get:c=>c.t.length?c.t:['(untagged)']},
  {key:'prop',label:'Property', get:c=>{
      const p=[];
      if(c.miss) p.push('missable');
      if(!c.maps.length) p.push('no map position');
      if(!c.g) p.push('no nearest grace');
      if(c.shop&&c.shop.length) p.push('shop row');
      if(c.lots&&c.lots.length) p.push('has itemlot');
      if(c.fl) c.fl.forEach(x=>p.push(x));
      return p.length?p:['(plain)'];
  }},
  /* Gate evidence is its OWN facet and each corpus is its own value, deliberately:
     collapsing them to one "gated" flag is how "110 of 4879" became a believed number
     when four tables document 684. Enabler verdicts keep their source wording -- see
     the caveat block in the detail panel for why NO_ENTITY_HANDLE is not "unknown". */
  {key:'gate',label:'Gate evidence', get:c=>{
      const p=[];
      if(c.gates&&c.gates.length) p.push('lot gate (EMEVD)');
      if(c.gift&&c.gift.length)   p.push('ESD gift path');
      if(c.eshop&&c.eshop.length) p.push('ESD shop gate');
      if(c.sd)                    p.push('MSB StartDisabled=1');
      (c.enab||[]).forEach(e=>{ if(e.verdict) p.push('enabler: '+e.verdict); });
      return p.length?[...new Set(p)]:['(no gate evidence)'];
  }},
  {key:'maps',label:'Map tile',  get:c=>c.maps.length?c.maps:['(none)']},
];
const active = {}; FACETS.forEach(f=>active[f.key]=new Set());

/* ---------- state ---------- */
let sortKey='r', sortDir=1, filtered=CHECKS, selected=null;

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function haystack(c){
  if(c._h) return c._h;
  return c._h = [c.n,c.r,c.f,c.id,c.g,c.t.join(' '),c.maps.join(' '),c.mapn.join(' '),
    c.desc,(c.lots||[]).map(l=>l.name+' '+l.lot).join(' '),
    (c.shop||[]).map(s=>s.item).join(' '),
    // the sweep boss left c.n when the clause moved to its own row (#936); it stays SEARCHABLE,
    // because "which checks does Fire Giant sweep" is exactly what the page is asked.
    (c.sw||[]).join(' ')].join(' ').toLowerCase();
}

/* ---------- facets render ---------- */
function facetCounts(){
  // count against the set filtered by every OTHER facet + query (classic faceted search)
  const out={};
  FACETS.forEach(f=>{
    const base = CHECKS.filter(c=>matchQuery(c) && FACETS.every(g=>g.key===f.key||matchFacet(c,g)));
    const m={}; base.forEach(c=>f.get(c).forEach(v=>m[v]=(m[v]||0)+1));
    out[f.key]=m;
  });
  return out;
}
function matchFacet(c,f){
  const sel=active[f.key]; if(!sel.size) return true;
  return f.get(c).some(v=>sel.has(v));
}
let query='';
function matchQuery(c){
  if(!query) return true;
  return query.split(/\s+/).every(term=>haystack(c).includes(term));
}
function buildFacets(){
  const counts=facetCounts();
  const nav=document.getElementById('facets');
  nav.innerHTML = FACETS.map(f=>{
    const m=counts[f.key];
    const keys=Object.keys(m).sort((a,b)=>m[b]-m[a]||a.localeCompare(b));
    const body=keys.map(v=>{
      const on=active[f.key].has(v);
      return `<label class="f ${on?'on':''}" data-fk="${f.key}" data-fv="${esc(v)}">
        <input type="checkbox" ${on?'checked':''}><span>${esc(v)}</span><span class="c">${m[v]}</span></label>`;
    }).join('');
    const n=active[f.key].size;
    return `<div class="fgroup"><div class="fhead" data-t="${f.key}">
      <span>${f.label}${n?` (${n})`:''}</span><span>${keys.length}</span></div>
      <div class="fbody" id="fb-${f.key}">${body}</div></div>`;
  }).join('');
  nav.querySelectorAll('.f').forEach(el=>el.addEventListener('click',e=>{
    e.preventDefault();
    const k=el.dataset.fk, v=el.dataset.fv;
    active[k].has(v)?active[k].delete(v):active[k].add(v);
    render();
  }));
  nav.querySelectorAll('.fhead').forEach(el=>el.addEventListener('click',()=>{
    document.getElementById('fb-'+el.dataset.t).classList.toggle('hidden');
  }));
}

/* ---------- list ---------- */
function apply(){
  filtered = CHECKS.filter(c=>matchQuery(c)&&FACETS.every(f=>matchFacet(c,f)));
  const dir=sortDir, k=sortKey;
  filtered.sort((a,b)=>{
    let x=a[k],y=b[k];
    if(Array.isArray(x)){x=x.join(',');y=y.join(',');}
    if(typeof x==='number') return (x-y)*dir;
    return String(x).localeCompare(String(y))*dir;
  });
}
let renderCap=300;
function renderRows(){
  const tb=document.getElementById('rows');
  const slice=filtered.slice(0,renderCap);
  tb.innerHTML = slice.map(c=>`<tr data-id="${c.id}" class="${selected===c.id?'sel':''}">
    <td class="rg">${esc(c.r)}</td>
    <td class="nm" title="${esc(c.n)}">${esc(c.n)}</td>
    <td>${c.t.map(t=>`<span class="tag ${esc(t)}">${esc(t)}</span>`).join('')}${c.miss?'<span class="tag miss">missable</span>':''}</td>
    <td class="mono">${c.f}</td>
    <td class="mono">${c.id}</td>
    <td class="rg">${esc(c.g||'')}</td></tr>`).join('');
  tb.querySelectorAll('tr').forEach(tr=>tr.addEventListener('click',()=>{
    selected=+tr.dataset.id; renderRows(); showDetail(CHECKS.find(c=>c.id===selected)); writeHash();
  }));
  document.getElementById('count').textContent =
    `${filtered.length.toLocaleString()} / ${CHECKS.length.toLocaleString()}` +
    (filtered.length>renderCap?`  (showing ${renderCap})`:'');
}
document.getElementById('listwrap').addEventListener('scroll',e=>{
  const el=e.target;
  if(el.scrollTop+el.clientHeight>el.scrollHeight-300 && renderCap<filtered.length){
    renderCap+=300; renderRows();
  }
});

/* ---------- detail ---------- */
/* ---------- #599 REPORT A MISREGION ----------------------------------------------------
   A static page cannot POST, so the button opens a PREFILLED GitHub issue. No backend, works
   offline and on peliarch alike, and it lands in the repo that owns region_overrides.tsv.

   🛑 IT CLAIMS NOTHING. Every check gets the button; nothing is badged "suspect". The form
   carries EVIDENCE -- the other regions on this tile, what check_region_triage says about how
   this one was decided, whether it is a progression-surface class -- and leaves the verdict to
   the reporter and the triager. Flagging rows as wrong would make this page an oracle, and it is
   a READER: a pure join over committed generator output that can only repeat what the tsvs say.

   ⚠️ The map places 1930 of 4879 checks; interiors do not plot at all. The body says so, because
   "I checked the map and found no others" from someone who saw 40% of the corpus is a costly
   kind of wrong. */
const REPO='https://github.com/4laric/er-archipelago';
function tileMates(c){
  const out=[];
  for(const t of (c.maps||[])){
    const rs=(META.tile_regions||{})[t];
    if(rs) out.push([t,rs]);
  }
  return out;
}
function reportRow(c){
  return `<dt>Something wrong?</dt><dd><a href="#" class="rep2" data-id="${c.id}">report a problem with this check ↗</a>`
       + `<br><a href="#" class="rep" data-id="${c.id}">just the region is wrong ↗</a></dd>`;
}
function reportUrl(c){
  const mates=tileMates(c);
  const L=[];
  L.push('<!-- Prefilled by the check browser. Please keep the FACTS block and write your reasoning under it. -->','');
  L.push('## The check','');
  L.push('| field | value |','|---|---|');
  L.push(`| name | ${c.full} |`);
  L.push(`| AP id | ${c.id} |`);
  L.push(`| event flag | ${c.f} |`);
  L.push(`| assigned region | **${c.r}** |`);
  L.push(`| map tile(s) | ${(c.maps||[]).join(', ')||'none'} |`);
  L.push(`| tags | ${(c.t||[]).join(', ')||'-'} |`);
  if(c.how) L.push(`| region decided by | **${c.how}** (check_region_triage) |`);
  if(c.surf) L.push('| progression surface | **yes** (a default seed can hang progression here) |');
  L.push('');
  if(mates.length){
    L.push('## Its tile is already split','');
    for(const [t,rs] of mates) L.push(`- \`${t}\` holds checks in: **${rs.join(', ')}**`);
    L.push('', '> A tile is the smallest loadable unit, so on the OVERWORLD (`m60_`/`m61_`) a split is a',
           '> derivation artifact. An INTERIOR map id covers an enormous space and may own two regions',
           '> legitimately -- `m21_00` holds the Golden Hippopotamus arena, which is Scadu Altus by',
           '> design. Do not read a split as proof on its own.','');
  }
  L.push('## Why do you think it is wrong?','');
  L.push('<!-- e.g. the in-game place name, which grace it is nearest, where you actually walked from,',
         '     or a screenshot of the hint. Anything checkable beats a hunch. -->','');
  L.push('','---','',
         `Browser view: ${location.href}`,
         `Data stamp: \`${META.stamp}\``,
         '',
         '<sub>The check browser is a reader, not an oracle -- it repeats committed generator output.',
         'The map plots 1930 of 4879 checks and no interiors, so absence from it is not evidence.</sub>');
  const title=`misregion? ${c.r} :: ${c.n} [f${c.f}]`;
  return REPO+'/issues/new?labels=misregion'
    +'&title='+encodeURIComponent(title)
    +'&body='+encodeURIComponent(L.join('\n'));
}

/* ---------- REPORT A CHECK (the general case) -----------------------------------------
   Same static-page trick as the misregion button above, one rung more general: the player's
   check misbehaved and they want it looked at. The difference is the destination -- this one
   opens the ISSUE FORM (.github/ISSUE_TEMPLATE/check-report.yml) rather than a blank issue, so
   the questions triage always ends up asking (which build, what did the game actually do, the
   yaml, the log) are ASKED UP FRONT instead of being chased in comments a week later.

   🛑 Only `input` and `textarea` fields prefill from the URL, keyed on the field's `id` --
   that is the whole of what GitHub documents (see "Creating an issue from a URL query"). The
   `symptom` dropdown is therefore deliberately NOT prefilled: the browser does not know what
   happened to you, and a dropdown that guessed would be a verdict this page has no business
   claiming. The player picks it.

   The evidence block is the same one the misregion form carries, because "which region is this
   in and how was that decided" is the first question asked of a check that misbehaved, whatever
   the symptom turned out to be. */
const REPORT_TEMPLATE='check-report.yml';
function checkFacts(c){
  const L=[];
  L.push('| field | value |','|---|---|');
  L.push(`| name | ${c.full} |`);
  L.push(`| AP id | ${c.id} |`);
  L.push(`| event flag | ${c.f} |`);
  L.push(`| assigned region | ${c.r} |`);
  L.push(`| nearest grace | ${c.g||'unknown'} |`);
  L.push(`| map tile(s) | ${(c.maps||[]).join(', ')||'none'} |`);
  L.push(`| tags | ${(c.t||[]).join(', ')||'-'} |`);
  if(c.how) L.push(`| region decided by | ${c.how} (check_region_triage) |`);
  if(c.miss) L.push(`| missable | ${c.miss} |`);
  const mates=tileMates(c);
  if(mates.length){
    L.push('');
    for(const [t,rs] of mates) L.push(`- its tile \`${t}\` also holds checks in: ${rs.join(', ')}`);
  }
  L.push('', `Browser view: ${location.href}`, `Data stamp: \`${META.stamp}\``);
  return L.join('\n');
}
function checkReportUrl(c){
  return REPO+'/issues/new'
    +'?template='+encodeURIComponent(REPORT_TEMPLATE)
    +'&title='+encodeURIComponent(`check: ${c.n} [f${c.f}]`)
    +'&check='+encodeURIComponent(`${c.full}`)
    +'&facts='+encodeURIComponent(checkFacts(c));
}

// #936 -- eligibility, NOT a per-seed promise. The generator bakes ", also granted by <boss>"
// into a sweep MEMBER's name, but that clause is a CORPUS fact: whether THIS seed's boss actually
// hands the check over depends on the seed's `dungeon_sweep` rung and its progression-surface cut,
// neither of which this page has (it is built once from the static corpus, with no seed at all).
// So the browser states what it can know -- that a sweep lists the check -- and says out loud that
// the seed decides. The in-game client, which DOES hold the seed truth in slot_data
// `dungeonSweepFlags`, filters the clause instead of hedging it.
function sweepRow(c){
  if(!c.sw||!c.sw.length) return '';
  const boss=c.sw[0], tile=c.sw[1];
  const who = tile? `${esc(boss)} (${esc(tile)})` : esc(boss);
  return `<dt>Sweep</dt><dd>eligible &mdash; ${who}<br>`
       + `<span style="color:var(--dim)">a sweep in the corpus lists this check; whether a given `
       + `seed grants it on that boss kill depends on its <code>dungeon_sweep</code> and `
       + `<code>progression_surface</code> settings.</span></dd>`;
}

function showDetail(c){
  const d=document.getElementById('detail'); d.classList.remove('empty');
  const rows=(arr,fn)=>arr&&arr.length?`<div class="rows">${arr.map(fn).join('')}</div>`:'<div style="color:var(--dim)">none</div>';
  d.innerHTML = `
   <h2>${esc(c.n)}</h2>
   <p><a class="btn" href="${playerReviewUrl(c.id)}">Found this? Help review this location</a></p>
   <div class="sub">${esc(c.full)}</div>
   <div class="sec"><h3>Identity</h3><dl class="kv">
     <dt>Region</dt><dd>${esc(c.r)}</dd>
     <dt>Event flag</dt><dd>${c.f}</dd>
     <dt>AP id</dt><dd>${c.id}</dd>
     ${reportRow(c)}
     <dt>Tags</dt><dd>${c.t.length?c.t.map(t=>`<span class="tag ${esc(t)}">${esc(t)}</span>`).join(''):'<span style="color:var(--dim)">—</span>'}</dd>
     ${c.miss?`<dt>Missable</dt><dd style="color:var(--red)">${esc(c.miss)}</dd>`:''}
     ${c.fl?`<dt>Flags</dt><dd>${c.fl.map(f=>`<span class="tag">${esc(f)}</span>`).join('')}</dd>`:''}
     ${c.desc?`<dt>Description</dt><dd>${esc(c.desc)}</dd>`:''}
     ${sweepRow(c)}
   </dl></div>
   <div class="sec"><h3>Where</h3><dl class="kv">
     <dt>Nearest grace</dt><dd>${esc(c.g)||'<span style="color:var(--dim)">unknown</span>'}</dd>
     <dt>Map tile(s)</dt><dd>${c.maps.length?c.maps.map(m=>`<span class="tag">${esc(m)}</span>`).join(''):'<span style="color:var(--dim)">no position</span>'}</dd>
     ${c.mapn.length?`<dt>Map name(s)</dt><dd>${c.mapn.map(esc).join(', ')}</dd>`:''}
     ${c.msrc.length?`<dt>Position src</dt><dd>${c.msrc.map(esc).join(', ')}</dd>`:''}
   </dl></div>
   <div class="sec"><h3>Item lots (${(c.lots||[]).length})</h3>
     ${rows(c.lots,l=>`<div>${esc(l.table)} <b>${esc(l.lot)}</b>.${esc(l.slot)} cat${esc(l.cat)} id${esc(l.item)} ×${esc(l.n)}<br><span style="color:var(--gold2)">${esc(l.name)}</span></div>`)}</div>
   ${(c.shop||[]).length?`<div class="sec"><h3>Shop rows (${c.shop.length})</h3>
     ${rows(c.shop,s=>`<div>row <b>${esc(s.row)}</b> — ${esc(s.item)} · ${esc(s.value)} runes<br><span style="color:var(--dim)">${esc(s.where)}</span></div>`)}</div>`:''}
   ${gateSection(c)}
  `;
}

/* ---------- gate evidence: FOUR corpora, each with its own caveats ---------- */
function gateSection(c){
  const n = (c.gates||[]).length + (c.enab||[]).length + (c.gift||[]).length + (c.eshop||[]).length;
  if(!n && !c.sd) return `<div class="sec"><h3>Gate evidence</h3>
    <div style="color:var(--dim)">No row in lot_gates, treasure_enablers, esd_gifts or esd_gates
    mentions this check. That is <b>absence of evidence across four tables</b>, which is not the
    same as proof it is ungated.</div></div>`;
  const src = [];
  if((c.gates||[]).length) src.push(['lot_gates', `EMEVD lot gates (${c.gates.length})`,
    c.gates.map(g=>`<div>gate <b>f${esc(g.gate)}</b> · ${esc(g.ctx)} · ev ${esc(g.ev)}</div>`).join('')]);
  if((c.enab||[]).length) src.push(['treasure_enablers', `StartDisabled enablers (${c.enab.length})`,
    c.enab.map(e=>`<div><b style="color:${e.verdict==='ENABLER_FOUND'?'var(--green)':(e.verdict==='NO_ENTITY_HANDLE'?'var(--blue)':'var(--dim)')}">${esc(e.verdict)}</b>
      ${e.kind?` · ${esc(e.kind)}`:''}${e.ev?` · ev ${esc(e.ev)}`:''}${e.chest?` · InChest=${esc(e.chest)}`:''}
      ${e.self?`<br><span style="color:var(--dim)">self-set (MEMO, not a prereq): ${esc(e.self)}</span>`:''}
      ${e.ext?`<br><span style="color:var(--gold2)">external gate: ${esc(e.ext)}</span>${e.extin?` <span style="color:var(--dim)">set in ${esc(e.extin)}</span>`:' <span style="color:var(--dim)">(nothing sets it)</span>'}`:''}
      ${e.verbatim?`<br><span style="color:var(--fg)">${esc(e.verbatim)}</span>`:''}</div>`).join('')]);
  if((c.gift||[]).length) src.push(['esd_gifts', `ESD gift paths (${c.gift.length})`,
    c.gift.map(g=>`<div>talk <b>${esc(g.talk)}</b> · lot ${esc(g.lot)} · gate f${esc(g.gate)} sense ${esc(g.sense)}</div>`).join('')]);
  if((c.eshop||[]).length) src.push(['esd_gates', `ESD shop gates (${c.eshop.length})`,
    c.eshop.map(g=>`<div>talk <b>${esc(g.talk)}</b> · gate f${esc(g.gate)} sense ${esc(g.sense)} · rows ${esc(g.range)}</div>`).join('')]);
  return `<div class="sec"><h3>Gate evidence — ${n} row(s) across ${src.length} corpus/corpora</h3>
    ${c.sd?`<div style="color:var(--gold2);font-size:11px;margin-bottom:6px">MSB <b>StartDisabled=1</b> — this is a property of the CONTAINER (a closed chest), <b>not</b> an access gate.</div>`:''}
    ${src.map(([key,title,body])=>`<div style="margin-bottom:9px">
      <div style="font:600 10px/1.4 monospace;color:var(--gold2)">${esc(title)}
        <span class="cav" data-k="${key}" style="cursor:pointer;color:var(--dim);border-bottom:1px dotted var(--dim)">why this can be misread ▾</span></div>
      <pre class="cavbox" id="cav-${key}" style="display:none;white-space:pre-wrap;font:10px/1.45 monospace;color:var(--dim);background:var(--bg3);border:1px solid var(--line);border-radius:4px;padding:6px;margin:4px 0">${esc(META.caveats[key]||'')}</pre>
      <div class="rows">${body}</div></div>`).join('')}</div>`;
}

/* ---------- NEGATIVE SPACE: rows in the side tables that are NOT checks ---------- */
let showResiduals=false;
function renderResiduals(){
  const q = query;
  const rs = RESIDUALS.filter(r=>!q || (r.k+' '+r.f+' '+r.what+' '+r.detail+' '+r.reason).toLowerCase().includes(q));
  document.getElementById('count').textContent = `${rs.length} / ${RESIDUALS.length} residual rows`;
  document.getElementById('rows').innerHTML = rs.slice(0,400).map(r=>`<tr>
    <td class="rg">${esc(r.k)}</td>
    <td class="nm" title="${esc(r.what)}">${esc(r.what)}</td>
    <td>${esc(r.detail)}</td>
    <td class="mono">${r.f||''}</td>
    <td colspan="2" style="font-size:11px;color:${r.reason?'var(--dim)':'var(--red)'}">${esc(r.reason)||'reason NOT RECORDED — do not invent one'}</td>
  </tr>`).join('');
  document.getElementById('detail').className='empty';
  document.getElementById('detail').innerHTML =
    `<div style="text-align:left;color:var(--dim);font-size:12px"><b style="color:var(--gold)">Negative space.</b><br><br>
     Rows that exist in a side table but are <b>not</b> checks. Every wrong claim this project has
     produced lived here — "~126 invisible lots" was really 98 already-checks / 32 flagless / 0 new.<br><br>
     A blank reason means <b>nobody recorded one</b>. That is an honest unknown, not an invitation
     to guess.</div>`;
}

/* ---------- MAP: plot the current filter ----------
   Colour = region, so a misregioned check is a visible outlier rather than a datamine.
   🛑 The calibration covers base overworld + DLC ONLY. Interior checks have no position
   here; they are COUNTED AND STATED at the top, never quietly omitted. */
const SVGS = {m60: __SVG_BASE__, m61: __SVG_DLC__};
let showMap=false, curMap='m60';
const REGCOL = {};
(function(){
  const rs=[...new Set(CHECKS.map(c=>c.r))].sort();
  rs.forEach((r,i)=>REGCOL[r]=`hsl(${Math.round(i*360/rs.length)},62%,58%)`);
})();
function project(p){
  const cal=META.cal&&META.cal[p.b]; if(!cal) return null;
  const b=cal.world_bounds, im=cal.image;
  return {x: im.margin+(p.gx-b.gx_min)/(b.gx_max-b.gx_min)*im.draw_w,
          y: im.margin+(1-(p.gz-b.gz_min)/(b.gz_max-b.gz_min))*im.draw_h};
}
function renderMap(){
  const slot=document.getElementById('mapslot');
  slot.innerHTML = SVGS[curMap]||'<div style="color:var(--dim);padding:40px">no map</div>';
  const svg=slot.querySelector('svg'); if(!svg) return;
  const g=document.createElementNS('http://www.w3.org/2000/svg','g');
  svg.appendChild(g);
  let on=0, other=0, nopos=0;
  const seen=new Set();
  filtered.forEach(c=>{
    if(!c.pos.length){ nopos++; return; }
    let here=false;
    c.pos.forEach(p=>{
      if(p.b!==curMap){ other++; return; }
      here=true;
      const pr=project(p); if(!pr) return;
      const el=document.createElementNS('http://www.w3.org/2000/svg','circle');
      el.setAttribute('cx',pr.x.toFixed(1)); el.setAttribute('cy',pr.y.toFixed(1));
      el.setAttribute('r',selected===c.id?7:3);
      el.setAttribute('fill',selected===c.id?'#fff':REGCOL[c.r]||'#999');
      el.setAttribute('stroke',selected===c.id?'#000':'rgba(0,0,0,.45)');
      el.setAttribute('stroke-width',selected===c.id?2.5:.8);
      el.style.cursor='pointer';
      const t=document.createElementNS('http://www.w3.org/2000/svg','title');
      t.textContent=`${c.r} :: ${c.n}  ·  f${c.f}`; el.appendChild(t);
      el.addEventListener('click',()=>{ selected=c.id; showDetail(c); renderMap(); writeHash(); });
      g.appendChild(el);
    });
    if(here) on++; seen.add(c.r);
  });
  const legend=[...seen].sort().map(r=>
    `<span style="white-space:nowrap"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${REGCOL[r]}"></span> ${esc(r)}</span>`).join('  ');
  document.getElementById('mapnote').innerHTML =
    `<b style="color:var(--gold)">${on}</b> of ${filtered.length} filtered checks plotted on `
    + `${curMap==='m60'?'the Lands Between':'the Land of Shadow'} `
    + `<a href="#" id="swapmap" style="color:var(--gold2)">⇄ switch to ${curMap==='m60'?'Land of Shadow':'Lands Between'}</a>`
    + (other?` · <span style="color:var(--blue)">${other} position(s) on the other map</span>`:'')
    + (nopos?` · <span style="color:var(--red)">${nopos} have NO overworld position (interiors — this map cannot show them)</span>`:'')
    + `<div style="margin-top:5px;display:flex;gap:10px;flex-wrap:wrap">${legend}</div>`;
}

/* ---------- DIFF: two builds, same page ----------
   🛑 A REVIEW AID, never a gate. The byte-staleness gate in CI is the gate; if this says
   "nothing changed" while the bytes changed, that is a FINDING, not a pass. */
let diffData=null;
function renderDiff(){
  const A=diffData, B={checks:CHECKS,meta:META};
  const ai={}, bi={};
  A.checks.forEach(c=>ai[c.id]=c); B.checks.forEach(c=>bi[c.id]=c);
  const added=B.checks.filter(c=>!ai[c.id]), removed=A.checks.filter(c=>!bi[c.id]);
  const moved=[], retagged=[], redesc=[], regraced=[];
  B.checks.forEach(c=>{ const o=ai[c.id]; if(!o) return;
    if(o.r!==c.r) moved.push([c,o.r,c.r]);
    if((o.t||[]).join(',')!==(c.t||[]).join(',')) retagged.push([c,(o.t||[]).join(' ')||'—',(c.t||[]).join(' ')||'—']);
    if(o.n!==c.n) redesc.push([c,o.n,c.n]);
    if((o.g||'')!==(c.g||'')) regraced.push([c,o.g||'—',c.g||'—']);
  });
  const sec=(title,rows,fmt)=>!rows.length?'':`<tr><td colspan="6" style="background:var(--bg3);color:var(--gold);font:600 11px/1.6 inherit;padding:5px 10px">${title} (${rows.length})</td></tr>`
    + rows.slice(0,150).map(fmt).join('')
    + (rows.length>150?`<tr><td colspan="6" style="color:var(--dim);padding:4px 10px">…${rows.length-150} more</td></tr>`:'');
  const chg=(c,a,b)=>`<tr data-id="${c.id}"><td class="rg">${esc(c.r)}</td><td class="nm">${esc(c.n)}</td>
    <td style="color:var(--red)">${esc(a)}</td><td style="color:var(--green)">${esc(b)}</td>
    <td class="mono">${c.f}</td><td class="mono">${c.id}</td></tr>`;
  const same = A.meta.stamp===B.meta.stamp;
  document.getElementById('rows').innerHTML =
    sec('ADDED checks', added, c=>`<tr><td class="rg">${esc(c.r)}</td><td class="nm">${esc(c.n)}</td><td colspan="2" style="color:var(--green)">new</td><td class="mono">${c.f}</td><td class="mono">${c.id}</td></tr>`)
  + sec('REMOVED checks', removed, c=>`<tr><td class="rg">${esc(c.r)}</td><td class="nm">${esc(c.n)}</td><td colspan="2" style="color:var(--red)">gone</td><td class="mono">${c.f}</td><td class="mono">${c.id}</td></tr>`)
  + sec('REGION changed', moved, ([c,a,b])=>chg(c,a,b))
  + sec('TAGS changed', retagged, ([c,a,b])=>chg(c,a,b))
  + sec('NAME / description changed', redesc, ([c,a,b])=>chg(c,a,b))
  + sec('NEAREST GRACE changed', regraced, ([c,a,b])=>chg(c,a,b))
  || `<tr><td colspan="6" style="padding:14px;color:${same?'var(--dim)':'var(--red)'}">
       No semantic difference.${same?' Both builds carry the same inputs_hash, so that is expected.'
       :' ⚠ But the two builds have DIFFERENT inputs_hash — bytes changed while meaning did not. That is a finding, not a pass.'}</td></tr>`;
  const n = added.length+removed.length+moved.length+retagged.length+redesc.length+regraced.length;
  document.getElementById('count').textContent = `${n} semantic change(s)`;
  document.getElementById('rows').querySelectorAll('tr[data-id]').forEach(tr=>
    tr.addEventListener('click',()=>{ const c=bi[+tr.dataset.id]; if(c){selected=c.id; showDetail(c);} }));
  const d=document.getElementById('detail'); d.className='empty';
  d.innerHTML=`<div style="text-align:left;color:var(--dim);font-size:12px">
    <b style="color:var(--gold)">Build diff.</b><br><br>
    <b>loaded</b> <span style="font:10px/1.4 monospace">${esc((A.meta.stamp||'?').slice(7,19))}</span><br>
    <b>this</b> &nbsp;&nbsp;<span style="font:10px/1.4 monospace">${esc((B.meta.stamp||'?').slice(7,19))}</span><br><br>
    Keyed by AP id. This is a <b>review aid, not a gate</b> — CI's byte-staleness check is the
    gate. Generated .py diffs run to thousands of unreadable lines; this says what actually
    moved.</div>`;
}
document.getElementById('diffbtn').addEventListener('click',()=>{
  if(diffData){ diffData=null; document.getElementById('diffbtn').classList.remove('hot');
    document.getElementById('diffbtn').textContent='diff a build'; render(); return; }
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.html';
  inp.addEventListener('change',()=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const m=/^const DATA = (\{.*\});$/m.exec(fr.result);
      if(!m){ alert('That file has no embedded DATA payload — is it a check-browser build?'); return; }
      try{ diffData=JSON.parse(m[1]); }catch(e){ alert('Payload would not parse: '+e); return; }
      if(!diffData.checks){ alert('Payload has no checks[].'); diffData=null; return; }
      showMap=false; showResiduals=false;
      document.getElementById('diffbtn').classList.add('hot');
      document.getElementById('diffbtn').textContent='× close diff';
      render();
    };
    fr.readAsText(inp.files[0]);
  });
  inp.click();
});

/* ---------- permalink: encode the QUERY, not the ANSWER ---------- */
function writeHash(){
  const p=[];
  if(query) p.push('q='+encodeURIComponent(query));
  FACETS.forEach(f=>{ if(active[f.key].size) p.push(f.key+'='+[...active[f.key]].map(encodeURIComponent).join('|')); });
  if(sortKey!=='r'||sortDir!==1) p.push('sort='+sortKey+(sortDir<0?':d':''));
  if(showResiduals) p.push('view=residuals');
  if(showMap){ p.push('view=map'); if(curMap!=='m60') p.push('m='+curMap); }
  if(selected) p.push('sel='+selected);
  const h = p.join('&');
  if(location.hash.slice(1)!==h) history.replaceState(null,'',h?('#'+h):location.pathname);
}
function readHash(){
  const h=location.hash.slice(1); if(!h) return;
  const miss=[];
  h.split('&').forEach(kv=>{
    const i=kv.indexOf('='); if(i<0) return;
    const k=kv.slice(0,i), v=decodeURIComponent(kv.slice(i+1));
    if(k==='q'){ query=v.toLowerCase(); document.getElementById('q').value=v; }
    else if(k==='sort'){ const [s,d]=v.split(':'); sortKey=s; sortDir=d==='d'?-1:1; }
    else if(k==='view'){ showResiduals = v==='residuals'; showMap = v==='map'; }
    else if(k==='m'){ curMap = v; }
    else if(k==='sel'){ selected=+v; }
    else if(active[k]){
      v.split('|').map(decodeURIComponent).forEach(val=>{
        active[k].add(val);
        // a renamed tag would silently empty a filter and read as "0 results" -- say so LOUDLY
        if(!CHECKS.some(c=>FACETS.find(f=>f.key===k).get(c).includes(val))) miss.push(k+'='+val);
      });
    }
  });
  if(miss.length){
    const b=document.createElement('div');
    b.style.cssText='background:#3a2020;border-bottom:1px solid #7a3a3a;color:#e8b0b0;padding:7px 14px;font:12px/1.4 monospace';
    b.innerHTML='⚠ This link filters on <b>'+miss.map(esc).join(', ')+'</b>, which matches nothing '
      +'in the current build. The data moved — the empty result below is NOT a finding.';
    document.body.insertBefore(b, document.body.firstChild);
  }
}

/* ---------- wiring ---------- */
function render(){
  apply(); renderCap=300; buildFacets();
  document.getElementById('mapview').style.display = showMap?'block':'none';
  document.getElementById('listwrap').style.display = showMap?'none':'block';
  if(diffData) renderDiff();
  else if(showMap) renderMap();
  else if(showResiduals) renderResiduals();
  else renderRows();
  if(showMap && !diffData){ /* keep the row list in sync underneath */ }
  writeHash();
}
document.getElementById('q').addEventListener('input',e=>{
  query=e.target.value.trim().toLowerCase(); render();
});
document.getElementById('clear').addEventListener('click',()=>{
  FACETS.forEach(f=>active[f.key].clear());
  query=''; selected=null; document.getElementById('q').value=''; render();
});
document.getElementById('resid').addEventListener('click',()=>{
  showResiduals=!showResiduals;
  document.getElementById('resid').classList.toggle('hot',showResiduals);
  document.getElementById('resid').textContent = showResiduals?'← back to checks':`negative space (${RESIDUALS.length})`;
  render();
});
document.getElementById('mapbtn').addEventListener('click',()=>{
  showMap=!showMap; if(showMap) showResiduals=false;
  const b=document.getElementById('mapbtn');
  b.classList.toggle('hot',showMap);
  b.textContent = showMap?'× close map':'map';
  render();
});
document.getElementById('mapnote').addEventListener('click',e=>{
  if(!e.target.closest('#swapmap')) return;
  curMap = curMap==='m60'?'m61':'m60'; renderMap(); writeHash();
});
document.getElementById('perma').addEventListener('click',()=>{
  writeHash();
  navigator.clipboard?.writeText(location.href).then(
    ()=>{ const b=document.getElementById('perma'); b.textContent='copied ✓'; setTimeout(()=>b.textContent='copy permalink',1400); },
    ()=>prompt('Copy this link:', location.href));
});
document.getElementById('csv').addEventListener('click',()=>{
  const esc2=s=>`"${String(s).replace(/"/g,'""')}"`;
  const lines=[['region','check','tags','flag','ap_id','nearest_grace','maps','missable'].join(',')];
  filtered.forEach(c=>lines.push([c.r,c.n,c.t.join('|'),c.f,c.id,c.g,c.maps.join('|'),c.miss||''].map(esc2).join(',')));
  const b=new Blob([lines.join('\n')],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download='er_checks_filtered.csv'; a.click();
});
document.querySelectorAll('thead th').forEach(th=>th.addEventListener('click',()=>{
  if(showResiduals) return;
  const k=th.dataset.s;
  if(sortKey===k) sortDir*=-1; else {sortKey=k;sortDir=1;}
  render();
}));
/* caveat blocks are collapsed by default but ONE click away, never hidden */
document.getElementById('detail').addEventListener('click',e=>{
  const rep2=e.target.closest('.rep2');
  if(rep2){
    e.preventDefault();
    const c=CHECKS.find(x=>String(x.id)===rep2.dataset.id);
    if(c) window.open(checkReportUrl(c),'_blank','noopener');
    return;
  }
  const rep=e.target.closest('.rep');
  if(rep){
    e.preventDefault();
    const c=CHECKS.find(x=>String(x.id)===rep.dataset.id);
    // Built at CLICK time, not at render: location.href must be the permalink the reporter is
    // actually looking at, filters and all.
    if(c) window.open(reportUrl(c),'_blank','noopener');
    return;
  }
  const t=e.target.closest('.cav'); if(!t) return;
  const box=document.getElementById('cav-'+t.dataset.k);
  const open = box.style.display==='none';
  box.style.display = open?'block':'none';
  t.textContent = open?'why this can be misread ▴':'why this can be misread ▾';
});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement.id!=='q'){e.preventDefault();document.getElementById('q').focus();}
  if(e.key==='Escape'){document.getElementById('q').blur();}
});
document.getElementById('stamp').textContent =
  `${META.total.toLocaleString()} checks · ${META.regions.length} regions` + (META.stamp?` · ${META.stamp.slice(7,17)}`:'');
document.getElementById('foot').innerHTML = [
  `<span>${META.total.toLocaleString()} checks</span>`,
  `<span>${META.with_map.toLocaleString()} with a map position (${(100*META.with_map/META.total).toFixed(1)}%)</span>`,
  `<span>${META.with_grace.toLocaleString()} with a nearest grace</span>`,
  `<span title="lot_gates ${META.gate_lot} · enablers ${META.gate_enabler} · ESD gift ${META.gate_gift} · ESD shop ${META.gate_eshop} — corpora OVERLAP, so this is the union, not a sum">`
    + `${META.gate_any.toLocaleString()} with gate evidence <span style="color:var(--dim)">(${META.gate_lot} lot_gates alone)</span></span>`,
  `<span>${META.missable.toLocaleString()} missable</span>`,
  `<span>${META.residuals.toLocaleString()} residual rows</span>`,
  `<span>${META.plottable.toLocaleString()} plottable <span style="color:var(--dim)">(rest are interiors)</span></span>`,
  `<span style="margin-left:auto">generated from repo data — no game files</span>`
].join('');
document.getElementById('resid').textContent = `negative space (${RESIDUALS.length})`;
readHash();
if(showMap){ const b=document.getElementById('mapbtn'); b.classList.add('hot'); b.textContent='× close map'; }
if(showResiduals){ const b=document.getElementById('resid'); b.classList.add('hot'); b.textContent='← back to checks'; }
render();
if(selected){ const c=CHECKS.find(x=>x.id===selected); if(c) showDetail(c); }
</script>
