<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ER Archipelago — Check Browser</title>
<style>
:root{
  --bg:#14120e; --bg2:#1c1a15; --bg3:#252118; --line:#3a3428;
  --fg:#e8e2d2; --dim:#9a927e; --gold:#c9a961; --gold2:#e0c98a;
  --blue:#7fa8c9; --red:#c97f7f; --green:#8fb87a; --purple:#a98fc9;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.45 "Segoe UI",system-ui,sans-serif;
  display:flex;flex-direction:column;overflow:hidden}
a{color:var(--gold2)}
header{padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg2);
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;flex:0 0 auto}
h1{font:600 15px/1 "Segoe UI",sans-serif;margin:0;letter-spacing:.06em;color:var(--gold)}
h1 small{display:block;font:400 10px/1.4 monospace;color:var(--dim);letter-spacing:0;margin-top:3px}
#q{flex:1 1 320px;min-width:220px;background:var(--bg3);border:1px solid var(--line);
  color:var(--fg);padding:7px 10px;border-radius:4px;font:13px/1 inherit;outline:none}
#q:focus{border-color:var(--gold)}
#count{color:var(--dim);font:12px/1 monospace;white-space:nowrap}
main{flex:1 1 auto;display:flex;min-height:0}
#facets{width:216px;flex:0 0 auto;overflow-y:auto;border-right:1px solid var(--line);
  background:var(--bg2);padding:10px 0 40px}
.fgroup{margin-bottom:4px}
.fhead{padding:6px 12px;font:600 10px/1 inherit;letter-spacing:.1em;text-transform:uppercase;
  color:var(--gold);cursor:pointer;user-select:none;display:flex;justify-content:space-between}
.fhead:hover{color:var(--gold2)}
.fbody{padding:2px 0 8px}
.fbody.hidden{display:none}
.f{display:flex;align-items:center;gap:7px;padding:3px 12px;cursor:pointer;font-size:12px}
.f:hover{background:var(--bg3)}
.f.on{background:#2e2818;color:var(--gold2)}
.f input{margin:0;accent-color:var(--gold)}
.f .c{margin-left:auto;color:var(--dim);font:10px/1 monospace}
#listwrap{flex:1 1 auto;overflow-y:auto;min-width:0}
table{width:100%;border-collapse:collapse}
thead th{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--line);
  text-align:left;padding:7px 10px;font:600 10px/1 inherit;letter-spacing:.09em;
  text-transform:uppercase;color:var(--dim);cursor:pointer;white-space:nowrap;z-index:2}
thead th:hover{color:var(--gold)}
tbody tr{border-bottom:1px solid #241f18;cursor:pointer}
tbody tr:hover{background:var(--bg2)}
tbody tr.sel{background:#2e2818}
td{padding:5px 10px;vertical-align:top}
td.nm{max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.mono{font:11px/1.5 monospace;color:var(--dim);white-space:nowrap}
td.rg{color:var(--blue);white-space:nowrap;font-size:12px}
.tag{display:inline-block;padding:1px 5px;margin:0 3px 2px 0;border-radius:3px;
  font:10px/1.5 monospace;background:var(--bg3);color:var(--dim);border:1px solid var(--line)}
.tag.MajorBoss,.tag.Boss{color:var(--red);border-color:#5a3a3a}
.tag.GreatRune,.tag.Remembrance,.tag.KeyItem{color:var(--gold);border-color:#5a4a28}
.tag.Legendary{color:var(--purple);border-color:#4a3a5a}
.tag.Seedtree,.tag.Fragment,.tag.Revered{color:var(--green);border-color:#3a5a3a}
.tag.miss{color:var(--red);border-color:#5a3a3a}
#detail{width:390px;flex:0 0 auto;border-left:1px solid var(--line);background:var(--bg2);
  overflow-y:auto;padding:14px 16px 60px}
#detail.empty{color:var(--dim);display:flex;align-items:center;justify-content:center;text-align:center}
#detail h2{font:600 14px/1.3 inherit;margin:0 0 4px;color:var(--gold2)}
#detail .sub{font:11px/1.5 monospace;color:var(--dim);margin-bottom:12px;word-break:break-all}
.sec{margin:14px 0 0}
.sec h3{font:600 10px/1 inherit;letter-spacing:.1em;text-transform:uppercase;
  color:var(--gold);margin:0 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.kv{display:grid;grid-template-columns:88px 1fr;gap:3px 10px;font-size:12px}
.kv dt{color:var(--dim)}
.kv dd{margin:0;word-break:break-word}
.rows{font:11px/1.6 monospace}
.rows div{padding:3px 0;border-bottom:1px solid #241f18}
footer{flex:0 0 auto;padding:5px 14px;border-top:1px solid var(--line);background:var(--bg2);
  font:10px/1.4 monospace;color:var(--dim);display:flex;gap:16px;flex-wrap:wrap}
.btn{background:var(--bg3);border:1px solid var(--line);color:var(--dim);
  padding:5px 9px;border-radius:4px;cursor:pointer;font:11px/1 inherit}
.btn:hover{color:var(--gold);border-color:var(--gold)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#3a3428;border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#5a5138}
@media(max-width:1100px){#detail{width:300px}#facets{width:180px}}
</style>
</head>
<body>
<header>
  <h1>ELDEN RING ARCHIPELAGO<small id="stamp">check browser</small></h1>
  <input id="q" placeholder="search name, flag, ap id, grace, map, item&hellip;  (/ to focus)" autocomplete="off">
  <span id="count"></span>
  <button class="btn" id="clear">clear filters</button>
  <button class="btn" id="csv">export csv</button>
</header>
<main>
  <nav id="facets"></nav>
  <div id="listwrap">
    <table>
      <thead><tr>
        <th data-s="r">Region</th>
        <th data-s="n">Check</th>
        <th data-s="t">Tags</th>
        <th data-s="f">Flag</th>
        <th data-s="id">AP id</th>
        <th data-s="g">Nearest grace</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <aside id="detail" class="empty"><div>select a check</div></aside>
</main>
<footer id="foot"></footer>

<script>
const DATA = /*__DATA__*/null;
const CHECKS = DATA.checks, META = DATA.meta;

/* ---------- facet definitions ---------- */
const FACETS = [
  {key:'r',   label:'Region',   get:c=>[c.r]},
  {key:'t',   label:'Tag',      get:c=>c.t.length?c.t:['(untagged)']},
  {key:'prop',label:'Property', get:c=>{
      const p=[];
      if(c.miss) p.push('missable');
      if(c.gates&&c.gates.length) p.push('has lot gate');
      if(!c.maps.length) p.push('no map position');
      if(!c.g) p.push('no nearest grace');
      if(c.shop&&c.shop.length) p.push('shop row');
      if(c.lots&&c.lots.length) p.push('has itemlot');
      if(c.fl) c.fl.forEach(x=>p.push(x));
      return p.length?p:['(plain)'];
  }},
  {key:'maps',label:'Map tile',  get:c=>c.maps.length?c.maps:['(none)']},
];
const active = {}; FACETS.forEach(f=>active[f.key]=new Set());

/* ---------- state ---------- */
let sortKey='r', sortDir=1, filtered=CHECKS, selected=null;

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function haystack(c){
  if(c._h) return c._h;
  return c._h = [c.n,c.r,c.f,c.id,c.g,c.t.join(' '),c.maps.join(' '),c.mapn.join(' '),
    c.desc,(c.lots||[]).map(l=>l.name+' '+l.lot).join(' '),
    (c.shop||[]).map(s=>s.item).join(' ')].join(' ').toLowerCase();
}

/* ---------- facets render ---------- */
function facetCounts(){
  // count against the set filtered by every OTHER facet + query (classic faceted search)
  const out={};
  FACETS.forEach(f=>{
    const base = CHECKS.filter(c=>matchQuery(c) && FACETS.every(g=>g.key===f.key||matchFacet(c,g)));
    const m={}; base.forEach(c=>f.get(c).forEach(v=>m[v]=(m[v]||0)+1));
    out[f.key]=m;
  });
  return out;
}
function matchFacet(c,f){
  const sel=active[f.key]; if(!sel.size) return true;
  return f.get(c).some(v=>sel.has(v));
}
let query='';
function matchQuery(c){
  if(!query) return true;
  return query.split(/\s+/).every(term=>haystack(c).includes(term));
}
function buildFacets(){
  const counts=facetCounts();
  const nav=document.getElementById('facets');
  nav.innerHTML = FACETS.map(f=>{
    const m=counts[f.key];
    const keys=Object.keys(m).sort((a,b)=>m[b]-m[a]||a.localeCompare(b));
    const body=keys.map(v=>{
      const on=active[f.key].has(v);
      return `<label class="f ${on?'on':''}" data-fk="${f.key}" data-fv="${esc(v)}">
        <input type="checkbox" ${on?'checked':''}><span>${esc(v)}</span><span class="c">${m[v]}</span></label>`;
    }).join('');
    const n=active[f.key].size;
    return `<div class="fgroup"><div class="fhead" data-t="${f.key}">
      <span>${f.label}${n?` (${n})`:''}</span><span>${keys.length}</span></div>
      <div class="fbody" id="fb-${f.key}">${body}</div></div>`;
  }).join('');
  nav.querySelectorAll('.f').forEach(el=>el.addEventListener('click',e=>{
    e.preventDefault();
    const k=el.dataset.fk, v=el.dataset.fv;
    active[k].has(v)?active[k].delete(v):active[k].add(v);
    render();
  }));
  nav.querySelectorAll('.fhead').forEach(el=>el.addEventListener('click',()=>{
    document.getElementById('fb-'+el.dataset.t).classList.toggle('hidden');
  }));
}

/* ---------- list ---------- */
function apply(){
  filtered = CHECKS.filter(c=>matchQuery(c)&&FACETS.every(f=>matchFacet(c,f)));
  const dir=sortDir, k=sortKey;
  filtered.sort((a,b)=>{
    let x=a[k],y=b[k];
    if(Array.isArray(x)){x=x.join(',');y=y.join(',');}
    if(typeof x==='number') return (x-y)*dir;
    return String(x).localeCompare(String(y))*dir;
  });
}
let renderCap=300;
function renderRows(){
  const tb=document.getElementById('rows');
  const slice=filtered.slice(0,renderCap);
  tb.innerHTML = slice.map(c=>`<tr data-id="${c.id}" class="${selected===c.id?'sel':''}">
    <td class="rg">${esc(c.r)}</td>
    <td class="nm" title="${esc(c.n)}">${esc(c.n)}</td>
    <td>${c.t.map(t=>`<span class="tag ${esc(t)}">${esc(t)}</span>`).join('')}${c.miss?'<span class="tag miss">missable</span>':''}</td>
    <td class="mono">${c.f}</td>
    <td class="mono">${c.id}</td>
    <td class="rg">${esc(c.g||'')}</td></tr>`).join('');
  tb.querySelectorAll('tr').forEach(tr=>tr.addEventListener('click',()=>{
    selected=+tr.dataset.id; renderRows(); showDetail(CHECKS.find(c=>c.id===selected));
  }));
  document.getElementById('count').textContent =
    `${filtered.length.toLocaleString()} / ${CHECKS.length.toLocaleString()}` +
    (filtered.length>renderCap?`  (showing ${renderCap})`:'');
}
document.getElementById('listwrap').addEventListener('scroll',e=>{
  const el=e.target;
  if(el.scrollTop+el.clientHeight>el.scrollHeight-300 && renderCap<filtered.length){
    renderCap+=300; renderRows();
  }
});

/* ---------- detail ---------- */
function showDetail(c){
  const d=document.getElementById('detail'); d.classList.remove('empty');
  const rows=(arr,fn)=>arr&&arr.length?`<div class="rows">${arr.map(fn).join('')}</div>`:'<div style="color:var(--dim)">none</div>';
  d.innerHTML = `
   <h2>${esc(c.n)}</h2>
   <div class="sub">${esc(c.full)}</div>
   <div class="sec"><h3>Identity</h3><dl class="kv">
     <dt>Region</dt><dd>${esc(c.r)}</dd>
     <dt>Event flag</dt><dd>${c.f}</dd>
     <dt>AP id</dt><dd>${c.id}</dd>
     <dt>Tags</dt><dd>${c.t.length?c.t.map(t=>`<span class="tag ${esc(t)}">${esc(t)}</span>`).join(''):'<span style="color:var(--dim)">—</span>'}</dd>
     ${c.miss?`<dt>Missable</dt><dd style="color:var(--red)">${esc(c.miss)}</dd>`:''}
     ${c.fl?`<dt>Flags</dt><dd>${c.fl.map(f=>`<span class="tag">${esc(f)}</span>`).join('')}</dd>`:''}
     ${c.desc?`<dt>Description</dt><dd>${esc(c.desc)}</dd>`:''}
   </dl></div>
   <div class="sec"><h3>Where</h3><dl class="kv">
     <dt>Nearest grace</dt><dd>${esc(c.g)||'<span style="color:var(--dim)">unknown</span>'}</dd>
     <dt>Map tile(s)</dt><dd>${c.maps.length?c.maps.map(m=>`<span class="tag">${esc(m)}</span>`).join(''):'<span style="color:var(--dim)">no position</span>'}</dd>
     ${c.mapn.length?`<dt>Map name(s)</dt><dd>${c.mapn.map(esc).join(', ')}</dd>`:''}
     ${c.msrc.length?`<dt>Position src</dt><dd>${c.msrc.map(esc).join(', ')}</dd>`:''}
   </dl></div>
   <div class="sec"><h3>Item lots (${(c.lots||[]).length})</h3>
     ${rows(c.lots,l=>`<div>${esc(l.table)} <b>${esc(l.lot)}</b>.${esc(l.slot)} cat${esc(l.cat)} id${esc(l.item)} ×${esc(l.n)}<br><span style="color:var(--gold2)">${esc(l.name)}</span></div>`)}</div>
   ${(c.shop||[]).length?`<div class="sec"><h3>Shop rows (${c.shop.length})</h3>
     ${rows(c.shop,s=>`<div>row <b>${esc(s.row)}</b> — ${esc(s.item)} · ${esc(s.value)} runes<br><span style="color:var(--dim)">${esc(s.where)}</span></div>`)}</div>`:''}
   ${(c.gates||[]).length?`<div class="sec"><h3>Lot gates (${c.gates.length})</h3>
     ${rows(c.gates,g=>`<div>gate <b>f${esc(g.gate)}</b> · ${esc(g.ctx)} · ev ${esc(g.ev)}</div>`)}</div>`:''}
  `;
}

/* ---------- wiring ---------- */
function render(){ apply(); renderCap=300; buildFacets(); renderRows(); }
document.getElementById('q').addEventListener('input',e=>{
  query=e.target.value.trim().toLowerCase(); render();
});
document.getElementById('clear').addEventListener('click',()=>{
  FACETS.forEach(f=>active[f.key].clear());
  query=''; document.getElementById('q').value=''; render();
});
document.getElementById('csv').addEventListener('click',()=>{
  const esc2=s=>`"${String(s).replace(/"/g,'""')}"`;
  const lines=[['region','check','tags','flag','ap_id','nearest_grace','maps','missable'].join(',')];
  filtered.forEach(c=>lines.push([c.r,c.n,c.t.join('|'),c.f,c.id,c.g,c.maps.join('|'),c.miss||''].map(esc2).join(',')));
  const b=new Blob([lines.join('\n')],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download='er_checks_filtered.csv'; a.click();
});
document.querySelectorAll('thead th').forEach(th=>th.addEventListener('click',()=>{
  const k=th.dataset.s;
  if(sortKey===k) sortDir*=-1; else {sortKey=k;sortDir=1;}
  render();
}));
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement.id!=='q'){e.preventDefault();document.getElementById('q').focus();}
  if(e.key==='Escape'){document.getElementById('q').blur();}
});
document.getElementById('stamp').textContent =
  `${META.total.toLocaleString()} checks · ${META.regions.length} regions` + (META.stamp?` · ${META.stamp.slice(7,17)}`:'');
document.getElementById('foot').innerHTML = [
  `<span>${META.total.toLocaleString()} checks</span>`,
  `<span>${META.with_map.toLocaleString()} with a map position (${(100*META.with_map/META.total).toFixed(1)}%)</span>`,
  `<span>${META.with_grace.toLocaleString()} with a nearest grace</span>`,
  `<span>${META.with_gate.toLocaleString()} with a known lot gate</span>`,
  `<span>${META.missable.toLocaleString()} missable</span>`,
  `<span style="margin-left:auto">generated from repo data — no game files</span>`
].join('');
render();
</script>
</body>
</html>
