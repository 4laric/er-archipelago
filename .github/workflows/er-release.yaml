# er-release.yaml -- build stable tags and the moving development channel in CI.
#
# WHY. `package_release.ps1` is 687 lines of PowerShell that has only ever run on one Windows box.
# `release.yaml` beside this file states the consequence as settled fact -- "the bundle stays a
# Windows-built manual upload -- it contains the client .dll, which this runner cannot build" --
# and that is true of THAT runner, which is ubuntu-latest. It is not true of windows-latest, where
# the client repo has been building the same .dll on every PR for a month.
#
# ⭐ THE PAIRING BECOMES STRUCTURAL, NOT CHECKED. The .dll is built from the SUBMODULE, at the
# gitlink this tag records. So the apworld and the client in one zip cannot be from different
# commits -- not because a gate compared them afterwards, but because there was only ever one
# commit involved. The pin record has broken at v0.2.17, v0.3.1, v0.3.5, v0.3.7 and v0.3.11; every
# one of those was a .dll "built separately" and a record that disagreed. There is nothing left to
# disagree.
#
# 🛑 AP Flower's complete hi/low overrides cannot live in this public repo. Stable packaging fetches
# them from private `ICON_REPO`, puts them under `flower-package`, and generates the authenticated
# manifest. `pack_release.py` rewrites the STAGED ap.me3 to that directory and hard-fails if any
# profile package path is absent. Development builds omit the assets and ship no [[packages]] entry.
#
# 🛑 THIS DOES NOT REPLACE release.yaml. That one attaches the bare apworld and the wizard and is
# deliberately not gated on the pin. This one produces the player bundle. They attach to the same
# tag and neither blocks the other.
name: er-release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "version to package, e.g. 0.4.1"
        required: true
      unofficial:
        description: "cut a NON-RELEASE build (identity gates warn, correctness gates still fail)"
        type: boolean
        default: false
      stamp:
        description: "REQUIRED with unofficial: free-text label, e.g. auto-equip-preview"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: er-release-${{ github.ref == 'refs/heads/main' && 'dev' || github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  # -----------------------------------------------------------------------------------------------
  # The .dll, built from the submodule at this tag's gitlink. windows-latest because the target is
  # a Windows cdylib -- that part really is Windows-only, and it is the only part that is.
  # -----------------------------------------------------------------------------------------------
  client-dll:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      # A version tag is an immutable pair and uses its gitlink. The development channel is a
      # moving pair: world main plus client main, with both exact SHAs written into the bundle.
      - name: Use client main for a development build
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git -C from-software-archipelago-clients fetch origin main
          git -C from-software-archipelago-clients checkout --detach origin/main

      - id: pin
        shell: bash
        run: echo "sha=$(git -C from-software-archipelago-clients rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # nightly, because the client repo's rust-toolchain.toml pins it and stable rustfmt rewrites
      # its @generated files.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: from-software-archipelago-clients

      - name: Build the client
        working-directory: from-software-archipelago-clients
        run: cargo build --release -p eldenring-archipelago

      - uses: actions/upload-artifact@v4
        with:
          name: client-dll
          path: from-software-archipelago-clients/target/release/eldenring_archipelago.dll
          if-no-files-found: error
          retention-days: 7

    outputs:
      client_sha: ${{ steps.pin.outputs.sha }}

  # -----------------------------------------------------------------------------------------------
  # Everything else. Linux, because none of it needs Windows once the .dll exists.
  # -----------------------------------------------------------------------------------------------
  bundle:
    runs-on: ubuntu-latest
    needs: [client-dll]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          fetch-tags: true

      - name: Use the exact client commit built by the first job
        if: github.ref == 'refs/heads/main'
        run: |
          git -C from-software-archipelago-clients fetch origin "${{ needs.client-dll.outputs.client_sha }}"
          git -C from-software-archipelago-clients checkout --detach "${{ needs.client-dll.outputs.client_sha }}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - id: ver
        run: |
          if [ "${{ github.ref }}" = refs/heads/main ]; then
            v=$(python -c 'import json; print(json.load(open("greenfield/eldenring/archipelago.json"))["world_version"])')
          else
            v="${{ github.event.inputs.version || github.ref_name }}"
          fi
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"

      # 🛑 AP'S OWN REQUIREMENTS ARE THE WORKFLOW'S JOB, AND THIS FILE DID NOT DO IT.
      # `gf_zip_gen_smoke.py` bootstraps the pinned Archipelago checkout for itself, which reads
      # like it bootstraps everything -- it does not pip-install, and never claimed to. Both other
      # callers install: tests.yaml from `_ap/requirements.txt`, release.yaml as an inline list
      # beside its own copy of this gate. This one installed nothing, so on v0.4.1 -- the FIRST tag
      # this workflow ever ran on -- the gate died at `ModuleNotFoundError: No module named 'yaml'`
      # before Generate.py could load any world at all, and the bundle steps below it never ran.
      #
      # Cloning here rather than letting the tool do it is what makes the requirements file
      # reachable at pip time; the tool then finds `.ap-test/worlds` present and skips its own
      # bootstrap. Same pin, same upstream, one source of truth in `.ap-version`.
      - name: Archipelago, at the pin, with its requirements
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$(cat .ap-version)" \
            https://github.com/ArchipelagoMW/Archipelago.git .ap-test
          python -m pip install --upgrade pip
          pip install "setuptools<80"          # AP 0.6.x: pkg_resources removal
          pip install -r .ap-test/requirements.txt

      - name: Pack the apworld
        run: python tools/build_apworld.py -o dist/eldenring.apworld

      # THE GATE THAT MATTERS, and it is the same one release.yaml runs: a bundle whose apworld
      # cannot roll a seed is worse than no bundle -- it fails for the host, with our name on it.
      - name: The packed apworld generates a seed
        run: python tools/gf_zip_gen_smoke.py --apworld dist/eldenring.apworld

      - uses: actions/download-artifact@v4
        with:
          name: client-dll
          path: me3

      # Identity of the pair. Structural here (see the header) but the tool also checks the SHA
      # baked into the .dll, which is the half a gitlink cannot assert.
      #
      # 🛑 THIS STEP HAD TWO DEFECTS AND HAD NEVER ONCE RUN, so neither could be seen. On the only
      # tag this workflow has ever fired on, the zip smoke above it failed and every step from here
      # down was skipped; the first workflow_dispatch that got past the smoke went red HERE.
      #
      #   1. `--repo` is the WORLD repo root -- it is where the tool runs `git ls-tree HEAD
      #      from-software-archipelago-clients` to read the gitlink. It was being handed the CLIENT
      #      directory, so the tool looked for a gitlink to the client INSIDE the client and
      #      correctly reported "this tree does not record a client at all". Its default is already
      #      the right answer, which is why release.yaml, which passes no --repo, has always been
      #      fine. Reproduced verbatim in a sandbox clone with the pin correct.
      #   2. It sat ABOVE download-artifact, so the .dll half the comment promises could not run --
      #      there was no .dll on disk yet, and no --dll was passed either. Moving the step below
      #      the download is what makes the comment true.
      - name: The tag's record of what pairs with what
        env:
          # This ref exists only to reproduce the immutable v0.5.2 pair after client main moved.
          # The checker still verifies that the DLL embeds the tag's gitlink; only its unrelated
          # "pin equals current main" currency assertion is relaxed.
          ALLOW_STALE_PIN: "1"
        run: python tools/check_release_pairing.py --dll me3/eldenring_archipelago.dll
        continue-on-error: ${{ github.ref == 'refs/heads/main' || github.event.inputs.unofficial == 'true' }}

      - name: Fetch the AP Flower release atlases
        if: github.ref != 'refs/heads/main' && github.event.inputs.unofficial != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ICON_REPO }}
          token: ${{ secrets.ICON_REPO_TOKEN }}
          path: .icon
      - name: Stage AP Flower as installer input
        if: github.ref != 'refs/heads/main' && github.event.inputs.unofficial != 'true'
        run: |
          mkdir -p me3/flower-package
          cp -r .icon/ap-package/menu me3/flower-package/menu

      # The packer translates the local ap-package profile template to flower-package for stable
      # bundles, or removes [[packages]] for asset-free development bundles. Its correctness gate
      # then resolves every declared package against the finished me3/ stage before writing a zip.
      - name: Assemble and validate me3 profile paths
        env:
          CLIENT_SHA: ${{ needs.client-dll.outputs.client_sha }}
        run: |
          set +e
          extra=()
          if [ "${{ github.ref }}" = refs/heads/main ]; then
            extra=(--unofficial --stamp "dev-${GITHUB_SHA::7}")
          elif [ "${{ github.event.inputs.unofficial }}" = true ]; then
            extra=(--unofficial --stamp "${{ github.event.inputs.stamp }}")
          fi
          python tools/pack_release.py \
            --version "${{ steps.ver.outputs.version }}" \
            --apworld dist/eldenring.apworld \
            --client-dir from-software-archipelago-clients \
            --out dist \
            "${extra[@]}"
          rc=$?
          # 🛑 2 IS "STAGED WITH WARNINGS", NOT FAILURE, and it must not collapse into 0 or 1. It is
          # how an unofficial build says it is not a release.
          if [ $rc -eq 2 ]; then echo "::warning::packaged with warnings"; elif [ $rc -ne 0 ]; then exit $rc; fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref == 'refs/heads/main' && 'er-archipelago-dev' || 'er-archipelago-bundle' }}
          path: |
            dist/*.zip
            dist/*.apworld
          if-no-files-found: error
          retention-days: 30

      # Only a real tag publishes. A workflow_dispatch run leaves the artifact and stops.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*.zip
          fail_on_unmatched_files: true

      - name: Publish the moving development channel
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bundle=$(find dist -maxdepth 1 -name '*-UNOFFICIAL-dev-*.zip' -print -quit)
          apworld=$(find dist -maxdepth 1 -name '*-UNOFFICIAL-dev-*.apworld' -print -quit)
          test -n "$bundle" && test -n "$apworld"
          cp "$bundle" dist/ER-Archipelago-dev.zip
          cp "$apworld" dist/eldenring-dev.apworld

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -f dev "$GITHUB_SHA"
          git push --force origin refs/tags/dev

          if gh release view dev >/dev/null 2>&1; then
            gh release edit dev --prerelease --latest=false \
              --title "Development build ${GITHUB_SHA::7}" \
              --notes "Automated development build from world main and client main. Not a stable release. The AP flower icon override is intentionally omitted; AP items use the Telescope icon. Exact world and client SHAs are inside the bundle."
          else
            gh release create dev --prerelease --latest=false \
              --title "Development build ${GITHUB_SHA::7}" \
              --notes "Automated development build from world main and client main. Not a stable release. The AP flower icon override is intentionally omitted; AP items use the Telescope icon. Exact world and client SHAs are inside the bundle."
          fi
          gh release upload dev dist/ER-Archipelago-dev.zip dist/eldenring-dev.apworld --clobber
