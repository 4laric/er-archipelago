# release.yaml -- on a tag, publish the assets a tag is supposed to carry.
#
# WHY THIS EXISTS. release/DISTRIBUTION.md promises TWO assets per tag: the player bundle, and a
# bare `eldenring.apworld` for hosts -- on the reasoning that making someone who is generating a
# multiworld download "a 10 MB bundle with a game-mod DLL in it" is "friction for nothing". Measured
# 2026-08-08: every release from v0.3.2 to v0.3.7 carries ONE asset, the bundle, at 123.7 MB. The
# scheme the doc argues for has never shipped, because the packer is PowerShell and lives on one
# Windows box. The bare apworld is 1.3 MB.
#
# The bundle stays a Windows-built manual upload -- it contains the client .dll, which this runner
# cannot build. What moves here is everything that CAN be built from the repo alone, so a tag stops
# depending on someone remembering to attach it.
#
# 🛑 THIS JOB DOES NOT GATE THE TAG. `tests` / `generators` / `regen-and-fill` already ran on the
# commit; re-running them here would only be able to tell us the tag was a mistake after it was
# public. It packs and attaches, and it refuses to attach an apworld it could not generate from.
#
# 🛑🛑 TWO JOBS, AND THE SPLIT IS THE POINT (2026-08-12). The pin check used to be step 5 of `assets`,
# above the pack/attach steps. On v0.3.11 it did exactly what it was written to do -- went red on a
# stale pin -- and because it sat above them, hosts got a ONE-ASSET release: no `eldenring.apworld`,
# no wizard. A correct alarm inflicted the only player-facing damage of the whole incident, and it
# could not un-publish the tag it was complaining about. So:
#
#   pin-record : the alarm. Hard-fails, and FILES AN ISSUE -- because a red run is a line in a log
#                nobody opens, and the issue queue is the one place things actually get read.
#   assets     : unconditional. The apworld and the wizard are world-repo artifacts and have nothing
#                to do with the pin; a stale pin must never again cost a host their download.
#
# The BINDING copy of this check is not here and cannot be. It is in package_release.ps1, where the
# zip is born -- no agreement, no zip, no upload. Both call tools/check_release_pairing.py; neither
# re-implements it.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to (re)attach assets to"
        required: true
      allow_stale_pin:
        description: "1 if this tag deliberately trails client main"
        required: false
        default: "0"
      dry_run:
        description: "build and catalog the apworld without calling Azure or touching the release"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write        # pin-record files an issue when the tag's record is wrong
  id-token: write
  attestations: write

jobs:
  # ---------------------------------------------------------------------------------------------
  # THE PIN IS THE ONE THING A TAG RECORDS THAT NOTHING ELSE CAN FIX AFTERWARDS.
  #
  # `generators` checks the gitlink's client agrees with the world -- it CANNOT see staleness,
  # because it checks out the client AT the gitlink, so an ancient pin agrees with itself perfectly.
  # `client-main-drift` does see it, and says so with `::notice::` -- on pushes to main and the
  # nightly schedule only, never on a PR, and a notice is a line in a job log nobody opens.
  #
  # It has now happened at v0.2.17, v0.3.1, v0.3.5, v0.3.7 and v0.3.11. Every time, the shipped .dll
  # was built separately and was fine; what was wrong is the tag's RECORD of what pairs with what,
  # which is the only thing anybody has to go on when a bug report arrives.
  #
  # This job runs on: push: tags, so it is an ALARM, not a gate -- it cannot un-publish a tag. What
  # makes it useful is the failure path: it files an ISSUE naming both SHAs, so the record of a
  # broken record lands in the queue that gets read instead of in a run nobody opens. The gate that
  # actually binds is in package_release.ps1, which cannot produce a zip while these disagree.
  pin-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No submodule and no .dll on this runner, so the tool answers the smaller question (pin vs
      # client main) and SAYS which checks it skipped rather than passing quietly. Same file the
      # packager runs; ALLOW_STALE_PIN is honoured for a deliberately trailing tag.
      - name: The pinned client is the client this tag ships
        env:
          ALLOW_STALE_PIN: ${{ github.event.inputs.allow_stale_pin || '0' }}
        run: python tools/check_release_pairing.py

      # A YAML block scalar and a shell heredoc do not mix -- the terminator has to sit at column
      # zero and that ends the block. Build the body with printf into a file instead.
      - name: File an issue -- this tag's record of its client is wrong
        if: failure() && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          title="release ${TAG} records a client pin that is not client main"
          # One issue per tag. A re-run of the same tag must not stack duplicates -- a queue with
          # three copies of the same alarm is how an alarm stops being read.
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' || true)"
          if [ -n "${existing:-}" ] && [ "${existing}" != "null" ]; then
            echo "already filed as #${existing}"
            exit 0
          fi
          pin="$(git ls-tree HEAD from-software-archipelago-clients | awk '$2 == "commit" { print $3 }')"
          head="$(git ls-remote https://github.com/4laric/from-software-archipelago-clients.git main | cut -f1)"
          {
            printf '`%s` pins client `%s` but client `main` is `%s`.\n\n' "$TAG" "$pin" "$head"
            printf 'The bundle is probably FINE. `package_release.ps1` packages the client WORKING\n'
            printf 'TREE, not the gitlink, so this is almost certainly a wrong RECORD rather than a\n'
            printf 'wrong build -- that is what happened at v0.3.11, where two reviewers read this\n'
            printf 'same signal and wrongly concluded players had shipped stale code.\n\n'
            printf 'It is still the expensive kind of wrong: no bug report against `%s` can be\n' "$TAG"
            printf 'resolved to a client commit, and nothing recovers it later.\n\n'
            printf 'Do NOT re-cut the release on the strength of this issue alone. Open the shipped\n'
            printf 'zip and read the .dll ER_GIT_SHA first -- the artifact identifies itself.\n\n'
            printf 'Filed by release.yaml pin-record. The BINDING check is in package_release.ps1\n'
            printf 'via tools/check_release_pairing.py, which cannot produce a zip from a mismatch.\n'
          } > /tmp/pin_issue_$$.md
          test -s /tmp/pin_issue_$$.md
          gh issue create --title "$title" --label bug --label area:release --body-file /tmp/pin_issue_$$.md

  assets:
    runs-on: ubuntu-latest
    # Deliberately NOT `needs: pin-record`. On v0.3.11 the pin check sat above these steps and a
    # stale pin cost hosts the apworld and the wizard -- assets that have nothing to do with the pin.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: The channel ledger names things that exist
        run: python tools/check_channels.py

      - name: Pack the bare apworld
        run: |
          python tools/build_apworld.py -o dist/eldenring.apworld
          ls -l dist/

      # THE GATE THAT MATTERS. A bare apworld that installs but cannot roll a seed is worse than no
      # asset at all -- it fails for the host, in their generation, with our name on it. So the zip
      # is installed into a stock pinned Archipelago and made to generate, exactly the way a host
      # would use it. package_release.ps1 calls the same idea its "zip-gen gate".
      - name: The packed apworld generates a seed
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$(cat .ap-version)" \
            https://github.com/ArchipelagoMW/Archipelago.git /tmp/ap
          python -m pip install --quiet pyyaml schema jsonschema platformdirs certifi colorama \
            typing-extensions pathspec bsdiff4
          mkdir -p /tmp/ap/custom_worlds /tmp/players /tmp/out
          cp dist/eldenring.apworld /tmp/ap/custom_worlds/
          # The game name comes from the metadata, never a literal -- the wizard shipped yamls
          # naming "EldenRing" for months because three strings were typed by hand (#463).
          GAME="$(python -c 'import json;print(json.load(open("wizard/options-metadata.json"))["game"])')"
          printf 'name: ReleaseSmoke\ndescription: packed-apworld gate\ngame: %s\n\n%s:\n  num_regions: 2\n' \
            "$GAME" "$GAME" > /tmp/players/smoke.yaml
          cd /tmp/ap
          # 🛑 stdin MUST be closed. Generate.py ends with `Press enter to close.` on ANY unhandled
          # error, so a crash presents as a HANG and the job dies on the runner timeout with the
          # traceback scrolled off. </dev/null turns the hang back into the crash it is.
          AP_NONINTERACTIVE=1 SKIP_REQUIREMENTS_UPDATE=1 \
            python Generate.py --player_files_path /tmp/players --outputpath /tmp/out \
            --seed 20260808 --spoiler 3 </dev/null > /tmp/gen.log 2>&1 || {
              echo "::error::the packed apworld could not generate a seed"; tail -60 /tmp/gen.log; exit 1; }
          grep -E "^ *${GAME} +:" /tmp/gen.log || true
          test -n "$(ls /tmp/out/*.zip 2>/dev/null)" || {
            echo "::error::generation produced no output"; tail -60 /tmp/gen.log; exit 1; }
          echo "generated: $(ls /tmp/out)"

      - name: Build the wizard asset
        run: cp wizard/wizard.html dist/er-options-wizard.html

      # Offline pages share one optional ZIP asset. deploy_wizard.sh supports both this archive
      # and older individual assets, preserving the stable tag pin. They used to be committed, so
      # tools/deploy_wizard.sh could fetch them from raw.githubusercontent at the STABLE tag. They
      # are built in CI instead (see .github/workflows/pages.yaml and .gitignore), and a tag has to
      # keep carrying them or the public host loses /er/checks.html, /er/review.html and
      # /er/questlines.html the first time stable moves past this change. Pinning matters here and
      # is the whole point of that script: a page from a different ref describes a corpus the
      # released apworld does not have.
      - name: Materialise the generator inputs from the committed bundle
        run: python tools/gen_inputs.py --ensure elden_ring_artifacts
      - name: Build the offline pages
        run: |
          set -euo pipefail
          python tools/regen_all.py --phases pages
          for page in er-archipelago-check-browser.html \
                      er-archipelago-evidence-browser.html \
                      er-archipelago-questline-dag.html \
                      er-archipelago-region-second-opinion.html \
                      er-archipelago-desc-triage.html; do
            test -s "$page" || { echo "::error::$page was not built"; exit 1; }
            cp "$page" dist/
          done
          ls -l dist/

      - name: Package optional offline tools
        run: python tools/package_offline_tools.py --directory dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: |
            dist/eldenring.apworld
            dist/Optional-Offline-Tools.zip
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------------------------
  # `eldenring.apworld` is a zip, not a PE file, so Authenticode has nothing on it to sign directly
  # (see er-release.yaml's client-dll signing for the .dll case, where it does). The standard way to
  # extend Authenticode trust to non-PE content is the same one Windows itself uses for driver
  # packages: a security catalog (.cat) that records the file's hash, which IS a PE-adjacent format
  # Authenticode can sign. `makecat` builds it, `signtool`/Get-AuthenticodeSignature build and check
  # it, both from the Windows SDK already on windows-latest. A host verifies the apworld by checking
  # the shipped .cat's signature and confirming it lists a matching SHA-256 of the apworld -- the
  # same two-step verification Windows uses for a signed driver.
  sign-apworld:
    runs-on: windows-latest
    needs: assets
    environment: release-signing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Locate signtool and makecat from the Windows SDK
        id: sdk-tools
        shell: pwsh
        run: |
          $root = "C:\Program Files (x86)\Windows Kits\10\bin"
          $signtool = Get-ChildItem -Path $root -Recurse -Filter signtool.exe -ErrorAction Stop |
            Where-Object { $_.FullName -match "x64" } | Select-Object -First 1 -ExpandProperty DirectoryName
          $makecat = Get-ChildItem -Path $root -Recurse -Filter makecat.exe -ErrorAction Stop |
            Where-Object { $_.FullName -match "x64" } | Select-Object -First 1 -ExpandProperty DirectoryName
          if (-not $signtool) { throw "signtool.exe not found under $root" }
          if (-not $makecat) { throw "makecat.exe not found under $root" }
          "$signtool" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "$makecat" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build the catalog for the bare apworld
        shell: pwsh
        run: |
          @"
          [CatalogHeader]
          Name=eldenring.apworld.cat
          ResultDir=.
          PublicVersion=0x0000001
          CatalogVersion=2
          HashAlgorithms=SHA256

          [CatalogFiles]
          <hash>eldenring.apworld=dist\eldenring.apworld
          "@ | Set-Content -Path eldenring.apworld.cdf -Encoding ascii
          makecat -v eldenring.apworld.cdf
          if ($LASTEXITCODE -ne 0) { throw "makecat failed" }
          if (-not (Test-Path eldenring.apworld.cat)) { throw "makecat produced no catalog" }

      # dry_run proves the catalog builds and the workflow plumbs correctly on a throwaway tag
      # without spending an Azure Trusted Signing call or touching the release -- the catalog is
      # left unsigned and every step past it that needs a real signature or a real release is
      # skipped in favour of a report.
      - name: Dry run - catalog built but not signed
        if: github.event.inputs.dry_run == 'true'
        shell: pwsh
        run: |
          Write-Host "::notice::dry_run is set -- eldenring.apworld.cat will NOT be signed and nothing will be attached to any release"
          $hash = (Get-FileHash -LiteralPath dist\eldenring.apworld -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "apworld SHA-256: $hash"
          Get-Item eldenring.apworld.cat | Format-List Name, Length, LastWriteTime

      - name: Azure login for Artifact Signing
        if: github.event.inputs.dry_run != 'true'
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticode-sign the apworld catalog
        if: github.event.inputs.dry_run != 'true'
        uses: azure/artifact-signing-action@c0ae2c1d0c1847ab81ac0ab8521bee597cfedd30
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: |
            ${{ github.workspace }}\eldenring.apworld.cat
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify the catalog signature and its apworld hash
        if: github.event.inputs.dry_run != 'true'
        shell: pwsh
        env:
          EXPECTED_SIGNER_SUBJECT: ${{ vars.ARTIFACT_SIGNING_EXPECTED_SUBJECT }}
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath eldenring.apworld.cat
          if ($signature.Status -ne "Valid") {
            throw "Authenticode verification failed for eldenring.apworld.cat: $($signature.Status) $($signature.StatusMessage)"
          }
          if (-not $signature.TimeStamperCertificate) { throw "Authenticode timestamp is missing for eldenring.apworld.cat" }
          if ($env:EXPECTED_SIGNER_SUBJECT -and $signature.SignerCertificate.Subject -ne $env:EXPECTED_SIGNER_SUBJECT) {
            throw "Unexpected signer for eldenring.apworld.cat: $($signature.SignerCertificate.Subject)"
          }
          # A signed catalog that lists the wrong hash is worse than no catalog: it is a trust
          # signal pointing at nothing. `/c <catalog> <file>` asks signtool to look the file's hash
          # up IN that catalog, not just check the catalog's own signature -- so this fails if the
          # apworld this job downloaded doesn't match what got hashed into the catalog above.
          & signtool verify /pa /v /c eldenring.apworld.cat dist\eldenring.apworld
          if ($LASTEXITCODE -ne 0) { throw "eldenring.apworld does not match a member of eldenring.apworld.cat" }
          $hash = (Get-FileHash -LiteralPath dist\eldenring.apworld -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "VERIFIED eldenring.apworld.cat | $($signature.SignerCertificate.Subject) | timestamp $($signature.TimeStamperCertificate.Subject)"
          Write-Host "apworld SHA-256: $hash"

      - name: Attest the release artifacts
        if: github.event.inputs.dry_run != 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/eldenring.apworld
            dist/Optional-Offline-Tools.zip
            eldenring.apworld.cat

      - name: Attach to the release
        if: github.event.inputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          make_latest: ${{ contains(github.event.inputs.tag || github.ref_name, '-') && 'false' || ((github.event.inputs.tag || github.ref_name) == 'v0.6.0' && 'true' || 'legacy') }}
          files: |
            dist/eldenring.apworld
            dist/Optional-Offline-Tools.zip
            eldenring.apworld.cat
          fail_on_unmatched_files: true
