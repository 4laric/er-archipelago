# release.yaml -- on a tag, publish the assets a tag is supposed to carry.
#
# WHY THIS EXISTS. release/DISTRIBUTION.md promises TWO assets per tag: the player bundle, and a
# bare `eldenring.apworld` for hosts -- on the reasoning that making someone who is generating a
# multiworld download "a 10 MB bundle with a game-mod DLL in it" is "friction for nothing". Measured
# 2026-08-08: every release from v0.3.2 to v0.3.7 carries ONE asset, the bundle, at 123.7 MB. The
# scheme the doc argues for has never shipped, because the packer is PowerShell and lives on one
# Windows box. The bare apworld is 1.3 MB.
#
# The bundle stays a Windows-built manual upload -- it contains the client .dll, which this runner
# cannot build. What moves here is everything that CAN be built from the repo alone, so a tag stops
# depending on someone remembering to attach it.
#
# 🛑 THIS JOB DOES NOT GATE THE TAG. `tests` / `generators` / `regen-and-fill` already ran on the
# commit; re-running them here would only be able to tell us the tag was a mistake after it was
# public. It packs and attaches, and it refuses to attach an apworld it could not generate from.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to (re)attach assets to"
        required: true

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: The channel ledger names things that exist
        run: python tools/check_channels.py

      # 🛑 THE PIN IS THE ONE THING A TAG RECORDS THAT NOTHING ELSE CAN FIX AFTERWARDS.
      #
      # `generators` checks the gitlink's client agrees with the world -- it CANNOT see staleness,
      # because it checks out the client AT the gitlink, so an ancient pin agrees with itself
      # perfectly. `client-main-drift` does see it, and says so with `::notice::` -- on pushes to
      # main and the nightly schedule only, never on a PR, and a notice is a line in a job log
      # nobody opens. Its own message defers to "REQUIRED before a tag (RELEASE-CHECKLIST)", and
      # the checklist had no such row.
      #
      # So it happened twice. v0.3.7 was tagged with a pin FIVE client merges old, and on
      # 2026-08-08 the pin was ELEVEN behind again inside a single window. Both times the shipped
      # .dll was built separately and was probably fine; what was wrong is the tag's RECORD of what
      # pairs with what, which is the only thing anybody has to go on when a bug report arrives.
      #
      # A notice is right for main -- client-only work mid-window is normal. At a TAG it is a hard
      # requirement, and this is the first moment it can be enforced rather than remembered.
      # ALLOW_STALE_PIN=1 for the case where a tag deliberately trails client main; it has to be
      # typed, which is the point.
      - name: The pinned client is the client this tag ships
        run: |
          set -euo pipefail
          pin="$(git ls-tree HEAD from-software-archipelago-clients | awk '$2 == "commit" { print $3 }')"
          test -n "$pin" || { echo "::error::no gitlink at from-software-archipelago-clients"; exit 1; }
          head="$(git ls-remote https://github.com/4laric/from-software-archipelago-clients.git main | cut -f1)"
          echo "pinned gitlink : $pin"
          echo "client main    : $head"
          if [ "$pin" = "$head" ]; then echo "the pin is current."; exit 0; fi
          if [ "${ALLOW_STALE_PIN:-0}" = "1" ]; then
            echo "::warning::pin is behind client main, allowed by ALLOW_STALE_PIN"; exit 0
          fi
          echo "::error::this tag pins a client that is not the current one. The release would"
          echo "::error::record the wrong pairing, and no later fix can recover which build shipped."
          echo "::error::Bump the gitlink and re-tag, or set ALLOW_STALE_PIN=1 if it is deliberate."
          exit 1

      - name: Pack the bare apworld
        run: |
          python tools/build_apworld.py -o dist/eldenring.apworld
          ls -l dist/

      # THE GATE THAT MATTERS. A bare apworld that installs but cannot roll a seed is worse than no
      # asset at all -- it fails for the host, in their generation, with our name on it. So the zip
      # is installed into a stock pinned Archipelago and made to generate, exactly the way a host
      # would use it. package_release.ps1 calls the same idea its "zip-gen gate".
      - name: The packed apworld generates a seed
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$(cat .ap-version)" \
            https://github.com/ArchipelagoMW/Archipelago.git /tmp/ap
          python -m pip install --quiet pyyaml schema jsonschema platformdirs certifi colorama \
            typing-extensions pathspec bsdiff4
          mkdir -p /tmp/ap/custom_worlds /tmp/players /tmp/out
          cp dist/eldenring.apworld /tmp/ap/custom_worlds/
          # The game name comes from the metadata, never a literal -- the wizard shipped yamls
          # naming "EldenRing" for months because three strings were typed by hand (#463).
          GAME="$(python -c 'import json;print(json.load(open("wizard/options-metadata.json"))["game"])')"
          printf 'name: ReleaseSmoke\ndescription: packed-apworld gate\ngame: %s\n\n%s:\n  num_regions: 2\n' \
            "$GAME" "$GAME" > /tmp/players/smoke.yaml
          cd /tmp/ap
          # 🛑 stdin MUST be closed. Generate.py ends with `Press enter to close.` on ANY unhandled
          # error, so a crash presents as a HANG and the job dies on the runner timeout with the
          # traceback scrolled off. </dev/null turns the hang back into the crash it is.
          AP_NONINTERACTIVE=1 SKIP_REQUIREMENTS_UPDATE=1 \
            python Generate.py --player_files_path /tmp/players --outputpath /tmp/out \
            --seed 20260808 --spoiler 3 </dev/null > /tmp/gen.log 2>&1 || {
              echo "::error::the packed apworld could not generate a seed"; tail -60 /tmp/gen.log; exit 1; }
          grep -E "^ *${GAME} +:" /tmp/gen.log || true
          test -n "$(ls /tmp/out/*.zip 2>/dev/null)" || {
            echo "::error::generation produced no output"; tail -60 /tmp/gen.log; exit 1; }
          echo "generated: $(ls /tmp/out)"

      - name: Build the wizard asset
        run: cp wizard/wizard.html dist/er-options-wizard.html

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/eldenring.apworld
            dist/er-options-wizard.html
          fail_on_unmatched_files: true
