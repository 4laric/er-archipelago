name: Test

# The apworld had NO CI at all. The client got a runner on 2026-07-12 and it immediately caught three
# compile errors that had been sitting on main; this repo is the same blind spot one repo over. Today's
# Windows build broke because `tools/gen_location_regions.py` still called the retired
# `contract.is_big_ticket` -- a rename an AP-free tool could not follow. That is a ten-second failure on
# a runner and it cost a build round-trip through Alaric instead.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # For `client-main-drift` (job 3) ONLY -- every other job opts out with
  # `if: github.event_name != 'schedule'`. That job compares world main against the CLIENT's main,
  # which moves without any world commit, so it is the one gate here that needs a trigger no world
  # commit provides. GitHub silently disables cron on a repo with 60 days of no pushes; this repo is
  # nowhere near that, but a disabled schedule would make the job dark rather than red, so the job
  # also runs on push-to-main and can be fired by hand.
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

env:
  # AP pins its own deps at import time and will try to self-update mid-test without this.
  SKIP_REQUIREMENTS_UPDATE: "1"

jobs:
  # The Flower installer is shipped as both a Python entrypoint and a thin PowerShell launcher.
  # Function tests alone do not catch argument-forwarding, interpreter discovery, or exit-code
  # mistakes in those player-facing entrypoints, so exercise a complete synthetic install and
  # uninstall on both supported runner families.
  flower-install:
    name: AP Flower install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install, verify, and uninstall synthetic Flower package
        run: python -m unittest -v tools/test_install_ap_flower.py

  # ---------------------------------------------------------------------------------------------
  # 1. The apworld test suite, run inside a real Archipelago tree (the world is a package under
  #    worlds/, so it can only be imported from there -- `from ..location_tags import ...`).
  # ---------------------------------------------------------------------------------------------
  tests:
    # SHARDED 2026-08-18 (#865). This was 1113s of an 1113s workflow -- 1069s of it in the pytest
    # step alone, already spread over both cores of the hosted runner by `-n 2 --dist loadfile`.
    # Queue time was measured at 2-4s, so waiting was never the problem and more capacity alone
    # would buy nothing; the only lever without new hardware is running the suite as several jobs.
    #
    # The shard count lives HERE and nowhere else. The partition is arithmetic over the sorted
    # collected files (tests/conftest.py gf_shard_owner), so changing this list is the whole change
    # -- there is no file manifest to keep in step, because a manifest is a gate that quietly stops
    # covering new tests.
    #
    # 🛑 Both run-level gates are DEFERRED here, not dropped. `--skip-census` counts skips per
    # family and no single shard can satisfy an exact count; the quantifier spy's STALE half fires
    # a FALSE RED when a correctly-waived empty site happens to be non-empty in this shard. Their
    # verdicts are rendered once, over the union, by the `tests-verdict` job below. That job is
    # what `tests` means -- do not make the branch protection depend on this matrix alone.
    # A job's env context does not exist while GitHub evaluates its display name. Referencing
    # env.SHARD_TOTAL here rejects the entire workflow before it creates even one job.
    name: tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    env:
      # WIDENED 4 -> 8 (#875). Widening was worth exactly NOTHING until the floor moved: with
      # test_gf_keep_out_of_shops.py at 450s, 4, 6 and 8 shards all modelled to the same 450s wall,
      # because `--dist loadfile` runs a module on one worker. With that file down to ~122s the
      # floor is test_gf_options.py at 131s, and the arithmetic finally rewards more shards:
      #   4 shards -> max(parallel 195s, floor 131s) = 195s
      #   8 shards -> max(parallel  97s, floor 131s) = 131s
      # Past 8 it is floor-bound again and buys nothing, so this is the last widening that pays.
      #
      # 🛑 SHARD_TOTAL and the matrix list below must agree. They cannot drift SILENTLY: every
      # shard records its own index and total, and tests-verdict asserts the indices are exactly
      # 1..total, so a mismatch is a red reconciliation rather than a quietly unrun slice.
      SHARD_TOTAL: 8
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The AP pin lives in ONE place -- .ap-version -- read here AND by bootstrap-ap.ps1, so the version
      # you develop against and the version CI gates on cannot drift apart. An unpinned clone would mean a
      # green main can go red overnight on someone else's commit, which trains everyone to ignore the badge.
      - name: Read the Archipelago pin
        id: ap
        run: echo "version=$(cat .ap-version)" >> "$GITHUB_OUTPUT"

      - name: Check out stock upstream Archipelago
        uses: actions/checkout@v4
        with:
          repository: ArchipelagoMW/Archipelago    # UPSTREAM. Never a fork -- see bootstrap-ap.ps1.
          ref: ${{ steps.ap.outputs.version }}
          # NOT `Archipelago`: this repo already has a submodule at that exact path, and the second
          # checkout collided with it ("Entering 'Archipelago'" -> git bailed).
          path: _ap

      - name: Install Archipelago's requirements
        run: |
          python -m pip install --upgrade pip
          # AP 0.6.x is not compatible with setuptools >= 80 (pkg_resources removal).
          pip install "setuptools<80"
          pip install -r _ap/requirements.txt
          # The world suite is CPU-bound generation work. GitHub's hosted Ubuntu runner has two
          # cores, so run one worker per core; --dist loadfile keeps every test module together,
          # preserving its collection/order assumptions while independent modules run in parallel.
          pip install pytest pytest-xdist

      # THE BUNDLE, EXPLICITLY (2026-08-04, inert-test audit finding #3). Everything the
      # item-existence oracle and gen_stamp's freshness gate (test_D) read has shipped in the
      # committed gen_inputs bundle since 2026-07-27 -- but this job never ran --ensure, so both
      # sat dark here while their skip messages claimed the runner could not run them. Worse, the
      # extraction DID happen anyway: test_gf_infinite_shop_rows ensures the bundle for itself
      # mid-run, so whether a suite saw elden_ring_artifacts/ depended on pytest COLLECTION ORDER
      # (g < i alphabetically: gen_stamp skipped, item_exists ran after extraction and skipped
      # only because of its own path bug). Explicit beats incidental.
      - name: Materialise gen_data's inputs from the committed bundle
        run: python tools/gen_inputs.py --ensure elden_ring_artifacts

      # THE CLIENT, AT THE GITLINK -- same three steps as the `generators` job, same reason to
      # keep them textually parallel. Three pytest gates in THIS job read the client checkout and
      # skipped silently without it, forever: test_gf_scadu_supply's rung-for-rung SCADU_CUM
      # mirror ("a drifted rung moves every player's difficulty floor with nothing to say so" --
      # the exact failure mode its sibling scaling_ladder_mirror was added for), and
      # test_gf_data's two client-table gates (the hand-mirror ban on REGION_PLAY_IDS and the
      # region_locks.rs staleness check). The census below pins them RUNNING from now on.
      - name: Resolve the PINNED client commit (the gitlink, not client main)
        id: pin
        run: |
          sha="$(git ls-tree HEAD from-software-archipelago-clients | awk '$2 == "commit" { print $3 }')"
          test -n "$sha" || { echo "::error::no gitlink at from-software-archipelago-clients"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "pinned client commit: $sha"
      - uses: actions/checkout@v4
        with:
          repository: 4laric/from-software-archipelago-clients
          ref: ${{ steps.pin.outputs.sha }}
          path: from-software-archipelago-clients
      - name: The client checkout is real, and is the pin
        run: |
          test -d from-software-archipelago-clients/crates \
            || { echo "::error::client checkout has no crates/ -- the cross-side gates would SKIP and gate nothing"; exit 1; }
          have="$(git -C from-software-archipelago-clients rev-parse HEAD)"
          test "$have" = "${{ steps.pin.outputs.sha }}" \
            || { echo "::error::client HEAD $have is not the pinned ${{ steps.pin.outputs.sha }}"; exit 1; }
          echo "client at the pin: $have"

      # ONE HARNESS, used here and by run_ci.ps1 on the dev box. It used to be two: CI installed the
      # world into a freshly-checked-out upstream AP, while run_ci.ps1 installed it into <repo>\Archipelago
      # -- whatever that happened to be. On 2026-07-13 that directory was a clone of fswap/Archipelago
      # (Bedrock's fork, kept for playtesting his seeds), so the dev box was gating the apworld against a
      # different Archipelago than CI: 661 tests collected vs 686, a different Fill.py, different spheres,
      # and a test that is green here failed there. tools/gf_test.py is now the only definition of the
      # harness -- it pins .ap-version, REFUSES to run against a fork, and installs (never symlinks).
      # --quantifier-spy: fail the run if any all()/any() in the suite was called on an EMPTY
      # iterable. `all([])` is True and `any([])` is False -- both the answer the test wanted -- so a
      # quantifier whose subject set has silently become empty passes for exactly the same reason it
      # would pass if the mechanism worked. Measured zero on 2026-08-04 and again on 08-05; the
      # guard exists for the day a table is renamed or a filter stops matching.
      # --skip-census: the observed skip inventory must match the committed census exactly
      # (greenfield/eldenring/tests/expected_skips_ci.json). "Deliberately dev-box-only" and
      # "dark by accident" look identical in a green run; the census is the instrument that can
      # tell them apart, and it turns any skip-family or count change into a reviewed diff.
      - name: pytest (tools/gf_test.py -- pinned upstream AP, shard ${{ matrix.shard }})
        run: |
          python tools/gf_test.py --ap-dir _ap \
            --shard ${{ matrix.shard }}/${{ env.SHARD_TOTAL }} --artifact-dir shard-artifacts \
            --quantifier-spy --skip-census greenfield/eldenring/tests/expected_skips_ci.json \
            -n 2 --dist loadfile

      # ALWAYS upload. A shard that went red is the shard whose census and spy records the verdict
      # job most needs -- and without `if: always()` a single failing shard would take the union
      # with it and report a reconciliation error on top of the real failure, burying it.
      - name: Upload this shard's census, spy and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gf-shard-${{ matrix.shard }}
          path: shard-artifacts/
          retention-days: 5
          if-no-files-found: error


  # ---------------------------------------------------------------------------------------------
  # 1a. THE UNION VERDICT (#865). The two gates the shards deliberately do not render.
  #
  #     A shard is not a run. `--skip-census` asserts an EXACT per-family skip count and no single
  #     shard can satisfy one; the vacuous-quantifier spy's STALE half asks whether a waived site
  #     was ever empty, and "ever" is a property of the union -- judged per shard it turns a correct
  #     waiver into a red tick for a reason that is an artifact of the split.
  #
  #     The pressure that creates is the dangerous part: the obvious way to make a falsely-red shard
  #     green is to stop passing the gates to the shards, after which both instruments are still in
  #     the tree, still look armed, and examine nothing. This job is what stops that trade being
  #     available. It also answers the question a sharded green run cannot answer for itself --
  #     whether every collected test was selected by exactly one shard, because a shard that lost a
  #     module is indistinguishable from a shard that was quick.
  # ---------------------------------------------------------------------------------------------
  tests-verdict:
    name: tests (union verdict)
    needs: tests
    # always(), so a red shard still produces the union -- its census and spy are exactly what a
    # failure investigation needs, and they are the artifacts most likely to be thrown away.
    if: always() && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # This job must never be green over a red matrix. Branch protection sees job NAMES, and
      # "tests (union verdict)" is the one that reads like the answer.
      - name: Every shard finished
        if: needs.tests.result != 'success'
        run: |
          echo "::error::the tests matrix did not succeed (result: ${{ needs.tests.result }})"
          exit 1

      - uses: actions/download-artifact@v4
        with:
          pattern: gf-shard-*
          path: shard-artifacts

      # RULE 11: the gate proves it can go red before it is believed. Five ways a shard split can
      # break -- a missing shard, tests selected by nobody, shards that collected different trees,
      # a file claimed twice, no manifests at all -- each must fire.
      - name: The reconciliation can go red (--self-test)
        run: python tools/gf_shard_verdict.py --self-test

      - name: Union verdict -- skip census, quantifier spy, and every test ran once
        run: |
          python tools/gf_shard_verdict.py \
            --artifacts shard-artifacts \
            --expected-skips greenfield/eldenring/tests/expected_skips_ci.json

  # ---------------------------------------------------------------------------------------------
  # 1c. THE WIZARD AND TOOL GATES, lifted out of `tests` when it was sharded (#865).
  #
  #     They are ~40s of AP-light checks that used to ride along after an 18-minute pytest step, so
  #     a wizard-only defect waited for the whole suite to report. Pinning them to one shard of the
  #     matrix was the cheaper edit and the wrong one: it would couple "the wizard gates ran" to
  #     "shard 1 exists", and the shard count is a number someone will change.
  # ---------------------------------------------------------------------------------------------
  wizard-gates:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read the Archipelago pin
        id: ap
        run: echo "version=$(cat .ap-version)" >> "$GITHUB_OUTPUT"

      - name: Check out stock upstream Archipelago
        uses: actions/checkout@v4
        with:
          repository: ArchipelagoMW/Archipelago    # UPSTREAM. Never a fork -- see bootstrap-ap.ps1.
          ref: ${{ steps.ap.outputs.version }}
          path: _ap

      - name: Install Archipelago's requirements
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools<80"
          pip install -r _ap/requirements.txt

      - name: Materialise gen_data's inputs from the committed bundle
        run: python tools/gen_inputs.py --ensure elden_ring_artifacts

      # Wizard metadata drift, against the LIVE GFOptions -- the only instrument that can tell the
      # three committed artifacts (wizard/options-metadata.json, the blob inlined in
      # wizard/wizard.html, presets/*.yaml) apart from the option docstrings they are supposed to
      # mirror. It needs an AP import, so it can only live in a job that has one.
      #
      # MOTIVATING CASE (CONTRIBUTING rule 11): run_ci.ps1 had this gate commented out from
      # 2026-07-04, and it was the ONLY copy. Between 3381174 and 9ce2476 four commits regenerated
      # the JSON without re-injecting, and the wizard page lost dungeon_sweep,
      # pool_builder_intensity and region_grace_unlock -- 6197 bytes of missing options that no
      # test, no gate and no human caught for 36 hours. run_ci.ps1 is Alaric's box only; THIS runs
      # on every push, which is the point.
      - name: Wizard metadata drift (--check against the pinned AP)
        run: python tools/dump_options_metadata.py --check --ap-dir _ap

      # The seed-size census the wizard shows a player WHILE they choose (wizard/region-census.json,
      # tools/build_region_census.py). Its data is gated by test_gf_region_census, which runs in the
      # pytest step above -- but no Python test executes ERW.seedSize, and that JS is what the player
      # actually reads. This runs it under node against an independent Python evaluation of the same
      # rule. It earned its place on its first run: the Python port had dropped the trailing `^ t`
      # from mulberry32 (`^` binds looser than `+` in JS), and the two implementations still agreed
      # to within 1% on every median -- close enough that no eyeball would have flagged it.
      # Exits 4 = SKIP when node is absent; GitHub runners have node, so it is live here.
      - name: Wizard seed-size JS vs Python (differential)
        run: python tools/check_wizard_census_js.py

      # The per-key presentation the progression-surface grid is drawn from (labels, families, and
      # the DERIVED subset lattice). Two blind spots it closes: a class no family claims is simply
      # not drawn, so the player cannot select something the world offers and the page still looks
      # complete; and the redundancy hint inverts the containment relation, which is the one thing
      # here that has already been written down backwards once -- as a comment in contract.py, for
      # months. Exits 4 = SKIP when node is absent.
      - name: Wizard key_meta structure + coverage inversion (differential)
        run: python tools/check_wizard_keymeta_js.py

      # A dungeon sweep's membership is cut in two places that never see each other: gen_data bakes
      # out the permanent floor, features/boss_locks cuts the rest per seed against the player's
      # Progression Surface. A new premium class filed in neither is baked into every sweep and cut
      # by nobody -- and gen_data is not installed into an AP world, so no unit test can see it.
      - name: Sweep cut partitions the surface vocabulary
        run: python tools/check_sweep_cut_partition.py

      # The wizard's option SURFACE cannot drift (it is generated). Its hand-written CONFLICT RULES
      # could, and did: the shipped wizard warned about `ending_condition: capital`, `world_logic`
      # and `num_regions_rune_source` -- 20 dead keys in all -- because a rule whose option vanishes
      # just stops firing, which looks exactly like a rule with nothing to say.
      - name: Wizard lint-rule currency (rules must name live options)
        run: python tools/check_wizard_lint_currency.py

      # ...and the step that RENDERS it. Every gate above reads the page as text -- the metadata is
      # current, the blob is in sync, the rules name live options, the JS maths matches Python --
      # and not one of them draws it. Both 2026-08-08 wizard defects were invisible to all of them:
      # a card whose guard read a frozen option and never rendered, and a step that painted into a
      # tree it had not attached yet, so the whole Seed size tab was blank on arrival. Neither threw:
      # a missed DOM lookup is null and an empty div renders fine. This walks every step through the
      # rail's own click handlers under tools/wizard_dom_shim.js, and carries a self-test that
      # re-introduces the detached paint and fails if the shim does not notice.
      - name: Wizard renders (every step draws, under a DOM shim)
        run: python tools/check_wizard_renders.py

      # The YAML importer accepts only COMPLETE output from this wizard, and every imported value
      # must be one its rendered control can represent.  Exercise the shipped parser against the
      # shipped emitter so partial/weighted YAML and invalid option values cannot quietly enter
      # state while the controls display something else (#735).
      - name: Wizard YAML import round-trip and refusal contract
        run: python tools/check_wizard_yaml_import.py

      # Every option KIND the dumper can emit must have a control that draws it. The branch list in
      # controlFor ends in an `else` that makes a text box, so an unhandled kind does not fail -- it
      # DEGRADES into the widget that can hold anything. `curated_filler` (kind: "dict") fell in
      # there, rendered as the literal string "[object Object]", and editing it wrote that string
      # into the player's yaml where the world wants a mapping (#571).
      #
      # AP-FREE on purpose, so it runs in this job rather than only in the one that can import
      # Archipelago -- the drift gate that would have shown the empty `valid_keys`
      # (dump_options_metadata.py --check) needs an AP checkout, and a gate that runs in one job
      # only is a gate that gets skipped.
      - name: Wizard controls exist for every option kind
        run: python tools/check_wizard_kind_controls.py

  # ---------------------------------------------------------------------------------------------
  # 1b. REGEN FROM THE BUNDLE + the fill-regression gate.
  #
  #     gen_data.py used to be un-runnable anywhere but Alaric's box, because it needs
  #     elden_ring_artifacts/. gen_inputs.db (2026-07-27) carries the 982 files it actually reads --
  #     13 param CSVs, 15 FMG XMLs, the decompiled EMEVD and talk ESD, no MSBs -- verbatim, 3.7 MB.
  #     So CI can now regenerate and check the committed output for real, instead of trusting that
  #     whoever last touched a generator remembered to.
  #
  #     🛑 The check is on _gen_stamp.json's per-module body_sha256, NOT on a raw git diff. A regen
  #     off the bundle differs from one off the full artifacts in exactly one field -- inputs_hash,
  #     which covers the whole declared input set including files gen_data never reads. MEASURED
  #     2026-07-27: 11/11 module body hashes identical across a Windows-artifacts regen and a
  #     Linux-bundle regen, while inputs_hash differed. A diff-based gate would call that red
  #     forever and teach everyone to ignore it.
  # ---------------------------------------------------------------------------------------------
  regen-and-fill:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read the Archipelago pin
        id: ap
        run: echo "version=$(cat .ap-version)" >> "$GITHUB_OUTPUT"
      - name: Check out stock upstream Archipelago
        uses: actions/checkout@v4
        with:
          repository: ArchipelagoMW/Archipelago
          ref: ${{ steps.ap.outputs.version }}
          path: _ap
      - name: Install Archipelago's requirements
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools<80"          # AP 0.6.x: pkg_resources removal
          pip install -r _ap/requirements.txt

      - name: Materialise gen_data's inputs from the committed bundle
        run: python tools/gen_inputs.py --ensure elden_ring_artifacts

      - name: Regenerate, and prove the committed output is not stale
        run: |
          python greenfield/gen_data.py
          python tools/gen_inputs.py --verify-regen HEAD

      # Install the world and run the fill gate. --check-yamls refuses a suite naming an option the
      # world does not have, so a stale config fails as ITSELF rather than as nine fill regressions
      # (which is exactly how the PowerShell gate misreported on 2026-07-26).
      - name: Fill-regression gate
        env:
          GF_AP_DIR: _ap
        run: |
          rm -rf _ap/worlds/eldenring
          cp -r greenfield/eldenring _ap/worlds/eldenring
          cp greenfield/region_map.csv _ap/worlds/eldenring/region_map.csv
          python tools/fill_regression.py --selftest
          python tools/fill_regression.py --count 8 --seed-base 20260727 --jobs 4

      # MULTIWORLD. Everything above generates ONE world, so every claim about how Elden Ring
      # behaves BESIDE another game had only ever been argued. On 2026-07-28 that cost a real
      # answer: a review reported that natural_progression keys never leave their own world, which
      # is true in a single-player harness and false in a multiworld -- and nothing here could tell
      # the two apart. Two ER slots beside two slots of each PARTNER game in the script's list
      # (Hollow Knight, Bumper Stickers, DOOM 1993 -- all ship with AP, pure Python, no ROM, and
      # deliberately spread across ~100/~200/~350 locations because every cross-world number is a
      # number about the partner as much as about us). Exits 4 = SKIP when NO partner world is
      # present; this job checks out stock upstream in full, so it runs.
      # The guards below are all currently TRUE, so a green smoke proves they were REACHED, not
      # that they can go red. --self-test fires each one on a hand-built fault. No Archipelago, no
      # generation, milliseconds -- so it runs FIRST and fails fast.
      - name: Multiworld smoke -- guards can go red (--self-test)
        run: python tools/gf_multiworld_smoke.py --self-test

      - name: Multiworld smoke (partner matrix + four-game/default-control shapes)
        # rc is captured with `|| rc=$?`, NOT a bare `rc=$?` on the next line: GitHub runs `run:`
        # blocks under `bash -e`, so a non-zero exit aborts the step BEFORE the assignment is
        # reached. The exit-4 SKIP tolerance below was therefore dead code and had never once been
        # reachable on Linux -- a SKIP was indistinguishable from a failure (#494). It has not bitten
        # only because CI checks out stock upstream in full, so a partner world is always present.
        run: |
          rc=0
          python tools/gf_multiworld_smoke.py --ap-dir _ap || rc=$?
          if [ "$rc" = "4" ]; then echo "::warning::multiworld smoke SKIPPED -- no partner world present"; fi
          test "$rc" = "0" -o "$rc" = "4"

  # ---------------------------------------------------------------------------------------------
  # 2. The AP-FREE generators. These need no Archipelago and no game artifacts -- only committed
  #    greenfield data -- so CI can run them, and they are precisely what broke the Windows build.
  #    Two failure modes, both caught here:
  #      a) the generator CRASHES (the is_big_ticket rename)
  #      b) the generator runs but its committed OUTPUT is STALE (someone changed the data and never
  #         regenerated) -- caught by failing on a non-empty git diff.
  # ---------------------------------------------------------------------------------------------
  generators:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
        with:
          # TAGS. `check_release_notes.py` cannot tell a SHIPPED version from an open window
          # without them, and actions/checkout fetches none by default -- it would print
          # "window: UNCHECKED" and the job would stay green, which is a gate that is switched
          # off while looking on. Verified by cloning shallow and watching it skip.
          fetch-tags: true
          fetch-depth: 0

      # THE CLIENT IS CHECKED OUT AT THE GITLINK -- the commit this repo actually pins -- and NOT at
      # client `main`. Until 2026-08-02 it was the other way round, under a comment arguing that a
      # gitlink diff would be "a permanent red herring". It is the exact opposite: the gitlink diff is
      # the only signal in this job that describes something this repo SHIPS.
      #
      # Checking out client main asserted "client main already contains output generated from world
      # main" -- a claim about two independently-moving branches. It failed in both directions:
      #   a) FALSE RED. Any world PR touching a cross-repo generated artifact violates it by
      #      construction and stays red until the client side merges. #290 and #291 were both merged
      #      red for precisely this, which trains everyone to merge past this job.
      #   b) FALSE GREEN, which is worse, because nothing ever looked at the pin -- so it could rot
      #      arbitrarily far behind while every gate stayed green.
      #
      # MOTIVATING CASE for (b) (CONTRIBUTING rule 11). On 2026-08-02 world main was 0ff714c, the
      # gitlink was c2fc8ed, and client main was f2ef85d. Regenerating against client main produced
      # NO diff -- green. Regenerating against the PIN produced:
      #     crates/eldenring-archipelago/src/contract_gen.rs | 3 ++-
      #     +    ContractKey { name: "auto_equip", shape: Shape::BoolOrInt, required: false, ... }
      #     -pub const APWORLD_VERSION_EXPECTED: &str = "0.3.0";
      #     +pub const APWORLD_VERSION_EXPECTED: &str = "0.3.1";
      # A bundle cut from main that day would have shipped a v0.3.1 apworld against a v0.3.0 DLL that
      # had never heard of auto_equip, and no gate in this file could see it. The same shape nearly
      # cost the v0.3 cut: that pin's CONTRACT_HASH was stale while its APWORLD_VERSION_EXPECTED was
      # correct, so the runtime version handshake could not catch it either.
      #
      # What the client-main checkout WAS buying -- "has the client drifted ahead of us?" -- is not
      # lost. It moved to `client-main-drift` (job 3), off the pull_request trigger, where it cannot
      # deadlock a PR.
      - name: Resolve the PINNED client commit (the gitlink, not client main)
        id: pin
        run: |
          sha="$(git ls-tree HEAD from-software-archipelago-clients | awk '$2 == "commit" { print $3 }')"
          test -n "$sha" || { echo "::error::no gitlink at from-software-archipelago-clients"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "pinned client commit: $sha"

      # A separate checkout rather than `submodules: true` on the one above, for three reasons: it
      # keeps `repository:` readable without opening .gitmodules; it leaves the superproject a plain
      # non-submodule tree, so the apworld staleness diff below keeps exactly its current semantics;
      # and it is line-for-line the block `client-main-drift` uses with `ref: main`, so the two jobs
      # stay diffable against each other. gen_region_locks / gen_contract WRITE INTO this path,
      # exactly as before -- only the commit underneath them changed.
      - uses: actions/checkout@v4
        with:
          repository: 4laric/from-software-archipelago-clients
          ref: ${{ steps.pin.outputs.sha }}
          path: from-software-archipelago-clients

      # Four suites in the loop below (client_contract_paths, client_can_sell_mirror,
      # client_resets_are_called, scaling_ladder_mirror) SKIP when this directory is absent, and they
      # sat dark for weeks for exactly that reason. A checkout that lands the wrong tree -- or no tree
      # -- must be louder than a green run, so assert it instead of inferring it from a passing loop.
      - name: The client checkout is real, and is the pin
        run: |
          test -d from-software-archipelago-clients/crates \
            || { echo "::error::client checkout has no crates/ -- the cross-side gates would SKIP and gate nothing"; exit 1; }
          have="$(git -C from-software-archipelago-clients rev-parse HEAD)"
          test "$have" = "${{ steps.pin.outputs.sha }}" \
            || { echo "::error::client HEAD $have is not the pinned ${{ steps.pin.outputs.sha }}"; exit 1; }
          echo "client at the pin: $have"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PyYAML ONLY. This job deliberately has no Archipelago -- the suites below are AP-free by
      # design. But test_gf_shipping_yaml_recipe reads release/EldenRing.yaml, and it SKIPS
      # when yaml is missing: without this line it would be added to the loop below and still gate
      # nothing, which is the exact failure mode the loop's comment warns about.
      - name: Install PyYAML (the shipping-yaml gate reads the template)
        run: pip install pyyaml

      # er_yaml_lint is AP-free (PyYAML only) and runs in milliseconds, which is why it belongs
      # here rather than in regen-and-fill. Until now NO workflow ran it at all -- it was reachable
      # only from pregen.py and a PowerShell script, so a rule could rot for weeks and nothing
      # noticed. Rule 0 (unknown keys + the REMOVED migration table) HAD rotted: its loader looked
      # for an `EROptions` class at two paths that stopped existing at the greenfield port, and the
      # `if VALID_KEYS:` guard turned that into silence instead of a failure.
      #
      # --self-check runs FIRST and on its own, because a linter whose key list failed to load
      # reports zero errors on everything -- indistinguishable from clean. It asserts the surface
      # loaded, is plausibly sized, and includes the FROZEN options (the half whose absence produces
      # false "unknown option" errors on real yamls, which is how a linter gets switched off).
      - name: er_yaml_lint is armed, and the shipped yamls pass it
        run: |
          python er_yaml_lint.py --self-check
          python er_yaml_lint.py --strict \
            release/EldenRing.yaml presets/*.yaml greenfield/playtest-yamls/*.yaml

      # infinite_shop_rows re-derives the 14 shelves from the vanilla ShopLineupParam, and
      # elden_ring_artifacts/ is gitignored -- so without this the test would skip here and gate
      # nothing. It can extract the bundle itself, but doing it as its own step keeps the ~60 MB
      # and its runtime visible in the log instead of hidden inside a test.
      - name: Materialise the param inputs from the committed bundle
        run: python tools/gen_inputs.py --ensure elden_ring_artifacts

      # CONTRIBUTING rule 14, and deliberately in THIS job: check_release_notes.py imports
      # nothing and parses APWORLD_VERSION out of contract.py textually, so it does not need the
      # Archipelago checkout the `tests` job pays for. It goes red when the open version has no
      # `## v<version> — <date>` section in release/CHANGELOG.md, when that section is EMPTY
      # (rule 2 -- a heading with nothing under it is not a release note), or when
      # release/BLURB-v<version>.md is missing, a stub, or headed with another version.
      # It also walks every first-parent client gitlink bump since the last release tag and requires
      # that SAME commit to update the changelog or carry the exact no-visible-change trailer. This
      # is the client half of rule 14 (#709); a non-empty section alone cannot satisfy it.
      #
      # MOTIVATING CASE (rule 11): v0.3.0 shipped 2026-08-01 and by 2026-08-02 main carried five
      # more player-visible fixes -- two straight off Nexus bug reports -- with no v0.3.1 section
      # and no blurb, and no BLURB-v0.3.0.md either. The blurb series had stopped at v0.2.18 and
      # nothing was looking. Reconstructing the notes cost a `v0.3.0..main` walk plus four commit
      # bodies, which answer "what changed", not "why it mattered".
      - name: Release notes exist for the open version (rule 14)
        run: python tools/check_release_notes.py

      # CONTRIBUTING rule 15, same job and for the same reason: check_contract_version.py loads
      # greenfield/eldenring/contract.py by PATH (it is AP-free) and needs no Archipelago checkout.
      # Red when CONTRACT_HASH disagrees with the release/CONTRACT-VERSIONS.tsv row for the
      # open APWORLD_VERSION, or when that version has no row at all.
      #
      # MOTIVATING CASE (rule 11), measured from this repo's own tags: APWORLD_VERSION "0.2.0"
      # shipped FIVE distinct contract shapes (36013f63 -> 03c58b40 -> 54514b10 -> 84dd6ab8 ->
      # b3739fdf). The handshake DOES detect a mismatch -- what was lost is the ability to say
      # which 0.2.0 a player had. Reproduce with `check_contract_version.py --derive-history`.
      - name: Contract changes carry a version bump (rule 15)
        run: python tools/check_contract_version.py


      # The ledger BEFORE the loop: the loop below is generated from it, so an unledgered
      # repo-only suite must fail the job before a green loop can imply "everything ran".
      - name: Every repo-only suite is in a CI job or explicitly ledgered
        run: python tools/gf_suite_ledger.py --check

      - name: Generators run, and their committed output is not stale
        run: |
          # ONE ENTRYPOINT, NOT A LIST (issue #699, 2026-08-15). These steps used to be enumerated
          # here, again in build.ps1, and a THIRD time -- incompletely -- in AGENTS.md section 5a,
          # which is the copy humans and agents are told to follow. It named no page builder at
          # all, so PR #698 followed it exactly and this job went red on ONE line: a page's
          # inputs_hash stamp. tools/regen_all.py is now the single list and all three consumers
          # call it, so the doc cannot drift from CI -- there is nothing left to enumerate.
          #
          # What `--phases tables,pages` covers, and why each is here rather than remembered:
          #   * region_locks.rs / contract_gen.rs -- generated FROM greenfield data, living in the
          #     client repo, checked out at the gitlink. The second diff below is what reads them.
          #   * gen_area_tiers.py --check -- the baked area-tier table (client PR #126). Its DATA
          #     half needs the MSBs and lives on Alaric's box (tier-2); this half is a pure read of
          #     the committed greenfield/area_tiers.tsv, so CI can hold the client's bytes to it.
          #     client-main-drift would NOT catch a stale one: that job only re-runs
          #     gen_region_locks and gen_contract. 🛑 This step was in THIS list and missing from
          #     build.ps1 -- the disagreement issue #699 found. regen_all.py keeps it.
          #   * the three offline pages + greenfield/questline_dag.tsv -- pure joins over committed
          #     greenfield data. Each page is stamped with data.py's inputs_hash (NOT the commit)
          #     and written LF, so a regen here is byte-identical to a Windows one and the diff
          #     below is meaningful. Mermaid is fetched from a CDN at VIEW time, never at build
          #     time, so the questline page is offline-safe and byte-deterministic like the rest.
          #
          # gen_data.py is deliberately NOT re-run here (the `regen-and-fill` job owns that, with
          # Archipelago installed); this job holds the committed modules' READERS to them.
          python tools/regen_all.py --phases tables,pages

          # These suites test REPO TOOLING (tools/ + the committed pages), so they only run
          # from a repo checkout -- gf_test.py installs the world into _ap/worlds/eldenring with no
          # tools/ alongside, where they correctly SKIP. This is the job that has the real tree, so
          # this is where they must actually execute.
          # Run as SCRIPTS, not `-m greenfield.eldenring.tests.X`: the package __init__ imports
          # core -> BaseClasses, and this job has no Archipelago. The suites are AP-free by design
          # (they read the generated modules with ast) and each has a __main__ entry point.
          #
          # THE LIST IS DERIVED, NOT TYPED (2026-08-04, inert-test audit finding #3). It was 12
          # hand-typed names, and that hand-maintenance is exactly how test_gf_scadu_supply's
          # client-rung mirror and test_gf_data's client-table gates fell dark: their sibling
          # scaling_ladder_mirror was typed in, they were not, and nothing could tell. The names
          # now come from tools/gf_suite_ledger.py, whose --check (previous step) fails RED on any
          # repo-only suite that is neither in this loop nor explicitly ledgered -- a new suite
          # cannot be silently dark, its author must file it somewhere on purpose.
          for t in $(python tools/gf_suite_ledger.py --generators-list); do
            echo "--- test_gf_$t.py"
            python "greenfield/eldenring/tests/test_gf_$t.py" -v 2>&1 | tail -5
            # `python x.py` exits nonzero on failure; pipefail-less bash would swallow it
            test "${PIPESTATUS[0]}" -eq 0 || exit 1
          done

          # Check the two things that are actually GENERATED OUTPUT, in the two places they live.
          #
          # The superproject diff below still EXCLUDES the client path, but ONLY so the two failures
          # keep separate messages -- "regenerate the apworld" and "land the client half" have
          # different fixes and pointing at both at once helps nobody. The exclusion is no longer
          # hiding anything: since 2026-08-02 the client is checked out AT the gitlink, so that path
          # is clean unless a generator dirtied it, and the check immediately below is what looks.
          fail=0
          if ! git diff --quiet -- . ':(exclude)from-software-archipelago-clients'; then
            echo "::error::apworld generated output is STALE -- regenerate and commit:"
            git --no-pager diff --stat -- . ':(exclude)from-software-archipelago-clients'
            fail=1
          fi
          # The CROSS-REPO artifacts (contract_gen.rs, region_locks.rs) are written INTO the client,
          # at the PINNED commit. A diff here means one thing and it is unambiguous: the client commit
          # this repo ships against does not contain the output this repo generates, so a bundle cut
          # from this tree would pair an apworld with a DLL that disagrees with it.
          #
          # THE FIX IS AN ORDERING, and it is not optional (AGENTS.md section 7): land the CLIENT PR
          # first, then bump the gitlink in the SAME world commit that changes the generated artifact.
          # A follow-up "bump the submodule" commit is not equivalent -- it leaves a window in which
          # main is red here and a tag cut from it ships the mismatch.
          #
          # tracker_regions.rs is GONE (2026-07-28): the tracker's region model is sent in slot_data
          # (locationRegions / regionCoarseKeys), so an apworld region change no longer needs a
          # regenerated table pushed to the client repo at all.
          if ! git -C from-software-archipelago-clients diff --quiet; then
            echo "::error::the PINNED client commit does not contain the output this repo generates -- land the client half, then bump the gitlink in THIS commit (AGENTS.md section 7):"
            git -C from-software-archipelago-clients --no-pager diff --stat
            fail=1
          fi
          exit $fail

  # ---------------------------------------------------------------------------------------------
  # 3. CLIENT-MAIN DRIFT -- the half of the old bypass that was worth keeping.
  #
  #    `generators` above tests the pairing this repo SHIPS (the gitlink). This job answers the other
  #    question: has client main moved out from under the pin in a way that matters? That is what the
  #    old client-main checkout was buying, minus its ability to deadlock a PR.
  #
  #    NOT on `pull_request`, deliberately. A world PR cannot fix client main, so reddening a PR over
  #    it only teaches people to merge red -- which is how #290 and #291 landed.
  #
  #    BLOCKING, not advisory, and that is a decision worth stating. The doctrine here is that main
  #    stays green, and a job that can only ever emit `::warning::` is a dormant oracle: it
  #    manufactures the appearance of coverage while nobody reads it (#244's grace-skip oracle, and
  #    the four cross-side gates that skipped silently for weeks, are the local precedent). So it
  #    FAILS -- but only on the one case a human must act on, and it never fails for a reason the
  #    world repo cannot address:
  #      * pin == client main                     -> silent pass.
  #      * pin BEHIND main, generators clean      -> ::notice::, PASS. Client-only work (Rust fixes,
  #                                                  refactors) is allowed to run ahead of the pin;
  #                                                  bumping is optional now and the release
  #                                                  checklist requires it before a tag.
  #      * generators DIRTY against client main   -> FAIL. Either a client PR landed the client half
  #                                                  of a cross-repo change whose world half has not
  #                                                  merged (the red is ACCURATE -- main really is
  #                                                  mid-landing -- and the world PR that clears it is
  #                                                  already in flight), or a generated file was
  #                                                  hand-edited, which CONTRIBUTING forbids.
  # ---------------------------------------------------------------------------------------------
  client-main-drift:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      # Same block as `generators`, with `ref: main` instead of the gitlink. Keeping them
      # textually parallel is the point: the ONLY difference between the two jobs is which client
      # commit the generators are pointed at.
      - uses: actions/checkout@v4
        with:
          repository: 4laric/from-software-archipelago-clients
          ref: main
          path: from-software-archipelago-clients

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # gen_region_locks and gen_contract are AP-free and need no game artifacts -- they read
      # committed greenfield data only -- so this job installs nothing.
      - name: Regenerate the cross-repo artifacts against client MAIN
        run: |
          pin="$(git ls-tree HEAD from-software-archipelago-clients | awk '$2 == "commit" { print $3 }')"
          head="$(git -C from-software-archipelago-clients rev-parse HEAD)"
          test -d from-software-archipelago-clients/crates \
            || { echo "::error::client checkout has no crates/ -- this job would report clean while testing nothing"; exit 1; }
          echo "pinned gitlink : $pin"
          echo "client main    : $head"

          python tools/gen_region_locks.py
          python greenfield/gen_contract.py

          if ! git -C from-software-archipelago-clients diff --quiet; then
            echo "::error::client main does NOT contain the output world main generates -- a cross-repo change is half-landed:"
            git -C from-software-archipelago-clients --no-pager diff --stat
            git -C from-software-archipelago-clients --no-pager diff
            echo "Fix: land the missing half, then bump the gitlink in the SAME world commit as the generated-output change (AGENTS.md section 7)."
            exit 1
          fi

          if [ "$pin" != "$head" ]; then
            echo "::notice::gitlink $pin is BEHIND client main $head, but the generated artifacts agree -- client-only work. A bump is optional now and REQUIRED before a tag (RELEASE-CHECKLIST)."
          else
            echo "gitlink == client main; nothing has drifted."
          fi
